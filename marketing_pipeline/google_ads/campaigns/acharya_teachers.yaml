# ─────────────────────────────────────────────────────────────────────────────
# CAMPAIGN SPEC — Acharya for Teachers (Patna coaching-owners)
# One file = one campaign. The CLI reads it; or paste it into the Google Ads UI.
#
# POSITIONING (rewritten 2026-07-26): the product is now the TEST GENERATOR + CLASS
# TRACKER — "Create a JEE/NEET test in seconds, share ONE link with your students,
# and see exactly who is weak in which topic, automatically." NOT the old AI-tutor /
# doubt-solver pitch (that pointed at gurukul.trigunai.com/demo — retired here).
#
# TARGET: people who ALREADY run a coaching business and HAVE students — institute /
# tuition owners — not job-seekers, B.Ed aspirants, or parents hiring a tutor.
#
# Goal: drive a teacher into a FREE SIGNUP (account created at /teacher/signup). The
# tracked conversion = that signup (fires on /teacher?new=1, a real new teacher account,
# not a click).
#
# BEFORE launching: create the "Teacher signup" conversion action in Google Ads
# (Goals → Conversions → New → Website), take its LABEL, and set it on the LMS container:
#   az containerapp update -n lms -g trigunai-video-creator \
#     --set-env-vars TEACHER_SIGNUP_CONV_LABEL=<label>
# Until that env is set the tag stays silent (no double-firing, no fake counts).
# Also redeploy the current LMS image — the teacher-conversion code shipped 2026-07-26
# and is not in prod yet.
# ─────────────────────────────────────────────────────────────────────────────

name: "Acharya · Teachers · Patna · 2026-07"
status: PAUSED            # ALWAYS starts paused — you review in the UI, then enable. Never auto-spends.

budget:
  daily_inr: 200         # ₹200/day (Deepak, 2026-07-26). Patna-only; pairs with Rohan's offline field motion.

bidding:
  strategy: MANUAL_CPC    # most predictable for a small test; switch to MAXIMIZE_CONVERSIONS after ~15-30 signups
  max_cpc_inr: 15         # owner clicks cost more than student clicks; ceiling keeps a small budget from burning on one word

schedule:
  start_date: "2026-07-26"   # YYYY-MM-DD — set to when you flip it on
  end_date:   "2026-08-16"   # ~3 weeks; auto-stops here

geo:
  # PATNA CITY ONLY (Deepak, 2026-07-26) — this is the campaign that pairs most directly with the
  # offline push, so Rohan can follow up in person. In the Ads UI set Location options →
  # "Presence: people IN this location" (NOT "presence or interest").
  locations: ["Patna, Bihar, India"]
languages: ["English", "Hindi"]

final_url: "https://acharya.trigunai.com/teacher"   # the teacher signup/console landing (email or Google → account)

ad_group:
  name: "coaching-owner-test-creation"

# ── KEYWORDS — an OWNER who runs classes and needs to test/track students, in their words. ──
# match: phrase (controlled). Geo already restricts to Patna, so the un-suffixed terms fire for
# local owners who didn't type the city; the "patna" ones catch the minority who did.
keywords:
  - { text: "online test creation for coaching classes", match: PHRASE }
  - { text: "test generator for teachers",       match: PHRASE }
  - { text: "create online test for students",   match: PHRASE }
  - { text: "jee neet test generator",           match: PHRASE }
  - { text: "coaching institute test software",  match: PHRASE }
  - { text: "question bank for coaching classes", match: PHRASE }
  - { text: "manage students test coaching class", match: PHRASE }
  - { text: "class test creation tool",          match: PHRASE }
  - { text: "online test maker for teachers",    match: PHRASE }
  - { text: "coaching institute in patna",       match: PHRASE }
  - { text: "jee neet coaching institute patna", match: PHRASE }
  # Hindi transliteration
  - { text: "coaching ke liye test banane wala app", match: PHRASE }
  - { text: "students ka test lene wala app",     match: PHRASE }

# ── NEGATIVE KEYWORDS — keep out job-seekers, B.Ed aspirants, and PARENTS hiring a tutor. ──
negative_keywords:
  - { text: "job",              match: BROAD }
  - { text: "jobs",             match: BROAD }
  - { text: "vacancy",          match: BROAD }
  - { text: "salary",           match: BROAD }
  - { text: "recruitment",      match: BROAD }
  - { text: "teacher training", match: PHRASE }
  - { text: "how to become a teacher", match: PHRASE }
  - { text: "b.ed",             match: BROAD }
  - { text: "tutor near me",    match: PHRASE }   # a PARENT hiring a tutor — wrong buyer, wrong page
  - { text: "home tutor",       match: PHRASE }
  - { text: "private tutor for my child", match: PHRASE }
  - { text: "free download",    match: PHRASE }
  - { text: "pdf",              match: BROAD }

# ── RESPONSIVE SEARCH AD — headlines ≤30 chars, descriptions ≤90 chars. ──
ad:
  headlines:
    - "JEE/NEET Test in Seconds"
    - "Acharya Tests & Tracks"
    - "Share One Link — Done"
    - "See Who's Weak in What"
    - "For Patna Coaching Classes"
    - "No Password, No Payment"
    - "AI Test Maker for Teachers"
    - "Track Every Student Auto"
    - "Create a Class Test Free"
    - "Your Class, Auto-Diagnosed"
    - "Free Setup for Institutes"
    - "Built for Indian Teachers"
  descriptions:
    - "Create a JEE or NEET test in seconds, share one link, see who's weak in which topic."
    - "For coaching & tuition owners. Auto weak-topic tracking per student. No payment to start."
    - "Give a subject, get an exam-authentic test. Share the link. See every student's gaps."
    - "Set up your class free — no password, no card. Test and track students in minutes."
