// State
let completedTasks = JSON.parse(localStorage.getItem('trigunai-launch-completed') || '{}');
let activeWeek = null;
let activeFilter = 'all';

function getToday() {
  return new Date();
}

function getDayNumber() {
  const today = getToday();
  const diff = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24)) + 1;
  return Math.max(1, Math.min(diff, 44));
}

function getDaysLeft() {
  const today = getToday();
  const diff = Math.ceil((LAUNCH_DATE - today) / (1000 * 60 * 60 * 24));
  return Math.max(0, diff);
}

function getCurrentWeek() {
  const d = getDayNumber();
  if (d <= 7) return 1;
  if (d <= 14) return 2;
  if (d <= 21) return 3;
  if (d <= 28) return 4;
  if (d <= 35) return 5;
  return 6;
}

function toggleTask(idx) {
  const key = `task-${idx}`;
  if (completedTasks[key]) {
    delete completedTasks[key];
  } else {
    completedTasks[key] = Date.now();
  }
  localStorage.setItem('trigunai-launch-completed', JSON.stringify(completedTasks));
  render();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}

function setWeek(w) {
  activeWeek = (activeWeek === w) ? null : w;
  render();
}

function render() {

  const daysLeft = getDaysLeft();
  const currentWeek = getCurrentWeek();

  document.getElementById('days-left').className = `stat-value ${daysLeft > 20 ? 'blue' : daysLeft > 7 ? 'amber' : 'red'}`;
  document.getElementById('tasks-done').textContent = doneTasks;
  document.getElementById('tasks-total').textContent = totalTasks;
  document.getElementById('pct-complete').textContent = pct + '%';
  document.getElementById('pct-complete').className = `stat-value ${pct >= 80 ? 'green' : pct >= 40 ? 'amber' : 'blue'}`;
  document.getElementById('progress-bar').style.width = pct + '%';

  // Today banner
  const today = getToday();
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('today-title').textContent = `Day ${currentDay} of 44`;
  document.getElementById('today-date').textContent = `${dayNames[today.getDay()]}, ${monthNames[today.getMonth()]} ${today.getDate()} — ${daysLeft} days to launch`;

  // Timeline
  const timelineEl = document.getElementById('timeline');
  const weekLabels = ['Week 1\nDesign', 'Week 2\nRecord', 'Week 3\nBuild', 'Week 4\nSell', 'Week 5\nPush', 'Week 6\nLaunch'];
  let timelineHtml = '';
  for (let w = 1; w <= 6; w++) {
    const weekTasks = TASKS.filter((t, i) => t.week === w && !t.isGate);
    const weekDone = weekTasks.filter((t, i) => {
      const origIdx = TASKS.indexOf(t);
      return completedTasks[`task-${origIdx}`];
    }).length;
    const isActive = activeWeek === w;
    const isCurrent = currentWeek === w;
    timelineHtml += `<div class="week-pill ${isActive ? 'active' : ''} ${isCurrent ? 'current-week' : ''}" onclick="setWeek(${w})">
      ${weekLabels[w-1].split('\n')[0]}<br><small>${weekLabels[w-1].split('\n')[1]}</small>
      <div class="week-progress">${weekDone}/${weekTasks.length}</div>
    </div>`;
  }
  timelineEl.innerHTML = timelineHtml;

  // Tasks
  const container = document.getElementById('tasks-container');
  let html = '';
  let lastDay = 0;
  let lastPhase = '';

  const filteredTasks = TASKS.map((t, i) => ({...t, idx: i})).filter(t => {
    if (activeWeek && t.week !== activeWeek) return false;
    if (activeFilter === 'today' && t.day !== currentDay) return false;
    if (activeFilter === 'A' && t.track !== 'A') return false;
    if (activeFilter === 'B' && t.track !== 'B') return false;
    if (activeFilter === 'C' && t.track !== 'C') return false;
    if (activeFilter === 'incomplete' && (completedTasks[`task-${t.idx}`] || t.isGate)) return false;
    return true;
  });

  for (const t of filteredTasks) {
    // Phase divider
    if (t.phase !== lastPhase && !activeWeek) {
      if (lastPhase) {
        html += `<div class="phase-divider"><span>Phase: ${t.phase}</span></div>`;
      }
      lastPhase = t.phase;
    }

    // Day header
    if (t.day !== lastDay) {
      lastDay = t.day;
      const dayClass = t.day === currentDay ? 'today' : (completedTasks[`task-${t.idx}`] || t.day < currentDay ? 'done' : 'future');
      const dateClass = t.day === currentDay ? 'today' : '';
      html += `<div class="day-header">
        <div class="day-num ${dayClass}">${t.day}</div>
        <div class="day-date ${dateClass}">${t.date}${t.day === currentDay ? ' — TODAY' : ''}</div>
      </div>`;
    }

    if (t.isGate) {
      html += `<div class="gate"><h3>GATE CHECK</h3><p style="font-size:13px;color:#ccc;">${t.text}</p></div>`;
    } else {
      const done = completedTasks[`task-${t.idx}`];
      const trackColors = { A: 'tag-A', B: 'tag-B', C: 'tag-C', '-': '' };
      const trackLabels = { A: 'Content', B: 'VR Build', C: 'Marketing', '-': 'Rest' };
      html += `<div class="task ${done ? 'completed' : ''}" onclick="toggleTask(${t.idx})">
        <div class="checkbox ${done ? 'checked' : ''}"></div>
        <div class="task-content">
          <div class="task-text">${t.text}</div>
          <div class="task-meta">
            <span class="tag ${trackColors[t.track] || ''}">${trackLabels[t.track] || t.track}</span>
            ${t.hours ? `<span class="tag tag-hours">${t.hours}h</span>` : ''}
            ${t.deliverable ? `<span style="font-size:11px;color:#666;">→ ${t.deliverable}</span>` : ''}
          </div>
        </div>
      </div>`;
    }
  }

  if (filteredTasks.length === 0) {
    html = `<div style="text-align:center;padding:40px;color:#555;">No tasks match this filter.</div>`;
  }

  container.innerHTML = html;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

// Initial render
render();
</script>
</body>
</html>
