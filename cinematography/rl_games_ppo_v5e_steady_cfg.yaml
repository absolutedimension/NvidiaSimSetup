params:
  seed: 42

  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [128, 128]           # same as v5d — single behavior, 20-dim obs
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: cinematographer_v5e_steady
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4             # v5e: HALVED from 3e-4 — prevents late-stage collapse
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.008             # v5e: HALVED from 0.016 — tighter policy updates
    score_to_win: 100000
    max_epochs: 2000                # v5e: DOUBLED from 1000 — more time with conservative LR
    save_best_after: 100            # v5e: more conservative — wait longer before saving "best"
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.001             # v5e: HALVED from 0.002 — even more deterministic
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 96              # v5e: DOUBLED from 48 — 1.92s horizon captures hold cycles
    minibatch_size: 24576
    mini_epochs: 8
    critic_coef: 2
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001
