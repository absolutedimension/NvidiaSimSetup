<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What is an agent? · TrigunAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="/static/celebrate.js"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#2b2b33; --muted:#8a8a99; --line:#ececf2;
    --lav-bg:#eef0fb; --lav-bd:#c9d0f5; --lav-deep:#3a44b8;
    --indigo:#5b63e6; --indigo-dk:#4a52d6;
    --grey-fill:#eceef4; --accepted:#9aa0ad;
    --green:#22c55e; --green-dk:#15803d;
    --red:#ef4444; --red-bg:#fdecec;
    --btn:#2d2d33; --btn-dis:#e6e6ec;
    --rc:18px; --rb:11px;
    --shadow:0 1px 2px rgba(30,30,60,.05),0 8px 24px rgba(30,30,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- top bar ---------- */
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid #f0f0f5;}
  .x-btn{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:12px;border-radius:99px;background:#eceef2;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1);}
  .dots{display:flex;gap:7px;}
  .dots > span{width:8px;height:8px;border-radius:50%;background:#dcdce4;transition:background .3s;}
  .dots > span.on{background:var(--green);}
  .streak{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:15px;}
  .streak svg{width:18px;height:18px;}

  /* ---------- stage ---------- */
  main{flex:1;display:flex;justify-content:center;padding:40px 24px 130px;}
  .stage{width:100%;max-width:620px;animation:rise .4s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .prompt{font-size:20px;font-weight:500;line-height:1.45;margin:0 0 8px;}
  .sub{font-size:15.5px;color:var(--muted);line-height:1.6;margin:0 0 22px;}
  .intro-art{font-size:46px;text-align:center;margin:18px 0 26px;}

  /* constraint checklist */
  .constraints{border:1.5px solid var(--lav-bd);border-radius:14px;padding:12px 16px;margin:0 0 18px;background:#fafbff;transition:border-color .3s;}
  .constraints.done{border-color:var(--green);}
  .crow{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);padding:4px 0;}
  .crow .ic{width:18px;height:18px;flex:0 0 18px;color:var(--muted);transition:color .3s;}
  .crow.met .ic{color:var(--green);}
  .crow.met{color:var(--green-dk);}

  /* options (MCQ) */
  .opts{display:flex;flex-direction:column;gap:12px;margin:0 0 8px;}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--lav-bd);background:#fff;
       border-radius:var(--rb);padding:15px 16px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;
       transition:.15s;width:100%;}
  .opt:hover{background:var(--lav-bg);}
  .opt .tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--lav-bd);}
  .opt.sel{border-color:var(--indigo);background:var(--lav-bg);}
  .opt.sel .tick{border-color:var(--indigo);background:var(--indigo);box-shadow:inset 0 0 0 3px #fff;}
  .opt.correct{border-color:var(--green);background:#effaf1;}
  .opt.correct .tick{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px #fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.dim{opacity:.5;}

  /* reveal cards */
  .cards4{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pcard{border:1.5px solid var(--lav-bd);background:var(--lav-bg);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.18s;}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .pcard.opened{background:#fff;border-color:var(--indigo);}
  .pcard h4{margin:0 0 4px;font-size:15.5px;font-weight:600;color:var(--lav-deep);display:flex;align-items:center;gap:8px;}
  .pcard .body{font-size:13.5px;color:var(--muted);line-height:1.55;max-height:0;overflow:hidden;transition:max-height .3s;}
  .pcard.opened .body{max-height:140px;margin-top:6px;}
  .pcard .em{font-size:22px;}

  /* classify */
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px;}
  .bucket{border:1.5px dashed var(--lav-bd);border-radius:14px;min-height:78px;padding:10px;background:#fafbff;transition:.15s;}
  .bucket.target{border-color:var(--indigo);background:var(--lav-bg);}
  .bucket .blabel{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .tray{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;}
  .chip{border:1.5px solid var(--lav-bd);background:#fff;border-radius:var(--rb);padding:9px 14px;font-size:14px;
        cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink);}
  .chip:hover{background:var(--lav-bg);}
  .chip.sel{border-color:var(--indigo);background:var(--indigo);color:#fff;}
  .chip.placed{border-color:var(--lav-bd);background:#fff;}
  .chip.ok{border-color:var(--green);background:#effaf1;color:var(--green-dk);}
  .chip.bad{border-color:var(--red);background:var(--red-bg);color:#b42318;}
  .bucket .holder{display:flex;flex-wrap:wrap;gap:8px;}

  /* order / loop builder */
  .seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:54px;border:1.5px solid var(--lav-bd);
       border-radius:14px;padding:12px;margin:0 0 14px;background:#fafbff;}
  .seq .slot{font-size:13.5px;color:var(--muted);}
  .arrow{color:var(--muted);font-size:14px;}

  /* reflect */
  .field{margin:0 0 16px;}
  .field label{display:block;font-size:14px;font-weight:500;margin:0 0 6px;}
  .field input{width:100%;border:1.5px solid var(--lav-bd);border-radius:var(--rb);padding:12px 14px;font:inherit;font-size:15px;}
  .field input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,99,230,.12);}

  /* feedback strip */
  .fb{border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:14.5px;line-height:1.55;display:none;}
  .fb.show{display:block;animation:rise .25s ease;}
  .fb.ok{background:#effaf1;color:var(--green-dk);}
  .fb.no{background:var(--red-bg);color:#b42318;}
  .fb .why{margin-top:10px;display:flex;gap:10px;}

  /* done */
  .done-wrap{text-align:center;padding:10px 0;}
  .done-badge{width:84px;height:84px;border-radius:50%;background:#effaf1;display:flex;align-items:center;justify-content:center;
              margin:0 auto 18px;animation:pop .5s cubic-bezier(.3,1.5,.5,1);}
  .done-badge svg{width:44px;height:44px;color:var(--green);}
  @keyframes pop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .summary{display:inline-block;text-align:left;margin:14px auto 0;}
  .summary .crow{font-size:15px;}

  /* footer / actions */
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0f0f5;
         padding:16px 24px;display:flex;justify-content:center;}
  .actions{width:100%;max-width:620px;display:flex;gap:12px;align-items:center;justify-content:flex-end;}
  .startover{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font:inherit;
             font-size:14px;cursor:pointer;margin-right:auto;}
  .startover:hover{color:var(--ink);}
  .pill{border:none;border-radius:99px;padding:14px 40px;font:inherit;font-weight:500;font-size:16px;color:#fff;
        background:var(--btn);cursor:pointer;transition:.15s;}
  .pill:hover{filter:brightness(1.12);}
  .pill:active{transform:scale(.98);}
  .pill.disabled{background:var(--btn-dis);color:#b3b3bd;cursor:not-allowed;pointer-events:none;}
  .pill.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--lav-bd);}

  /* ---------- tutor (Koji) ---------- */
  .koji-launch{position:fixed;left:22px;bottom:22px;width:54px;height:54px;border:none;cursor:pointer;background:none;z-index:40;
               transition:transform .2s;}
  .koji-launch:hover{transform:scale(1.08) rotate(-6deg);}
  .koji-launch .gem{width:54px;height:54px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);
                    border-radius:14px;box-shadow:0 6px 18px rgba(74,82,214,.4);}
  .koji-launch .gem::after{content:'';position:absolute;inset:14px;background:#fff;border-radius:6px;transform:rotate(0);}
  .tutor{position:fixed;top:0;bottom:0;left:0;width:340px;background:#fff;border-right:1px solid #eee;z-index:50;
         transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,1,.4,1);display:flex;flex-direction:column;
         box-shadow:6px 0 28px rgba(30,30,60,.10);}
  .tutor.open{transform:none;}
  .tutor .thead{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;border-bottom:1px solid #f2f2f7;}
  .tutor .thead .mini{width:26px;height:26px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);border-radius:7px;}
  .tutor .thead b{font-size:15px;font-weight:600;}
  .tutor .thead small{color:var(--muted);font-size:12px;display:block;}
  .tutor .tclose{margin-left:auto;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:85%;font-size:14px;line-height:1.5;padding:10px 13px;border-radius:14px;}
  .msg.bot{background:#eef0fb;color:#3a44b8;border-bottom-left-radius:4px;align-self:flex-start;}
  .msg.me{background:var(--lav-bg);color:var(--lav-deep);border-bottom-right-radius:4px;align-self:flex-end;}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px;}
  .quick button{border:1.5px solid var(--lav-bd);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:12.5px;
                color:var(--lav-deep);cursor:pointer;}
  .quick button:hover{background:var(--lav-bg);}
  .tinput{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f2f2f7;}
  .tinput input{flex:1;border:1.5px solid var(--lav-bd);border-radius:99px;padding:10px 14px;font:inherit;font-size:13.5px;}
  .tinput input:focus{outline:none;border-color:var(--indigo);}
  .tinput button{border:none;background:var(--indigo);color:#fff;border-radius:99px;width:40px;cursor:pointer;font-size:16px;}

  @media(max-width:560px){
    .cards4,.buckets{grid-template-columns:1fr;}
    .tutor{width:88%;}
    .pill{padding:14px 28px;}
  }
</style>
</head>
<body>
  <h2 class="sr-only">Interactive lesson: what is an AI agent — goal, brain, tools, and the loop.</h2>

  <header>
    <button class="x-btn" aria-label="Exit to journey" onclick="window.location.href=(window.LMS?'/dashboard':'about:blank')">&times;</button>
    <div class="bar"><i id="barfill"></i></div>
    <div class="dots" id="dots"></div>
    <div class="streak" title="Gems earned">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l3 5-9 13L3 8z" stroke="#cfcfda" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span id="gems">0</span>
    </div>
  </header>

  <main><div class="stage" id="stage"></div></main>

  <footer><div class="actions" id="actions"></div></footer>

  <!-- Tutor (TrigunAI guide) -->
  <button class="koji-launch" id="kojiLaunch" aria-label="Ask your TrigunAI guide"><span class="gem"></span></button>
  <aside class="tutor" id="tutor" aria-label="TrigunAI guide">
    <div class="thead">
      <span class="mini"></span>
      <div><b>TrigunAI guide</b><small>here to guide, not hand you answers</small></div>
      <button class="tclose" id="tclose" aria-label="Close guide">&times;</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <div class="tinput">
      <input id="tin" placeholder="Ask your guide…" />
      <button id="tsend" aria-label="Send">&rarr;</button>
    </div>
  </aside>

<script>
/* ===================== LESSON CONTENT ===================== */
/* ===================== LESSON CONTENT ===================== */
const STEPS = [
  { type:'intro',
    art:'🤖 → 🔁',
    prompt:'What is an agent?',
    sub:"You've used ChatGPT: you ask, it answers, it stops. An agent is different — it keeps going on its own until a goal is done. By the end of this you'll be able to spot one, name its parts, and trace how it runs.",
    cta:'Start' },

  { type:'mcq',
    prompt:'First instinct — which one of these is an agent?',
    sub:'Pick one, then check.',
    options:[
      {t:'A chatbot that answers your question, then stops.'},
      {t:'A program that checks your inbox, drafts replies, and files emails — on its own, until the inbox is clear.'},
      {t:'A calculator that returns 4 when you type 2 + 2.'}
    ],
    correct:1,
    why:'An agent pursues a goal by taking actions in a loop, deciding each step itself, until a stop condition is met. The chatbot and calculator each do one thing once. Only the inbox program keeps choosing and acting until “inbox clear” — that self-directed loop is the agent.',
    hints:[
      'Two of these do exactly ONE thing and stop. Which one keeps going by itself?',
      'An agent decides its own next step, again and again, until a goal is reached.'
    ] },

  { type:'classify',
    prompt:'Sort each one: is it an AGENT, or just a program?',
    sub:'Tap an item, then tap a bin. Five real examples.',
    buckets:['🤖 Agent','⚙️ Just a program'],
    items:[
      {t:'A bot that checks your inbox and files emails until it’s empty', b:0},
      {t:'A script that emails a report every Monday 9am, no matter what', b:1},
      {t:'A calculator: 2 + 2 = 4', b:1},
      {t:'A research bot that searches the web and keeps going until it has 10 good sources', b:0},
      {t:'A chatbot that answers one question and stops', b:1}
    ],
    constraints:['All 5 sorted','Every one correct'],
    hints:[
      'Which ones keep DECIDING their next step until a goal is reached?',
      'If it always does the exact same fixed thing (or just one thing once), it’s just a program.'
    ] },

  { type:'reveal',
    prompt:'Every agent is made of 4 parts.',
    sub:'Tap each card to see what it means. These four are the whole game.',
    cards:[
      {em:'🎯',h:'Goal',  b:'What you want done, in plain words. e.g. “Clear my inbox.”'},
      {em:'🧠',h:'Brain', b:'An LLM (Claude / GPT) that decides the next action at each step.'},
      {em:'🛠️',h:'Tools', b:'Things it can DO: read_inbox(), send_email(), search_web().'},
      {em:'🔁',h:'Loop',  b:'Think → act → observe, repeated — until the goal is met (the stop condition).'}
    ] },

  { type:'classify',
    prompt:'Match each piece of this email agent to its part.',
    sub:'Tap an item, then tap the part it belongs to.',
    buckets:['Goal','Brain','Tools','Loop / stop'],
    items:[
      {t:'“Clear my inbox”', b:0},
      {t:'GPT-4 picks the next step', b:1},
      {t:'read_inbox(), send_email()', b:2},
      {t:'stop when inbox is empty', b:3}
    ],
    constraints:['All 4 items placed','Every match correct'],
    hints:[
      'The GOAL is the outcome you’re aiming for — a finished state.',
      'TOOLS are things the agent can DO — they look like function calls with ().',
      'The BRAIN decides the next move. The LOOP/STOP is the rule for when to quit.'
    ] },

  { type:'mcq',
    prompt:'Diagnose it: an agent has a goal, a brain, and a loop — but it just keeps “thinking” and never actually does anything in the real world. Which part is missing?',
    sub:'Think about what each part is responsible for.',
    options:[
      {t:'The goal'},
      {t:'Tools — it has no hands, so it can think but never act'},
      {t:'A bigger, smarter model'},
      {t:'Memory'}
    ],
    correct:1,
    why:'Tools are the agent’s hands. With a goal, a brain, and a loop but no tools, it can decide what to do — but has no way to actually DO it (no read_inbox, no send_email). It would just narrate forever. A bigger model or memory wouldn’t fix “can’t act”.',
    hints:[
      'It can decide, but it can’t DO. Which part is “doing”?',
      'Goal = what, Brain = decide, Loop = repeat. What’s left — the “act” part?'
    ] },

  { type:'order',
    prompt:'Tap the 3 steps in the order the agent runs them — then it repeats.',
    sub:'This little cycle is “the agent loop”. It runs over and over until the goal is met.',
    chips:['Act (call a tool)','Think (decide next move)','Observe (read the result)'],
    correct:[1,0,2],
    constraints:['Loop order is correct'],
    hints:[
      'Before the agent can DO anything, what must it do first?',
      'It decides (think), then does (act), then sees what happened (observe) — and loops back.'
    ] },

  { type:'trace',
    prompt:'Now watch a real run. Walk the agent through clearing a 2-email inbox.',
    sub:'At each step, pick the agent’s next move. The loop log fills in as you go.',
    goal:'Clear my support inbox (2 unread emails).',
    turns:[
      { situation:'The agent starts. The inbox has 2 unread emails. Its goal: clear them.',
        q:'What’s the agent’s FIRST move?',
        options:['Think → decide to read the inbox first','Stop — there’s nothing to do','Send a reply immediately, before reading anything'],
        correct:0, log:'🧠 Think → “I should read the inbox.”' },
      { situation:'It called read_inbox() and got 2 emails: a refund request and a “thank you”.',
        q:'It just observed the inbox. What next?',
        options:['Think → decide the refund email needs a reply first','Reply to both with the exact same message','Delete the whole inbox'],
        correct:0, log:'🛠️ Act → read_inbox()  ·  👀 Observe → 2 emails' },
      { situation:'It drafted and sent a reply to the refund email. 1 email left (the “thank you”).',
        q:'The goal isn’t met yet (inbox not empty). What does the loop do?',
        options:['Loop again → handle the last email','Stop — it already sent one reply','Ask you what to do about every remaining email'],
        correct:0, log:'🛠️ Act → send_email(refund)  ·  🔁 Loop continues' },
      { situation:'Both emails are handled. The inbox is now empty.',
        q:'The goal was “clear the inbox”. What does the agent do now?',
        options:['Stop — the stop condition (inbox empty) is met','Keep looping forever','Start again from the first email'],
        correct:0, log:'✅ Goal met → Stop. Inbox cleared.' }
    ],
    hints:[
      'Remember the loop: think → act → observe → repeat, until the goal is met.',
      'The stop condition here is “inbox empty”. Until that’s true, the loop keeps going.'
    ] },

  { type:'tf',
    prompt:'Quick myth-check — true or false?',
    sub:'Tap True or False for each. Then check them all at once.',
    statements:[
      { t:'An agent must ask you to approve every single action it takes.', answer:false,
        why:'No — an agent acts on its own toward the goal. You add a human checkpoint only where it really matters (like before spending money or sending to a customer).' },
      { t:'Without a stop condition, an agent can loop forever and run up real API costs.', answer:true,
        why:'Exactly — a loop with no exit keeps calling the model and tools, and each call can cost money. The stop condition is its “you’re done now”.' },
      { t:'An agent is basically a chatbot with a nicer interface.', answer:false,
        why:'No — the loop, the tools, and the autonomy make it fundamentally different. A chatbot answers once; an agent keeps acting until a goal is met.' },
      { t:'A “tool” is something the agent can DO, like send_email() or search_web().', answer:true,
        why:'Right — tools are the agent’s hands: concrete actions it can take in the real world.' }
    ],
    hints:[
      'Picture the inbox agent from the trace — did it ask permission for every step?',
      'Think about what makes an agent different from a one-shot chatbot.'
    ] },

  { type:'reflect', capture:true,
    prompt:'Quick — tell us a little about you.',
    sub:'Not graded. We use it to explain things in YOUR world, with examples from your work and interests.',
    fields:[
      {k:'work', label:'What kind of work or studies do you spend most of your time on?', ph:'e.g. I run a Shopify store / final-year CS student / I do digital marketing'},
      {k:'interest', label:'One hobby or interest you love (we’ll borrow it for examples):', ph:'e.g. cricket, cooking, gaming, gardening'}
    ] },

  { type:'reflect', capture:true,
    prompt:'Now make it yours.',
    sub:'You’ll build a real agent in this cohort. Bring these two lines to Friday — they go straight into your config.py.',
    fields:[
      {k:'goal', label:'In one line — the GOAL of your agent (the real job it does for you):', ph:'e.g. Sort my new leads from Gmail into a sheet every morning'},
      {k:'stop', label:'Its STOP condition (when is it done?):', ph:'e.g. when every new email since 8am has been filed'}
    ] },

  { type:'multi',
    prompt:'Build the definition: tap ALL the parts that make something an agent.',
    sub:'Some of these are common in apps but aren’t what makes an agent. Pick only the ones that do.',
    chips:['A goal','A brain (an LLM)','Tools (actions it can take)','A loop that runs until it stops','A fancy user interface','A database'],
    correct:[0,1,2,3],
    why:'An agent = Goal + Brain + Tools + Loop-until-stop. A nice UI or a database are common in software, but an agent doesn’t need either to be an agent — plenty of great agents run entirely in a terminal with no UI and no database.',
    hints:[
      'Think back to the 4 cards you opened.',
      'Could an agent still work with no screen and no database? Then those aren’t what define it.'
    ] },

  { type:'done' }
];

/* ===================== ENGINE ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage'), actions = $('#actions');
let idx = 0, gems = 0, perfect = true;
function lms(p){ return (window.LMS && window.LMS.api ? window.LMS.api : '') + p; }
function lmsProgress(){ if(!window.LMS) return; fetch(lms('/progress'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({step:idx,correct:true})}).catch(()=>{}); }
function lmsComplete(){ if(!window.LMS) return Promise.resolve(null); return fetch(lms('/complete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:gems,perfect:perfect})}).then(r=>r.json()).catch(()=>null); }
function lmsCapture(key,value){ if(!window.LMS||!value) return; fetch('/api/profile/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,value:value,source:'lesson'})}).catch(()=>{}); }
let work = {};          // per-step scratch state
let answered = false;   // whether current step's Check has been resolved

function buildDots(){
  const d = $('#dots'); d.innerHTML='';
  STEPS.forEach(()=>{ const s=document.createElement('span'); d.appendChild(s); });
}
function progress(){
  $('#barfill').style.width = (idx/(STEPS.length-1))*100 + '%';
  [...$('#dots').children].forEach((s,i)=> s.classList.toggle('on', i<=idx));
  $('#gems').textContent = gems;
}
function go(n){ idx=n; answered=false; work={}; render(); }
function nextStep(){ if(idx<STEPS.length-1) go(idx+1); }
function award(n){ gems+=n; $('#gems').textContent=gems; }

/* ---- footer button helpers ---- */
function setActions(html){ actions.innerHTML = html; }
function primary(label,fn,disabled){
  const b=document.createElement('button');
  b.className='pill'+(disabled?' disabled':''); b.textContent=label;
  if(!disabled) b.onclick=fn;
  return b;
}
function startOver(fn){
  const b=document.createElement('button');
  b.className='startover'; b.innerHTML='&#8635; Start over'; b.onclick=fn; return b;
}

/* ---- feedback strip ---- */
function feedback(ok, text, withWhy){
  let fb=$('#fb');
  if(!fb){ fb=document.createElement('div'); fb.id='fb'; fb.className='fb'; stage.appendChild(fb); }
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML = text;
  if(ok && withWhy){
    const wrap=document.createElement('div'); wrap.className='why';
    const w=primary('Why?', ()=>showWhy(withWhy)); w.classList.add('ghost'); w.style.padding='8px 18px'; w.style.fontSize='14px';
    const sk=document.createElement('button'); sk.className='pill ghost'; sk.style.padding='8px 18px'; sk.style.fontSize='14px';
    sk.textContent='Skip explanation'; sk.onclick=()=>{award(10);nextStep();};
    wrap.appendChild(w); wrap.appendChild(sk); fb.appendChild(wrap);
  }
}
function showWhy(text){
  feedback(true, '<b>Here’s why:</b><br>'+text);
  setActions(''); actions.appendChild(primary('Got it', ()=>{award(10);nextStep();}));
}

/* ===================== RENDERERS ===================== */
function render(){
  const step = STEPS[idx];
  progress();
  stage.innerHTML='';
  setActions('');
  ({ intro:rIntro, mcq:rMcq, reveal:rReveal, classify:rClassify, order:rOrder, reflect:rReflect, tf:rTf, trace:rTrace, multi:rMulti, done:rDone })[step.type](step);
}

function head(step){
  if(step.art) stage.insertAdjacentHTML('beforeend', `<div class="intro-art">${step.art}</div>`);
  stage.insertAdjacentHTML('beforeend', `<p class="prompt">${step.prompt}</p>`);
  if(step.sub) stage.insertAdjacentHTML('beforeend', `<p class="sub">${step.sub}</p>`);
}

/* ---- intro ---- */
function rIntro(step){
  head(step);
  actions.appendChild(primary(step.cta||'Continue', nextStep));
}

/* ---- multiple choice ---- */
function rMcq(step){
  head(step);
  const wrap=document.createElement('div'); wrap.className='opts';
  step.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="tick"></span><span>${o.t}</span>`;
    b.onclick=()=>{ if(answered) return; work.sel=i; [...wrap.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); renderMcqActions(step,wrap); };
    wrap.appendChild(b);
  });
  stage.appendChild(wrap);
  renderMcqActions(step,wrap);
}
function renderMcqActions(step,wrap){
  setActions('');
  actions.appendChild(primary('Check', ()=>checkMcq(step,wrap), work.sel===undefined));
}
function checkMcq(step,wrap){
  answered=true;
  const ok = work.sel===step.correct;
  [...wrap.children].forEach((c,i)=>{
    if(i===step.correct) c.classList.add('correct');
    else if(i===work.sel) c.classList.add('wrong');
    else c.classList.add('dim');
  });
  if(ok){ award(10); lmsProgress(); feedback(true,'<b>Correct.</b>', step.why); setActions(''); }
  else{
    perfect=false;
    feedback(false,'Not quite — see the highlighted answer. Want a hand?');
    nudge(step,true);
    setActions('');
    actions.appendChild(primary('Continue', ()=>{ feedback(true,'<b>Why:</b> '+step.why); setActions(''); actions.appendChild(primary('Got it',nextStep)); }));
  }
}

/* ---- reveal 4 cards ---- */
function rReveal(step){
  head(step);
  const grid=document.createElement('div'); grid.className='cards4'; let opened=0;
  step.cards.forEach(c=>{
    const card=document.createElement('div'); card.className='pcard';
    card.innerHTML=`<h4><span class="em">${c.em}</span>${c.h}</h4><div class="body">${c.b}</div>`;
    card.onclick=()=>{ if(!card.classList.contains('opened')){card.classList.add('opened');opened++; if(opened===step.cards.length) enableContinue();} };
    grid.appendChild(card);
  });
  stage.appendChild(grid);
  const cont=primary('Continue', nextStep, true); actions.appendChild(cont);
  function enableContinue(){ cont.classList.remove('disabled'); cont.onclick=nextStep; }
}

/* ---- classify (tap item, tap bucket) ---- */
function rClassify(step){
  head(step);
  work.place={}; // itemIndex -> bucketIndex
  const cons=document.createElement('div'); cons.className='constraints';
  cons.innerHTML=step.constraints.map(c=>`<div class="crow"><span class="ic">○</span>${c}</div>`).join('');
  stage.appendChild(cons);

  const bwrap=document.createElement('div'); bwrap.className='buckets';
  step.buckets.forEach((name,bi)=>{
    const bk=document.createElement('div'); bk.className='bucket'; bk.dataset.bi=bi;
    bk.innerHTML=`<div class="blabel">${name}</div><div class="holder"></div>`;
    bk.onclick=()=>{ if(work.selItem!=null){ placeItem(work.selItem, bi); } };
    bwrap.appendChild(bk);
  });
  stage.appendChild(bwrap);

  const tray=document.createElement('div'); tray.className='tray'; tray.id='tray';
  step.items.forEach((it,ii)=>{
    const c=document.createElement('button'); c.className='chip'; c.dataset.ii=ii; c.textContent=it.t;
    c.onclick=()=>selectItem(ii,c);
    tray.appendChild(c);
  });
  stage.appendChild(tray);
  renderClassifyActions(step);

  function selectItem(ii,c){
    if(answered) return;
    work.selItem = (work.selItem===ii?null:ii);
    document.querySelectorAll('#tray .chip, .holder .chip').forEach(x=>x.classList.remove('sel'));
    if(work.selItem!=null) c.classList.add('sel');
  }
  function placeItem(ii,bi){
    if(answered) return;
    work.place[ii]=bi; work.selItem=null;
    // re-render chips into holders / tray
    const placedIdx=Object.keys(work.place).map(Number);
    document.querySelectorAll('.holder').forEach(h=>h.innerHTML='');
    document.querySelectorAll('#tray .chip').forEach(ch=>ch.style.display='');
    step.items.forEach((it,k)=>{
      if(work.place[k]!=null){
        document.querySelector(`#tray .chip[data-ii="${k}"]`).style.display='none';
        const holder=document.querySelector(`.bucket[data-bi="${work.place[k]}"] .holder`);
        const c=document.createElement('button'); c.className='chip placed'; c.textContent=it.t;
        c.onclick=()=>{ if(answered) return; delete work.place[k]; render(); restoreWork(step); };
        holder.appendChild(c);
      }
    });
    renderClassifyActions(step);
  }
}
function restoreWork(step){ /* placeholder for future persistence */ }
function renderClassifyActions(step){
  const all = Object.keys(work.place||{}).length===step.items.length;
  setActions('');
  actions.appendChild(startOver(()=>go(idx)));
  actions.appendChild(primary('Check', ()=>checkClassify(step), !all));
}
function checkClassify(step){
  answered=true;
  let allCorrect=true;
  step.items.forEach((it,ii)=>{
    const correct = work.place[ii]===it.b;
    if(!correct) allCorrect=false;
    const chip=[...document.querySelectorAll('.holder .chip')].find(c=>c.textContent===it.t);
    if(chip) chip.classList.add(correct?'ok':'bad');
  });
  const cons=stage.querySelector('.constraints');
  cons.children[0].classList.add('met'); cons.children[0].querySelector('.ic').textContent='✓';
  if(allCorrect){ cons.children[1].classList.add('met'); cons.children[1].querySelector('.ic').textContent='✓'; cons.classList.add('done'); }
  if(allCorrect){ award(15); lmsProgress(); feedback(true,'<b>All four matched.</b> That’s the whole anatomy of an agent — goal, brain, tools, and the loop that stops.'); setActions(''); actions.appendChild(primary('Continue',nextStep)); }
  else{ perfect=false; feedback(false,'Some matches are off (shown in red). Tap the red chips to move them, then check again.'); nudge(step,true); answered=false;
        setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkClassify(step))); }
}

/* ---- order (loop builder) ---- */
function rOrder(step){
  head(step);
  work.seq=[];
  const cons=document.createElement('div'); cons.className='constraints';
  cons.innerHTML=`<div class="crow"><span class="ic">○</span>${step.constraints[0]}</div>`;
  stage.appendChild(cons);

  const seq=document.createElement('div'); seq.className='seq'; seq.id='seq';
  seq.innerHTML='<span class="slot">Tap the steps below in order…</span>';
  stage.appendChild(seq);

  const tray=document.createElement('div'); tray.className='tray'; tray.id='otray';
  step.chips.forEach((t,ci)=>{
    const c=document.createElement('button'); c.className='chip'; c.dataset.ci=ci; c.textContent=t;
    c.onclick=()=>{ if(answered||work.seq.includes(ci)) return; work.seq.push(ci); c.style.display='none'; drawSeq(step); };
    tray.appendChild(c);
  });
  stage.appendChild(tray);
  renderOrderActions(step);
}
function drawSeq(step){
  const seq=$('#seq'); seq.innerHTML='';
  work.seq.forEach((ci,pos)=>{
    if(pos) seq.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
    const c=document.createElement('button'); c.className='chip placed'; c.textContent=step.chips[ci];
    c.onclick=()=>{ if(answered) return; work.seq.splice(pos,1); document.querySelector(`#otray .chip[data-ci="${ci}"]`).style.display=''; drawSeq(step); };
    seq.appendChild(c);
  });
  if(work.seq.length){ seq.insertAdjacentHTML('beforeend','<span class="arrow">→ 🔁 repeat</span>'); }
  else seq.innerHTML='<span class="slot">Tap the steps below in order…</span>';
  renderOrderActions(step);
}
function renderOrderActions(step){
  setActions('');
  actions.appendChild(startOver(()=>go(idx)));
  actions.appendChild(primary('Check',()=>checkOrder(step), work.seq.length!==step.chips.length));
}
function checkOrder(step){
  const ok = JSON.stringify(work.seq)===JSON.stringify(step.correct);
  const cons=stage.querySelector('.constraints');
  if(ok){
    answered=true; cons.children[0].classList.add('met'); cons.children[0].querySelector('.ic').textContent='✓'; cons.classList.add('done');
    award(15); lmsProgress(); feedback(true,'<b>That’s the loop.</b> Think → act → observe, then back to think — over and over until the goal is met. Almost every agent you’ll ever build is this cycle.');
    setActions(''); actions.appendChild(primary('Continue',nextStep));
  }else{
    perfect=false;
    feedback(false,'Not that order. Tap a step in the sequence to send it back, and try again.');
    nudge(step,true);
  }
}

/* ---- reflect ---- */
function rReflect(step){
  head(step);
  step.fields.forEach(f=>{
    const d=document.createElement('div'); d.className='field';
    d.innerHTML=`<label>${f.label}</label><input id="f_${f.k}" placeholder="${f.ph}" />`;
    stage.appendChild(d);
  });
  const inputs=step.fields.map(f=>$('#f_'+f.k));
  const btn=document.createElement('button'); btn.className='pill disabled'; btn.textContent='Save & finish';
  btn.onclick=()=>{
    if(btn.classList.contains('disabled')) return;
    if(step.capture){ inputs.forEach((i,ix)=> lmsCapture(step.fields[ix].k, i.value.trim())); }
    const msg = step.fields.some(f=>f.k==='goal')
      ? '<b>Locked in.</b> Bring these two lines to Friday — they’re the first thing we put into your config.py. A clear goal and a clear stop condition is 80% of a working agent.'
      : '<b>Got it — thanks.</b> We’ll use this to explain things with examples from your world, not generic ones.';
    feedback(true, msg);
    setActions(''); actions.appendChild(primary('Continue',()=>{award(20);nextStep();}));
  };
  actions.appendChild(btn);
  inputs.forEach(i=>i.addEventListener('input',()=>{
    const ok=inputs.every(x=>x.value.trim().length>2);
    btn.classList.toggle('disabled',!ok);
  }));
}

/* ---- true / false set ---- */
function rTf(step){
  head(step);
  work.tf={};
  const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:12px;';
  step.statements.forEach((s,i)=>{
    const row=document.createElement('div');
    row.style.cssText='border:1.5px solid var(--lav-bd);border-radius:11px;padding:12px 14px;';
    const txt=document.createElement('div'); txt.style.cssText='font-size:15px;margin-bottom:10px;'; txt.textContent=s.t; row.appendChild(txt);
    const btns=document.createElement('div'); btns.style.cssText='display:flex;gap:8px;';
    ['True','False'].forEach((lab,bi)=>{
      const b=document.createElement('button'); b.className='opt'; b.style.cssText='flex:1;justify-content:center;padding:9px;'; b.textContent=lab;
      b.onclick=()=>{ if(answered) return; work.tf[i]=(bi===0); [...btns.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); renderTfActions(step); };
      btns.appendChild(b);
    });
    row.appendChild(btns); wrap.appendChild(row);
  });
  stage.appendChild(wrap);
  work._tfwrap=wrap; renderTfActions(step);
}
function renderTfActions(step){
  const all=Object.keys(work.tf).length===step.statements.length;
  setActions(''); actions.appendChild(primary('Check', ()=>checkTf(step), !all));
}
function checkTf(step){
  answered=true; let allCorrect=true; const wrap=work._tfwrap;
  step.statements.forEach((s,i)=>{
    const row=wrap.children[i], btns=row.children[1];
    const correct = work.tf[i]===s.answer; if(!correct) allCorrect=false;
    btns.children[work.tf[i]?0:1].classList.add(correct?'correct':'wrong');
    if(!correct) btns.children[s.answer?0:1].classList.add('correct');
    const w=document.createElement('div'); w.style.cssText='font-size:13px;color:var(--muted);margin-top:9px;'; w.textContent=s.why; row.appendChild(w);
  });
  if(allCorrect){ award(15); lmsProgress(); feedback(true,'<b>All correct — myths busted.</b>'); }
  else { perfect=false; feedback(false,'A couple were off — the corrected answers and the why are under each.'); nudge(step,true); }
  setActions(''); actions.appendChild(primary('Continue',nextStep));
}

/* ---- trace (walk the loop) ---- */
function rTrace(step){
  head(step);
  work.turn=0;
  const goal=document.createElement('div');
  goal.style.cssText='background:var(--lav-bg);border:1px solid var(--lav-bd);border-radius:12px;padding:11px 14px;margin:0 0 14px;color:var(--lav-deep);font-size:14.5px;';
  goal.innerHTML='🎯 <b style="font-weight:500;">Goal:</b> '+step.goal; stage.appendChild(goal);
  const log=document.createElement('div'); log.id='tracelog'; log.style.cssText='display:flex;flex-direction:column;gap:6px;margin:0 0 14px;'; stage.appendChild(log);
  const box=document.createElement('div'); box.id='turnbox'; stage.appendChild(box);
  renderTurn(step);
}
function renderTurn(step){
  const t=step.turns[work.turn], box=$('#turnbox'); box.innerHTML='';
  const sit=document.createElement('p'); sit.className='sub'; sit.style.margin='0 0 12px'; sit.textContent='Turn '+(work.turn+1)+'/'+step.turns.length+' — '+t.situation; box.appendChild(sit);
  const q=document.createElement('p'); q.className='prompt'; q.style.fontSize='17px'; q.textContent=t.q; box.appendChild(q);
  const opts=document.createElement('div'); opts.className='opts';
  t.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML='<span class="tick"></span><span>'+o+'</span>'; b.onclick=()=>pickTurn(step,i,b,opts); opts.appendChild(b); });
  box.appendChild(opts); setActions('');
}
function pickTurn(step,i,b,opts){
  const t=step.turns[work.turn];
  if(i===t.correct){
    [...opts.children].forEach(c=>c.classList.add('dim')); b.classList.remove('dim'); b.classList.add('correct');
    const row=document.createElement('div'); row.style.cssText='font-size:13.5px;color:var(--green-dk);background:#effaf1;border-radius:8px;padding:7px 11px;'; row.textContent=t.log; $('#tracelog').appendChild(row);
    award(8); lmsProgress(); work.turn++;
    if(work.turn>=step.turns.length){ feedback(true,'<b>That’s a full agent run.</b> Think → act → observe, looping until the stop condition (inbox empty) was met. Every agent you build runs this exact cycle.'); setActions(''); actions.appendChild(primary('Continue',nextStep)); }
    else setTimeout(()=>renderTurn(step), 380);
  } else {
    perfect=false; b.classList.add('wrong'); feedback(false,'Not the agent’s move here — think about where it is in the loop right now.'); nudge(step,true);
  }
}

/* ---- multi-select (build the definition) ---- */
function rMulti(step){
  head(step); work.multi=new Set();
  const wrap=document.createElement('div'); wrap.className='tray';
  step.chips.forEach((c,i)=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=c;
    b.onclick=()=>{ if(answered) return; if(work.multi.has(i)){work.multi.delete(i);b.classList.remove('sel');} else {work.multi.add(i);b.classList.add('sel');} renderMultiActions(step); };
    wrap.appendChild(b); });
  stage.appendChild(wrap); work._mwrap=wrap; renderMultiActions(step);
}
function renderMultiActions(step){
  setActions(''); actions.appendChild(startOver(()=>go(idx)));
  actions.appendChild(primary('Check', ()=>checkMulti(step), work.multi.size===0));
}
function checkMulti(step){
  const chosen=[...work.multi].sort((a,b)=>a-b), correct=[...step.correct].sort((a,b)=>a-b);
  const ok = chosen.length===correct.length && chosen.every((v,k)=>v===correct[k]);
  if(ok){ answered=true; [...work._mwrap.children].forEach((b,i)=>{ if(step.correct.includes(i)) b.classList.add('ok'); }); award(15); lmsProgress(); feedback(true,'<b>That’s the definition.</b>', step.why); setActions(''); }
  else { perfect=false; feedback(false,'Not quite — pick exactly the parts that DEFINE an agent (a UI and a database are common, but optional). Adjust and check again.'); nudge(step,true); setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkMulti(step))); }
}

/* ===================== TRIGUNAI GUIDE (LLM tutor) ===================== */
const tutor=$('#tutor'), msgs=$('#msgs'), quick=$('#quick');
let convo=[];
$('#kojiLaunch').onclick=()=>openTutor();
$('#tclose').onclick=()=>tutor.classList.remove('open');
function openTutor(){
  tutor.classList.add('open');
  if(!msgs.children.length){
    const g="Hi — I'm your TrigunAI guide. I won't hand you answers, but I'll ask the right question to get you unstuck. What are you thinking?";
    bot(g); convo.push({role:'assistant',content:g});
  }
  renderQuick(); $('#tin').focus();
}
function bot(t){ const m=document.createElement('div'); m.className='msg bot'; m.textContent=t; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; }
function me(t){ const m=document.createElement('div'); m.className='msg me'; m.textContent=t; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; }
function botTyping(){ const m=document.createElement('div'); m.className='msg bot'; m.textContent='…'; m.style.opacity='.6'; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; return m; }

function problemContext(){
  const s=STEPS[idx]; if(!s) return '';
  let p=`Step type: ${s.type}. Prompt: "${s.prompt}".`;
  if(s.sub) p+=` Framing: ${s.sub}`;
  if(s.type==='mcq'){
    p+='\nOptions:\n'+s.options.map((o,i)=>`  [${i}] ${o.t}${i===s.correct?'  <-- CORRECT, never reveal':''}`).join('\n');
    if(work.sel!==undefined && work.sel!==null && work.sel!==s.correct) p+=`\nThe learner just picked [${work.sel}], which is wrong.`;
  }else if(s.type==='classify'){
    p+='\nMatch each item to one of: '+s.buckets.join(', ')+'.\nCorrect matches (never reveal): '+s.items.map(it=>`"${it.t}" -> ${s.buckets[it.b]}`).join('; ');
  }else if(s.type==='order'){
    p+='\nOrder these into the agent loop: '+s.chips.join(' / ')+'.\nCorrect order (never reveal): '+s.correct.map(i=>s.chips[i]).join(' -> ');
  }else if(s.type==='reflect'){
    p+='\nThis is the learner reflecting on their OWN use-case. No single right answer — help them make it concrete.';
  }
  return p;
}
function fallbackHint(text){
  const h=(STEPS[idx]&&STEPS[idx].hints)||[];
  if(/wrong/i.test(text)) return h[0]||"Let's look together — what made you pick that?";
  if(/stuck/i.test(text)) return h[h.length-1]||"Re-read the prompt and name the ONE thing it's asking for.";
  if(/world|example|my /i.test(text)) return "Picture a task from your own day — how would the 4 parts (goal, brain, tools, loop) map onto it?";
  return h[0]||"Which part is confusing? Name it and we'll zoom in.";
}
async function askGuide(text, opts){
  opts=opts||{};
  if(!opts.auto) me(text);
  convo.push({role:'user',content:text});
  const typing=botTyping();
  let reply=null;
  try{
    if(window.LMS){
      const res=await fetch('/api/tutor/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:convo,problem:problemContext()})});
      const d=await res.json(); reply=d.reply;
    }
  }catch(e){}
  typing.remove();
  const out = reply || fallbackHint(text);
  bot(out); convo.push({role:'assistant',content:out});
}
function nudge(step, auto){
  if(auto) tutor.classList.add('open');
  renderQuick();
  askGuide("I just answered this wrong. Give me a Socratic hint — don't tell me the answer.", {auto:true});
}
function renderQuick(){
  quick.innerHTML='';
  const qs=['Why was my answer wrong?','Give me a hint','Explain it in my world','I’m stuck'];
  qs.forEach(q=>{ const b=document.createElement('button'); b.textContent=q; b.onclick=()=>{
    const msg = q==='Explain it in my world'
      ? 'Explain this concept using an example from MY own work or interests.'
      : (q==='I’m stuck' ? "I'm totally stuck — give me the smallest next step." : q);
    askGuide(msg);
  }; quick.appendChild(b); });
}
$('#tsend').onclick=sendTin; $('#tin').addEventListener('keydown',e=>{if(e.key==='Enter')sendTin();});
function sendTin(){ const v=$('#tin').value.trim(); if(!v) return; $('#tin').value=''; askGuide(v); }

/* ===================== BOOT ===================== */
buildDots(); render();
</script>
