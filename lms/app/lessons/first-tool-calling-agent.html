<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your first tool-calling agent · TrigunAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="/static/celebrate.js"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#2b2b33; --muted:#8a8a99; --line:#ececf2;
    --lav-bg:#eef0fb; --lav-bd:#c9d0f5; --lav-deep:#3a44b8;
    --indigo:#5b63e6; --indigo-dk:#4a52d6;
    --grey-fill:#eceef4; --accepted:#9aa0ad;
    --green:#22c55e; --green-dk:#15803d;
    --red:#ef4444; --red-bg:#fdecec;
    --btn:#2d2d33; --btn-dis:#e6e6ec;
    --rc:18px; --rb:11px;
    --shadow:0 1px 2px rgba(30,30,60,.05),0 8px 24px rgba(30,30,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid #f0f0f5;}
  .x-btn{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:12px;border-radius:99px;background:#eceef2;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1);}
  .dots{display:flex;gap:7px;}
  .dots > span{width:8px;height:8px;border-radius:50%;background:#dcdce4;transition:background .3s;}
  .dots > span.on{background:var(--green);}
  .streak{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:15px;}
  .streak svg{width:18px;height:18px;}
  main{flex:1;display:flex;justify-content:center;padding:40px 24px 130px;}
  .stage{width:100%;max-width:620px;animation:rise .4s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .prompt{font-size:20px;font-weight:500;line-height:1.45;margin:0 0 8px;}
  .sub{font-size:15.5px;color:var(--muted);line-height:1.6;margin:0 0 22px;}
  .intro-art{font-size:46px;text-align:center;margin:18px 0 26px;}
  .code-block{background:#1e1e2e;color:#cdd6f4;border-radius:14px;padding:16px 18px;font-family:'Courier New',monospace;font-size:13.5px;line-height:1.7;margin:0 0 18px;overflow-x:auto;}
  .code-block .kw{color:#cba6f7;} .code-block .str{color:#a6e3a1;} .code-block .cm{color:#6c7086;font-style:italic;} .code-block .fn{color:#89b4fa;} .code-block .num{color:#fab387;}
  .constraints{border:1.5px solid var(--lav-bd);border-radius:14px;padding:12px 16px;margin:0 0 18px;background:#fafbff;transition:border-color .3s;}
  .constraints.done{border-color:var(--green);}
  .crow{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);padding:4px 0;}
  .crow .ic{width:18px;height:18px;flex:0 0 18px;color:var(--muted);transition:color .3s;}
  .crow.met .ic{color:var(--green);}
  .crow.met{color:var(--green-dk);}
  .opts{display:flex;flex-direction:column;gap:12px;margin:0 0 8px;}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--lav-bd);background:#fff;border-radius:var(--rb);padding:15px 16px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;transition:.15s;width:100%;}
  .opt:hover{background:var(--lav-bg);}
  .opt .tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--lav-bd);}
  .opt.sel{border-color:var(--indigo);background:var(--lav-bg);}
  .opt.sel .tick{border-color:var(--indigo);background:var(--indigo);box-shadow:inset 0 0 0 3px #fff;}
  .opt.correct{border-color:var(--green);background:#effaf1;}
  .opt.correct .tick{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px #fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.dim{opacity:.5;}
  .cards4{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pcard{border:1.5px solid var(--lav-bd);background:var(--lav-bg);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.18s;}
  .pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .pcard.opened{background:#fff;border-color:var(--indigo);}
  .pcard h4{margin:0 0 4px;font-size:15.5px;font-weight:600;color:var(--lav-deep);display:flex;align-items:center;gap:8px;}
  .pcard .body{font-size:13.5px;color:var(--muted);line-height:1.55;max-height:0;overflow:hidden;transition:max-height .3s;}
  .pcard.opened .body{max-height:200px;margin-top:6px;}
  .pcard .em{font-size:22px;}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px;}
  .bucket{border:1.5px dashed var(--lav-bd);border-radius:14px;min-height:78px;padding:10px;background:#fafbff;transition:.15s;}
  .bucket.target{border-color:var(--indigo);background:var(--lav-bg);}
  .bucket .blabel{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .tray{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;}
  .chip{border:1.5px solid var(--lav-bd);background:#fff;border-radius:var(--rb);padding:9px 14px;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink);}
  .chip:hover{background:var(--lav-bg);}
  .chip.sel{border-color:var(--indigo);background:var(--indigo);color:#fff;}
  .chip.placed{border-color:var(--lav-bd);background:#fff;}
  .chip.ok{border-color:var(--green);background:#effaf1;color:var(--green-dk);}
  .chip.bad{border-color:var(--red);background:var(--red-bg);color:#b42318;}
  .bucket .holder{display:flex;flex-wrap:wrap;gap:8px;}
  .seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:54px;border:1.5px solid var(--lav-bd);border-radius:14px;padding:12px;margin:0 0 14px;background:#fafbff;}
  .seq .slot{font-size:13.5px;color:var(--muted);}
  .arrow{color:var(--muted);font-size:14px;}
  .field{margin:0 0 16px;}
  .field label{display:block;font-size:14px;font-weight:500;margin:0 0 6px;}
  .field input{width:100%;border:1.5px solid var(--lav-bd);border-radius:var(--rb);padding:12px 14px;font:inherit;font-size:15px;}
  .field input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,99,230,.12);}
  .fb{border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:14.5px;line-height:1.55;display:none;}
  .fb.show{display:block;animation:rise .25s ease;}
  .fb.ok{background:#effaf1;color:var(--green-dk);}
  .fb.no{background:var(--red-bg);color:#b42318;}
  .fb .why{margin-top:10px;display:flex;gap:10px;}
  .done-wrap{text-align:center;padding:10px 0;}
  .done-badge{width:84px;height:84px;border-radius:50%;background:#effaf1;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .5s cubic-bezier(.3,1.5,.5,1);}
  .done-badge svg{width:44px;height:44px;color:var(--green);}
  @keyframes pop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .summary{display:inline-block;text-align:left;margin:14px auto 0;}
  .summary .crow{font-size:15px;}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0f0f5;padding:16px 24px;display:flex;justify-content:center;}
  .actions{width:100%;max-width:620px;display:flex;gap:12px;align-items:center;justify-content:flex-end;}
  .startover{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-right:auto;}
  .startover:hover{color:var(--ink);}
  .pill{border:none;border-radius:99px;padding:14px 40px;font:inherit;font-weight:500;font-size:16px;color:#fff;background:var(--btn);cursor:pointer;transition:.15s;}
  .pill:hover{filter:brightness(1.12);}
  .pill:active{transform:scale(.98);}
  .pill.disabled{background:var(--btn-dis);color:#b3b3bd;cursor:not-allowed;pointer-events:none;}
  .pill.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--lav-bd);}
  .koji-launch{position:fixed;left:22px;bottom:22px;width:54px;height:54px;border:none;cursor:pointer;background:none;z-index:40;transition:transform .2s;}
  .koji-launch:hover{transform:scale(1.08) rotate(-6deg);}
  .koji-launch .gem{width:54px;height:54px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);border-radius:14px;box-shadow:0 6px 18px rgba(74,82,214,.4);}
  .koji-launch .gem::after{content:'';position:absolute;inset:14px;background:#fff;border-radius:6px;transform:rotate(0);}
  .tutor{position:fixed;top:0;bottom:0;left:0;width:340px;background:#fff;border-right:1px solid #eee;z-index:50;transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,1,.4,1);display:flex;flex-direction:column;box-shadow:6px 0 28px rgba(30,30,60,.10);}
  .tutor.open{transform:none;}
  .tutor .thead{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;border-bottom:1px solid #f2f2f7;}
  .tutor .thead .mini{width:26px;height:26px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);border-radius:7px;}
  .tutor .thead b{font-size:15px;font-weight:600;}
  .tutor .thead small{color:var(--muted);font-size:12px;display:block;}
  .tutor .tclose{margin-left:auto;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:85%;font-size:14px;line-height:1.5;padding:10px 13px;border-radius:14px;}
  .msg.bot{background:#eef0fb;color:#3a44b8;border-bottom-left-radius:4px;align-self:flex-start;}
  .msg.me{background:var(--lav-bg);color:var(--lav-deep);border-bottom-right-radius:4px;align-self:flex-end;}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px;}
  .quick button{border:1.5px solid var(--lav-bd);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:12.5px;color:var(--lav-deep);cursor:pointer;}
  .quick button:hover{background:var(--lav-bg);}
  .tinput{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f2f2f7;}
  .tinput input{flex:1;border:1.5px solid var(--lav-bd);border-radius:99px;padding:10px 14px;font:inherit;font-size:13.5px;}
  .tinput input:focus{outline:none;border-color:var(--indigo);}
  .tinput button{border:none;background:var(--indigo);color:#fff;border-radius:99px;width:40px;cursor:pointer;font-size:16px;}
  @media(max-width:560px){.cards4,.buckets{grid-template-columns:1fr;}.tutor{width:88%;}.pill{padding:14px 28px;}}
</style>

<body>
<h2 class="sr-only">Interactive lesson: your first tool-calling agent — how models request tools and how you run them.</h2>
<header>
  <button class="x-btn" aria-label="Exit to journey" onclick="window.location.href=(window.LMS?'/dashboard':'about:blank')">&times;</button>
  <div class="bar"><i id="barfill"></i></div>
  <div class="dots" id="dots"></div>
  <div class="streak" title="Gems earned">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l3 5-9 13L3 8z" stroke="#cfcfda" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span id="gems">0</span>
  </div>
</header>
<main><div class="stage" id="stage"></div></main>
<footer><div class="actions" id="actions"></div></footer>
<button class="koji-launch" id="kojiLaunch" aria-label="Ask your TrigunAI guide"><span class="gem"></span></button>
<aside class="tutor" id="tutor" aria-label="TrigunAI guide">
  <div class="thead"><span class="mini"></span><div><b>TrigunAI guide</b><small>here to guide, not hand you answers</small></div><button class="tclose" id="tclose" aria-label="Close guide">&times;</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="quick" id="quick"></div>
  <div class="tinput"><input id="tin" placeholder="Ask your guide…" /><button id="tsend" aria-label="Send">&rarr;</button></div>
</aside>

<script>
const STEPS = [
  { type:'intro',
    art:'🛠️ → 📞',
    prompt:'Your first tool-calling agent',
    sub:"Last week you learned the loop: think → act → observe. This week you wire up the ACT part. You'll see exactly how the model asks for a tool, how you run it, and how the result flows back — so the loop keeps going.",
    cta:'Start' },

  { type:'mcq',
    prompt:'When an AI agent "calls a tool", what actually happens?',
    sub:'Pick the most accurate description.',
    options:[
      {t:'The model somehow runs Python code inside itself.'},
      {t:'The model returns a structured message saying "run this function with these arguments" — and YOUR code actually executes it.'},
      {t:'The model sends an API request to the tool\'s server directly.'}
    ],
    correct:1,
    why:'The model can\'t execute code — it only produces text. When it "calls a tool" it outputs a special message (e.g. tool_use block) with the function name + arguments. Your Python loop intercepts that, runs the real function, and sends the result back. The model never touches the actual tool — you do.',
    hints:[
      'Think about what a language model actually IS. Can it run code on your laptop?',
      'The model outputs a request. Something else executes it. What is that something?'
    ] },

  { type:'reveal',
    prompt:'The tool exchange in 4 messages.',
    sub:'Tap each card to see the exact message shape. This is the full handshake.',
    cards:[
      {em:'1️⃣',h:'User sends goal', b:'"What\'s today\'s date?" — a normal user message sent to the model.'},
      {em:'2️⃣',h:'Model replies: tool_use', b:'The model outputs: { type:"tool_use", name:"get_date", input:{} } — it\'s asking you to run get_date().'},
      {em:'3️⃣',h:'You run the tool', b:'Your loop calls get_date() → returns "2026-07-03". You send a tool_result message back with that value.'},
      {em:'4️⃣',h:'Model continues', b:'The model now sees the result and writes its final answer: "Today is Thursday 3 July 2026."'}
    ] },

  { type:'order',
    prompt:'Put the 4-message tool exchange in order.',
    sub:'Tap in sequence. This is the heartbeat of every tool-calling agent.',
    chips:['Model outputs tool_use block','Your code runs the function','User sends goal message','Model writes final answer with result'],
    correct:[2,0,1,3],
    constraints:['Correct order'],
    hints:[
      'Who starts the conversation? The user.',
      'After the user sends the goal, what does the model do next? Then what do you do?'
    ] },

  { type:'mcq',
    prompt:'Why does the model need a tool SCHEMA (name + description + parameters) before it can call it?',
    sub:'Think about what the model has to do when it decides to call a tool.',
    options:[
      {t:'So Python knows where to find the function in your codebase.'},
      {t:'So the model knows what tools exist, what they do, and what arguments to pass — it can\'t call something it doesn\'t know about.'},
      {t:'The schema is only needed for logging and debugging.'}
    ],
    correct:1,
    why:'The model decides which tool to call (and with what arguments) by reading the schema you provided. Without it, the model is blind — it doesn\'t know get_date() exists. The schema is the model\'s "menu" of available actions.',
    hints:[
      'If you walk into a restaurant with no menu, can you order? The model faces the same problem.',
      'The schema = name (what to call) + description (when to use it) + parameters (what inputs to give it).'
    ] },

  { type:'classify',
    prompt:'Sort these into: "Your code does it" vs "Model decides it".',
    sub:'Tap an item, then tap a bin.',
    buckets:['Your code does it 🐍','Model decides it 🧠'],
    items:[
      {t:'Actually calls the Gmail API', b:0},
      {t:'Picks which tool to use next', b:1},
      {t:'Runs the Python function', b:0},
      {t:'Writes the arguments to pass to the tool', b:1},
      {t:'Sends the tool result back as a message', b:0},
      {t:'Decides the final answer is ready', b:1}
    ],
    constraints:['All 6 sorted','All correct'],
    hints:[
      'The model outputs text and decisions. Your loop executes things.',
      'Any time something actually RUNS on a computer — that\'s your code, not the model.'
    ] },

  { type:'trace',
    prompt:'Walk an agent that fetches and summarises your unread email count.',
    sub:'Pick the agent\'s move at each step.',
    goal:'Tell me how many unread emails I have and summarise the subjects.',
    turns:[
      { situation:'Agent starts. Tools available: count_unread(), get_subjects(). Goal received.',
        q:'What should the agent do first?',
        options:['Output tool_use: count_unread()','Immediately write the final answer','Ask the user for their email password'],
        correct:0, log:'🧠 Think → "I need to count unread first."  🛠️ tool_use: count_unread()' },
      { situation:'Your code ran count_unread(). Result: 5. Sent as tool_result.',
        q:'The model now knows there are 5 unread. What next?',
        options:['Call get_subjects() to get the subjects','Stop — 5 is enough to answer','Tell the user there are 5 unread and end the conversation'],
        correct:0, log:'👀 Observe: 5 unread  →  🛠️ tool_use: get_subjects()' },
      { situation:'Your code ran get_subjects(). Result: ["Team standup", "Invoice #42", "Meeting invite", "Newsletter", "Job offer"]. Sent as tool_result.',
        q:'Both tools have run. The model has all the data. What does it do now?',
        options:['Write the final answer summarising both results','Call another tool to read each email body','Ask the user which subjects to summarise'],
        correct:0, log:'👀 Observe: 5 subjects  →  ✅ Write final answer.' }
    ],
    hints:[
      'The loop: think → act → observe. What\'s missing before the agent can answer?',
      'Once the model has all the data it needs, the stop condition is met — write the answer.'
    ] },

  { type:'mcq',
    prompt:'Your agent calls search_web("latest news") but the search API is down. It returns an error. What should your loop do?',
    sub:'This is the reliability question — the model called a tool but it failed.',
    options:[
      {t:'Crash the whole program with an unhandled exception.'},
      {t:'Return the error as a tool_result message so the model can decide what to do (retry, skip, or tell the user).'},
      {t:'Silently return an empty string and hope the model figures it out.'}
    ],
    correct:1,
    why:'The model is the decision-maker. When a tool fails, send the error back as a tool_result — the model can then choose to retry with different args, try a different tool, or tell the user gracefully. Crashing or hiding the error removes the model\'s ability to recover.',
    hints:[
      'Who decides what to do when something goes wrong — your loop or the model?',
      'The model can only respond to what\'s in the messages. If you hide the error, it\'s invisible to the model.'
    ] },

  { type:'multi',
    prompt:'Build the minimal list: what does every tool-calling agent loop MUST have?',
    sub:'Tap all that apply.',
    chips:['Tool schemas sent to the model','A way to detect tool_use in the model\'s response','Code that actually runs each tool','A way to send tool_result back','A fancy web UI','A database','A stop condition (when to end the loop)'],
    correct:[0,1,2,3,6],
    why:'The core loop: schemas (so model knows tools) → detect tool_use → run tool → send tool_result → check stop condition. A UI and database are extras — a perfectly good agent runs in a terminal with no database.',
    hints:[
      'Walk the 4-message exchange from the reveal step. What does your code need for each step?',
      'What\'s missing from that list that\'s a MUST for every loop, not just some agents?'
    ] },

  { type:'reflect', capture:true,
    prompt:'Now make it concrete for your agent.',
    sub:'Not graded — used to personalise examples in future lessons.',
    fields:[
      {k:'tool1', label:'Name one tool YOUR agent will need (e.g. read_inbox, search_sheet, send_slack):', ph:'e.g. read_gmail_inbox'},
      {k:'tool1_why', label:'One line: what does it return?', ph:'e.g. list of unread email subjects + senders'}
    ] },

  { type:'done' }
];

/* ===================== ENGINE (identical to M1) ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage'), actions = $('#actions');
let idx = 0, gems = 0, perfect = true;
function lms(p){ return (window.LMS && window.LMS.api ? window.LMS.api : '') + p; }
let stepStart=Date.now(), attemptNo=1;
function lmsEvent(correct,extra){ if(!window.LMS) return; var s=(typeof STEPS!=='undefined'&&STEPS[idx])?STEPS[idx]:{}; var body=Object.assign({step:idx,type:s.type||'',concept:s.concept||'',correct:!!correct,attempt_no:attemptNo,latency_ms:Date.now()-stepStart},extra||{}); fetch(lms('/progress'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){}); }
function markWrong(extra){ perfect=false; lmsEvent(false,extra); attemptNo++; }
function lmsIntervention(kind){ lmsEvent(false,{action:(kind==='tutor'?'tutor_ask':'hint'),intervention:kind}); }
function lmsProgress(){ if(!window.LMS) return; fetch(lms('/progress'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({step:idx,correct:true})}).catch(()=>{}); }
function lmsComplete(){ if(!window.LMS) return Promise.resolve(null); return fetch(lms('/complete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:gems,perfect:perfect})}).then(r=>r.json()).catch(()=>null); }
function lmsCapture(key,value){ if(!window.LMS||!value) return; fetch('/api/profile/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,value:value,source:'lesson'})}).catch(()=>{}); }
let work = {}; let answered = false;
function buildDots(){ const d=$('#dots'); d.innerHTML=''; STEPS.forEach(()=>{ const s=document.createElement('span'); d.appendChild(s); }); }
function progress(){ $('#barfill').style.width=(idx/(STEPS.length-1))*100+'%'; [...$('#dots').children].forEach((s,i)=>s.classList.toggle('on',i<=idx)); $('#gems').textContent=gems; }
function go(n){ idx=n; answered=false; work={};stepStart=Date.now();attemptNo=1; render(); }
function nextStep(){ if(idx<STEPS.length-1) go(idx+1); }
function award(n){ gems+=n; $('#gems').textContent=gems; }
function setActions(html){ actions.innerHTML=html; }
function primary(label,fn,disabled){ const b=document.createElement('button'); b.className='pill'+(disabled?' disabled':''); b.textContent=label; if(!disabled) b.onclick=fn; return b; }
function startOver(fn){ const b=document.createElement('button'); b.className='startover'; b.innerHTML='&#8635; Start over'; b.onclick=fn; return b; }
function feedback(ok,text,withWhy){ let fb=$('#fb'); if(!fb){ fb=document.createElement('div'); fb.id='fb'; fb.className='fb'; stage.appendChild(fb); } fb.className='fb show '+(ok?'ok':'no'); fb.innerHTML=text; if(ok&&withWhy){ const wrap=document.createElement('div'); wrap.className='why'; const w=primary('Why?',()=>showWhy(withWhy)); w.classList.add('ghost'); w.style.padding='8px 18px'; w.style.fontSize='14px'; const sk=document.createElement('button'); sk.className='pill ghost'; sk.style.padding='8px 18px'; sk.style.fontSize='14px'; sk.textContent='Skip explanation'; sk.onclick=()=>{award(10);nextStep();}; wrap.appendChild(w); wrap.appendChild(sk); fb.appendChild(wrap); } }
function showWhy(text){ feedback(true,'<b>Here\'s why:</b><br>'+text); setActions(''); actions.appendChild(primary('Got it',()=>{award(10);nextStep();})); }
function render(){ const step=STEPS[idx]; progress(); stage.innerHTML=''; setActions(''); ({intro:rIntro,mcq:rMcq,reveal:rReveal,classify:rClassify,order:rOrder,reflect:rReflect,tf:rTf,trace:rTrace,multi:rMulti,done:rDone})[step.type](step); }
function head(step){ if(step.art) stage.insertAdjacentHTML('beforeend',`<div class="intro-art">${step.art}</div>`); stage.insertAdjacentHTML('beforeend',`<p class="prompt">${step.prompt}</p>`); if(step.sub) stage.insertAdjacentHTML('beforeend',`<p class="sub">${step.sub}</p>`); }
function rIntro(step){ head(step); actions.appendChild(primary(step.cta||'Continue',nextStep)); }
function rMcq(step){ head(step); const wrap=document.createElement('div'); wrap.className='opts'; step.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<span class="tick"></span><span>${o.t}</span>`; b.onclick=()=>{ if(answered) return; work.sel=i; [...wrap.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); renderMcqActions(step,wrap); }; wrap.appendChild(b); }); stage.appendChild(wrap); renderMcqActions(step,wrap); }
function renderMcqActions(step,wrap){ setActions(''); actions.appendChild(primary('Check',()=>checkMcq(step,wrap),work.sel===undefined)); }
function checkMcq(step,wrap){ answered=true; const ok=work.sel===step.correct; [...wrap.children].forEach((c,i)=>{ if(i===step.correct) c.classList.add('correct'); else if(i===work.sel) c.classList.add('wrong'); else c.classList.add('dim'); }); if(ok){ award(10); lmsProgress(); feedback(true,'<b>Correct.</b>',step.why); setActions(''); } else{ markWrong(); feedback(false,'Not quite — see the highlighted answer. Want a hand?'); nudge(step,true); setActions(''); actions.appendChild(primary('Continue',()=>{ feedback(true,'<b>Why:</b> '+step.why); setActions(''); actions.appendChild(primary('Got it',nextStep)); })); } }
function rReveal(step){ head(step); const grid=document.createElement('div'); grid.className='cards4'; let opened=0; step.cards.forEach(c=>{ const card=document.createElement('div'); card.className='pcard'; card.innerHTML=`<h4><span class="em">${c.em}</span>${c.h}</h4><div class="body">${c.b}</div>`; card.onclick=()=>{ if(!card.classList.contains('opened')){card.classList.add('opened');opened++; if(opened===step.cards.length) enableContinue();} }; grid.appendChild(card); }); stage.appendChild(grid); const cont=primary('Continue',nextStep,true); actions.appendChild(cont); function enableContinue(){ cont.classList.remove('disabled'); cont.onclick=nextStep; } }
function rClassify(step){ head(step); work.place={}; const cons=document.createElement('div'); cons.className='constraints'; cons.innerHTML=step.constraints.map(c=>`<div class="crow"><span class="ic">○</span>${c}</div>`).join(''); stage.appendChild(cons); const bwrap=document.createElement('div'); bwrap.className='buckets'; step.buckets.forEach((name,bi)=>{ const bk=document.createElement('div'); bk.className='bucket'; bk.dataset.bi=bi; bk.innerHTML=`<div class="blabel">${name}</div><div class="holder"></div>`; bk.onclick=()=>{ if(work.selItem!=null){ placeItem(work.selItem,bi); } }; bwrap.appendChild(bk); }); stage.appendChild(bwrap); const tray=document.createElement('div'); tray.className='tray'; tray.id='tray'; step.items.forEach((it,ii)=>{ const c=document.createElement('button'); c.className='chip'; c.dataset.ii=ii; c.textContent=it.t; c.onclick=()=>selectItem(ii,c); tray.appendChild(c); }); stage.appendChild(tray); renderClassifyActions(step); function selectItem(ii,c){ if(answered) return; work.selItem=(work.selItem===ii?null:ii); document.querySelectorAll('#tray .chip, .holder .chip').forEach(x=>x.classList.remove('sel')); if(work.selItem!=null) c.classList.add('sel'); } function placeItem(ii,bi){ if(answered) return; work.place[ii]=bi; work.selItem=null; document.querySelectorAll('.holder').forEach(h=>h.innerHTML=''); document.querySelectorAll('#tray .chip').forEach(ch=>ch.style.display=''); step.items.forEach((it,k)=>{ if(work.place[k]!=null){ document.querySelector(`#tray .chip[data-ii="${k}"]`).style.display='none'; const holder=document.querySelector(`.bucket[data-bi="${work.place[k]}"] .holder`); const c=document.createElement('button'); c.className='chip placed'; c.textContent=it.t; c.onclick=()=>{ if(answered) return; delete work.place[k]; render(); }; holder.appendChild(c); } }); renderClassifyActions(step); } }
function renderClassifyActions(step){ const all=Object.keys(work.place||{}).length===step.items.length; setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkClassify(step),!all)); }
function checkClassify(step){ answered=true; let allCorrect=true; step.items.forEach((it,ii)=>{ const correct=work.place[ii]===it.b; if(!correct) allCorrect=false; const chip=[...document.querySelectorAll('.holder .chip')].find(c=>c.textContent===it.t); if(chip) chip.classList.add(correct?'ok':'bad'); }); const cons=stage.querySelector('.constraints'); cons.children[0].classList.add('met'); cons.children[0].querySelector('.ic').textContent='✓'; if(allCorrect){ cons.children[1].classList.add('met'); cons.children[1].querySelector('.ic').textContent='✓'; cons.classList.add('done'); } if(allCorrect){ award(15); lmsProgress(); feedback(true,'<b>All sorted correctly.</b>'); setActions(''); actions.appendChild(primary('Continue',nextStep)); } else{ markWrong(); feedback(false,'Some are off (red). Tap to move them, then check again.'); nudge(step,true); answered=false; setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkClassify(step))); } }
function rOrder(step){ head(step); work.seq=[]; const cons=document.createElement('div'); cons.className='constraints'; cons.innerHTML=`<div class="crow"><span class="ic">○</span>${step.constraints[0]}</div>`; stage.appendChild(cons); const seq=document.createElement('div'); seq.className='seq'; seq.id='seq'; seq.innerHTML='<span class="slot">Tap the steps below in order…</span>'; stage.appendChild(seq); const tray=document.createElement('div'); tray.className='tray'; tray.id='otray'; step.chips.forEach((t,ci)=>{ const c=document.createElement('button'); c.className='chip'; c.dataset.ci=ci; c.textContent=t; c.onclick=()=>{ if(answered||work.seq.includes(ci)) return; work.seq.push(ci); c.style.display='none'; drawSeq(step); }; tray.appendChild(c); }); stage.appendChild(tray); renderOrderActions(step); }
function drawSeq(step){ const seq=$('#seq'); seq.innerHTML=''; work.seq.forEach((ci,pos)=>{ if(pos) seq.insertAdjacentHTML('beforeend','<span class="arrow">→</span>'); const c=document.createElement('button'); c.className='chip placed'; c.textContent=step.chips[ci]; c.onclick=()=>{ if(answered) return; work.seq.splice(pos,1); document.querySelector(`#otray .chip[data-ci="${ci}"]`).style.display=''; drawSeq(step); }; seq.appendChild(c); }); if(work.seq.length){ seq.insertAdjacentHTML('beforeend','<span class="arrow">→ 🔁 repeat</span>'); } else seq.innerHTML='<span class="slot">Tap the steps below in order…</span>'; renderOrderActions(step); }
function renderOrderActions(step){ setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkOrder(step),work.seq.length!==step.chips.length)); }
function checkOrder(step){ const ok=JSON.stringify(work.seq)===JSON.stringify(step.correct); const cons=stage.querySelector('.constraints'); if(ok){ answered=true; cons.children[0].classList.add('met'); cons.children[0].querySelector('.ic').textContent='✓'; cons.classList.add('done'); award(15); lmsProgress(); feedback(true,'<b>That\'s the full tool exchange.</b> Goal → model requests tool → you run it → result back → model answers. This cycle is the heartbeat of every tool-calling agent.'); setActions(''); actions.appendChild(primary('Continue',nextStep)); } else{ markWrong(); feedback(false,'Not that order. Tap a step in the sequence to remove it, then retry.'); nudge(step,true); } }
function rReflect(step){ head(step); step.fields.forEach(f=>{ const d=document.createElement('div'); d.className='field'; d.innerHTML=`<label>${f.label}</label><input id="f_${f.k}" placeholder="${f.ph}" />`; stage.appendChild(d); }); const inputs=step.fields.map(f=>$('#f_'+f.k)); const btn=document.createElement('button'); btn.className='pill disabled'; btn.textContent='Save & continue'; btn.onclick=()=>{ if(btn.classList.contains('disabled')) return; if(step.capture){ inputs.forEach((i,ix)=>lmsCapture(step.fields[ix].k,i.value.trim())); } feedback(true,'<b>Saved.</b> We\'ll use this to make examples concrete for your agent.'); setActions(''); actions.appendChild(primary('Continue',()=>{award(20);nextStep();})); }; actions.appendChild(btn); inputs.forEach(i=>i.addEventListener('input',()=>{ const ok=inputs.every(x=>x.value.trim().length>2); btn.classList.toggle('disabled',!ok); })); }
function rMulti(step){ head(step); work.multi=new Set(); const wrap=document.createElement('div'); wrap.className='tray'; step.chips.forEach((c,i)=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=c; b.onclick=()=>{ if(answered) return; if(work.multi.has(i)){work.multi.delete(i);b.classList.remove('sel');}else{work.multi.add(i);b.classList.add('sel');} renderMultiActions(step); }; wrap.appendChild(b); }); stage.appendChild(wrap); work._mwrap=wrap; renderMultiActions(step); }
function renderMultiActions(step){ setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkMulti(step),work.multi.size===0)); }
function checkMulti(step){ const chosen=[...work.multi].sort((a,b)=>a-b), correct=[...step.correct].sort((a,b)=>a-b); const ok=chosen.length===correct.length&&chosen.every((v,k)=>v===correct[k]); if(ok){ answered=true; [...work._mwrap.children].forEach((b,i)=>{ if(step.correct.includes(i)) b.classList.add('ok'); }); award(15); lmsProgress(); feedback(true,'<b>That\'s the minimal agent loop.</b>',step.why); setActions(''); } else{ markWrong(); feedback(false,'Not quite — pick every MUST-HAVE. A UI and database are optional extras.'); nudge(step,true); setActions(''); actions.appendChild(startOver(()=>go(idx))); actions.appendChild(primary('Check',()=>checkMulti(step))); } }
function rDone(){ progress(); stage.innerHTML=`<div class="done-wrap"><div class="done-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="prompt">You can wire up a tool-calling agent.</p><p class="sub">The 4-message exchange is the backbone of every agent you build from here. Model requests → you run → result back → model continues.</p><div class="summary"><div class="crow met"><span class="ic">✓</span>Tool schemas tell the model what tools exist</div><div class="crow met"><span class="ic">✓</span>Your loop detects tool_use and runs the function</div><div class="crow met"><span class="ic">✓</span>tool_result flows back so the model can continue</div><div class="crow met"><span class="ic">✓</span>Errors are tool_results too — let the model decide</div></div><p class="sub" style="margin-top:22px;">Earned <b>${gems} gems</b> · Bring a run log showing a tool call + result to Friday.</p></div>`; setActions(''); actions.appendChild(startOver(()=>{gems=0;perfect=true;go(0);})); const a=document.createElement('a'); a.href=(window.LMS?'/dashboard':'#'); a.className='pill'; a.textContent='Back to my journey →'; actions.appendChild(a); lmsComplete().then(d=>{ if(window.celebrate){ celebrate('lesson',{text:(d&&d.fresh===false)?'Nice — replayed!':'Lesson complete! 🎉'}); } }); }
function rTf(step){ head(step); work.tf={}; const wrap=document.createElement('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:12px;'; step.statements.forEach((s,i)=>{ const row=document.createElement('div'); row.style.cssText='border:1.5px solid var(--lav-bd);border-radius:11px;padding:12px 14px;'; const txt=document.createElement('div'); txt.style.cssText='font-size:15px;margin-bottom:10px;'; txt.textContent=s.t; row.appendChild(txt); const btns=document.createElement('div'); btns.style.cssText='display:flex;gap:8px;'; ['True','False'].forEach((lab,bi)=>{ const b=document.createElement('button'); b.className='opt'; b.style.cssText='flex:1;justify-content:center;padding:9px;'; b.textContent=lab; b.onclick=()=>{ if(answered) return; work.tf[i]=(bi===0); [...btns.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); renderTfActions(step); }; btns.appendChild(b); }); row.appendChild(btns); wrap.appendChild(row); }); stage.appendChild(wrap); work._tfwrap=wrap; renderTfActions(step); }
function renderTfActions(step){ const all=Object.keys(work.tf).length===step.statements.length; setActions(''); actions.appendChild(primary('Check',()=>checkTf(step),!all)); }
function checkTf(step){ answered=true; let allCorrect=true; const wrap=work._tfwrap; step.statements.forEach((s,i)=>{ const row=wrap.children[i], btns=row.children[1]; const correct=work.tf[i]===s.answer; if(!correct) allCorrect=false; btns.children[work.tf[i]?0:1].classList.add(correct?'correct':'wrong'); if(!correct) btns.children[s.answer?0:1].classList.add('correct'); const w=document.createElement('div'); w.style.cssText='font-size:13px;color:var(--muted);margin-top:9px;'; w.textContent=s.why; row.appendChild(w); }); if(allCorrect){ award(15); lmsProgress(); feedback(true,'<b>All correct.</b>'); } else{ markWrong(); feedback(false,'A couple were off — answers shown below each.'); nudge(step,true); } setActions(''); actions.appendChild(primary('Continue',nextStep)); }
function rTrace(step){ head(step); work.turn=0; const goal=document.createElement('div'); goal.style.cssText='background:var(--lav-bg);border:1px solid var(--lav-bd);border-radius:12px;padding:11px 14px;margin:0 0 14px;color:var(--lav-deep);font-size:14.5px;'; goal.innerHTML='🎯 <b style="font-weight:500;">Goal:</b> '+step.goal; stage.appendChild(goal); const log=document.createElement('div'); log.id='tracelog'; log.style.cssText='display:flex;flex-direction:column;gap:6px;margin:0 0 14px;'; stage.appendChild(log); const box=document.createElement('div'); box.id='turnbox'; stage.appendChild(box); renderTurn(step); }
function renderTurn(step){ const t=step.turns[work.turn], box=$('#turnbox'); box.innerHTML=''; const sit=document.createElement('p'); sit.className='sub'; sit.style.margin='0 0 12px'; sit.textContent='Turn '+(work.turn+1)+'/'+step.turns.length+' — '+t.situation; box.appendChild(sit); const q=document.createElement('p'); q.className='prompt'; q.style.fontSize='17px'; q.textContent=t.q; box.appendChild(q); const opts=document.createElement('div'); opts.className='opts'; t.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML='<span class="tick"></span><span>'+o+'</span>'; b.onclick=()=>pickTurn(step,i,b,opts); opts.appendChild(b); }); box.appendChild(opts); setActions(''); }
function pickTurn(step,i,b,opts){ const t=step.turns[work.turn]; if(i===t.correct){ [...opts.children].forEach(c=>c.classList.add('dim')); b.classList.remove('dim'); b.classList.add('correct'); const row=document.createElement('div'); row.style.cssText='font-size:13.5px;color:var(--green-dk);background:#effaf1;border-radius:8px;padding:7px 11px;'; row.textContent=t.log; $('#tracelog').appendChild(row); award(8); lmsProgress(); work.turn++; if(work.turn>=step.turns.length){ feedback(true,'<b>Clean run.</b> The agent used two tools in sequence, got the data it needed, then wrote the final answer. That\'s the pattern for every data-fetching agent.'); setActions(''); actions.appendChild(primary('Continue',nextStep)); } else setTimeout(()=>renderTurn(step),380); } else{ markWrong(); b.classList.add('wrong'); feedback(false,'Not the agent\'s move here — think about what it still needs to answer the goal.'); nudge(step,true); } }

/* ===================== TUTOR ===================== */
const tutor=$('#tutor'), msgs=$('#msgs'), quick=$('#quick');
let convo=[];
$('#kojiLaunch').onclick=()=>openTutor();
$('#tclose').onclick=()=>tutor.classList.remove('open');
function openTutor(){ tutor.classList.add('open'); if(!msgs.children.length){ const g="Hi — I'm your TrigunAI guide. Ask me anything about tool calling — I won't give you the answer, but I'll help you find it."; bot(g); convo.push({role:'assistant',content:g}); } renderQuick(); $('#tin').focus(); }
function bot(t){ const m=document.createElement('div'); m.className='msg bot'; m.textContent=t; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; }
function me(t){ const m=document.createElement('div'); m.className='msg me'; m.textContent=t; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; }
function botTyping(){ const m=document.createElement('div'); m.className='msg bot'; m.textContent='…'; m.style.opacity='.6'; msgs.appendChild(m); msgs.scrollTop=msgs.scrollHeight; return m; }
function problemContext(){ const s=STEPS[idx]; if(!s) return ''; let p=`Step type: ${s.type}. Prompt: "${s.prompt}".`; if(s.type==='mcq') p+='\nOptions:\n'+s.options.map((o,i)=>`  [${i}] ${o.t}${i===s.correct?'  <-- CORRECT, never reveal':''}`).join('\n'); return p; }
function fallbackHint(text){ const h=(STEPS[idx]&&STEPS[idx].hints)||[]; if(/wrong/i.test(text)) return h[0]||"What made you pick that? Let's reason through it."; if(/stuck/i.test(text)) return h[h.length-1]||"Re-read the prompt — what ONE thing is it asking?"; return h[0]||"Which part is confusing? Name it."; }
async function askGuide(text,opts){ opts=opts||{}; lmsIntervention(opts.auto?'hint':'tutor'); if(!opts.auto) me(text); convo.push({role:'user',content:text}); const typing=botTyping(); let reply=null; try{ if(window.LMS){ const res=await fetch('/api/tutor/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:convo,problem:problemContext()})}); const d=await res.json(); reply=d.reply; } }catch(e){} typing.remove(); const out=reply||fallbackHint(text); bot(out); convo.push({role:'assistant',content:out}); }
function nudge(step,auto){ if(auto) tutor.classList.add('open'); renderQuick(); askGuide("I just answered this wrong. Give me a Socratic hint — don't tell me the answer.",{auto:true}); }
function renderQuick(){ quick.innerHTML=''; ['Why was my answer wrong?','Give me a hint','Explain it in my world','I\'m stuck'].forEach(q=>{ const b=document.createElement('button'); b.textContent=q; b.onclick=()=>{ const msg=q==='Explain it in my world'?'Explain this concept using an example from MY own work or interests.':(q==='I\'m stuck'?"I'm totally stuck — give me the smallest next step.":q); askGuide(msg); }; quick.appendChild(b); }); }
$('#tsend').onclick=sendTin; $('#tin').addEventListener('keydown',e=>{if(e.key==='Enter')sendTin();});
function sendTin(){ const v=$('#tin').value.trim(); if(!v) return; $('#tin').value=''; askGuide(v); }

buildDots(); render();
</script>
