<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tools &amp; integrations · TrigunAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="/static/celebrate.js"></script>
<style>
  :root{--bg:#fff;--ink:#2b2b33;--muted:#8a8a99;--lav-bg:#eef0fb;--lav-bd:#c9d0f5;--lav-deep:#3a44b8;--indigo:#5b63e6;--green:#22c55e;--green-dk:#15803d;--red:#ef4444;--red-bg:#fdecec;--btn:#2d2d33;--btn-dis:#e6e6ec;--rb:11px;--shadow:0 1px 2px rgba(30,30,60,.05),0 8px 24px rgba(30,30,60,.06);}
  *{box-sizing:border-box;}html,body{margin:0;height:100%;}
  body{font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  header{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:1px solid #f0f0f5;}
  .x-btn{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
  .bar{flex:1;height:12px;border-radius:99px;background:#eceef2;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.4,1.3,.5,1);}
  .dots{display:flex;gap:7px;}.dots > span{width:8px;height:8px;border-radius:50%;background:#dcdce4;transition:background .3s;}.dots > span.on{background:var(--green);}
  .streak{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:15px;}.streak svg{width:18px;height:18px;}
  main{flex:1;display:flex;justify-content:center;padding:40px 24px 130px;}
  .stage{width:100%;max-width:620px;animation:rise .4s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .prompt{font-size:20px;font-weight:500;line-height:1.45;margin:0 0 8px;}.sub{font-size:15.5px;color:var(--muted);line-height:1.6;margin:0 0 22px;}.intro-art{font-size:46px;text-align:center;margin:18px 0 26px;}
  .constraints{border:1.5px solid var(--lav-bd);border-radius:14px;padding:12px 16px;margin:0 0 18px;background:#fafbff;transition:border-color .3s;}.constraints.done{border-color:var(--green);}
  .crow{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);padding:4px 0;}.crow .ic{width:18px;height:18px;flex:0 0 18px;color:var(--muted);}.crow.met .ic{color:var(--green);}.crow.met{color:var(--green-dk);}
  .opts{display:flex;flex-direction:column;gap:12px;margin:0 0 8px;}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--lav-bd);background:#fff;border-radius:var(--rb);padding:15px 16px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;transition:.15s;width:100%;}
  .opt:hover{background:var(--lav-bg);}.opt .tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--lav-bd);}
  .opt.sel{border-color:var(--indigo);background:var(--lav-bg);}.opt.sel .tick{border-color:var(--indigo);background:var(--indigo);box-shadow:inset 0 0 0 3px #fff;}
  .opt.correct{border-color:var(--green);background:#effaf1;}.opt.correct .tick{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px #fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}.opt.dim{opacity:.5;}
  .cards4{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pcard{border:1.5px solid var(--lav-bd);background:var(--lav-bg);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.18s;}.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);}.pcard.opened{background:#fff;border-color:var(--indigo);}
  .pcard h4{margin:0 0 4px;font-size:15.5px;font-weight:600;color:var(--lav-deep);display:flex;align-items:center;gap:8px;}.pcard .body{font-size:13.5px;color:var(--muted);line-height:1.55;max-height:0;overflow:hidden;transition:max-height .3s;}.pcard.opened .body{max-height:200px;margin-top:6px;}.pcard .em{font-size:22px;}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px;}
  .bucket{border:1.5px dashed var(--lav-bd);border-radius:14px;min-height:78px;padding:10px;background:#fafbff;}.bucket .blabel{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}.bucket .holder{display:flex;flex-wrap:wrap;gap:8px;}
  .tray{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;}
  .chip{border:1.5px solid var(--lav-bd);background:#fff;border-radius:var(--rb);padding:9px 14px;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink);}.chip:hover{background:var(--lav-bg);}.chip.sel{border-color:var(--indigo);background:var(--indigo);color:#fff;}.chip.placed{border-color:var(--lav-bd);background:#fff;}.chip.ok{border-color:var(--green);background:#effaf1;color:var(--green-dk);}.chip.bad{border-color:var(--red);background:var(--red-bg);color:#b42318;}
  .seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:54px;border:1.5px solid var(--lav-bd);border-radius:14px;padding:12px;margin:0 0 14px;background:#fafbff;}.seq .slot{font-size:13.5px;color:var(--muted);}.arrow{color:var(--muted);font-size:14px;}
  .field{margin:0 0 16px;}.field label{display:block;font-size:14px;font-weight:500;margin:0 0 6px;}.field input{width:100%;border:1.5px solid var(--lav-bd);border-radius:var(--rb);padding:12px 14px;font:inherit;font-size:15px;}.field input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,99,230,.12);}
  .fb{border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:14.5px;line-height:1.55;display:none;}.fb.show{display:block;animation:rise .25s ease;}.fb.ok{background:#effaf1;color:var(--green-dk);}.fb.no{background:var(--red-bg);color:#b42318;}.fb .why{margin-top:10px;display:flex;gap:10px;}
  .done-wrap{text-align:center;padding:10px 0;}.done-badge{width:84px;height:84px;border-radius:50%;background:#effaf1;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .5s cubic-bezier(.3,1.5,.5,1);}.done-badge svg{width:44px;height:44px;color:var(--green);}
  @keyframes pop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  .summary{display:inline-block;text-align:left;margin:14px auto 0;}.summary .crow{font-size:15px;}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0f0f5;padding:16px 24px;display:flex;justify-content:center;}
  .actions{width:100%;max-width:620px;display:flex;gap:12px;align-items:center;justify-content:flex-end;}
  .startover{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-right:auto;}.startover:hover{color:var(--ink);}
  .pill{border:none;border-radius:99px;padding:14px 40px;font:inherit;font-weight:500;font-size:16px;color:#fff;background:var(--btn);cursor:pointer;transition:.15s;}.pill:hover{filter:brightness(1.12);}.pill:active{transform:scale(.98);}.pill.disabled{background:var(--btn-dis);color:#b3b3bd;cursor:not-allowed;pointer-events:none;}.pill.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--lav-bd);}
  .koji-launch{position:fixed;left:22px;bottom:22px;width:54px;height:54px;border:none;cursor:pointer;background:none;z-index:40;transition:transform .2s;}.koji-launch:hover{transform:scale(1.08) rotate(-6deg);}.koji-launch .gem{width:54px;height:54px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);border-radius:14px;box-shadow:0 6px 18px rgba(74,82,214,.4);}.koji-launch .gem::after{content:'';position:absolute;inset:14px;background:#fff;border-radius:6px;}
  .tutor{position:fixed;top:0;bottom:0;left:0;width:340px;background:#fff;border-right:1px solid #eee;z-index:50;transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,1,.4,1);display:flex;flex-direction:column;box-shadow:6px 0 28px rgba(30,30,60,.10);}.tutor.open{transform:none;}
  .tutor .thead{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;border-bottom:1px solid #f2f2f7;}.tutor .thead .mini{width:26px;height:26px;background:linear-gradient(135deg,#7c83f3,#4a52d6);transform:rotate(45deg);border-radius:7px;}.tutor .thead b{font-size:15px;font-weight:600;}.tutor .thead small{color:var(--muted);font-size:12px;display:block;}.tutor .tclose{margin-left:auto;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}.msg{max-width:85%;font-size:14px;line-height:1.5;padding:10px 13px;border-radius:14px;}.msg.bot{background:#eef0fb;color:#3a44b8;border-bottom-left-radius:4px;align-self:flex-start;}.msg.me{background:var(--lav-bg);color:var(--lav-deep);border-bottom-right-radius:4px;align-self:flex-end;}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px;}.quick button{border:1.5px solid var(--lav-bd);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:12.5px;color:var(--lav-deep);cursor:pointer;}.quick button:hover{background:var(--lav-bg);}
  .tinput{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f2f2f7;}.tinput input{flex:1;border:1.5px solid var(--lav-bd);border-radius:99px;padding:10px 14px;font:inherit;font-size:13.5px;}.tinput input:focus{outline:none;border-color:var(--indigo);}.tinput button{border:none;background:var(--indigo);color:#fff;border-radius:99px;width:40px;cursor:pointer;font-size:16px;}
  @media(max-width:560px){.cards4,.buckets{grid-template-columns:1fr;}.tutor{width:88%;}.pill{padding:14px 28px;}}
</style>

<link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon-16.png" />

<body>
<h2 class="sr-only">Interactive lesson: tools and integrations — schemas, design, and connecting your real data.</h2>
<header>
  <button class="x-btn" onclick="window.location.href=(window.LMS?'/dashboard':'about:blank')">&times;</button>
  <div class="bar"><i id="barfill"></i></div>
  <div class="dots" id="dots"></div>
  <div class="streak"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l3 5-9 13L3 8z" stroke="#cfcfda" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="gems">0</span></div>
</header>
<main><div class="stage" id="stage"></div></main>
<footer><div class="actions" id="actions"></div></footer>
<button class="koji-launch" id="kojiLaunch"><span class="gem"></span></button>
<aside class="tutor" id="tutor">
  <div class="thead"><span class="mini"></span><div><b>TrigunAI guide</b><small>here to guide, not hand you answers</small></div><button class="tclose" id="tclose">&times;</button></div>
  <div class="msgs" id="msgs"></div><div class="quick" id="quick"></div>
  <div class="tinput"><input id="tin" placeholder="Ask your guide…" /><button id="tsend">&rarr;</button></div>
</aside>
<script>
const STEPS = [
  { type:'intro', art:'🔌 → 📋',
    prompt:'Tools & integrations',
    sub:"You know the tool exchange from M2. Now: how do you design a good tool? What goes in the schema? And how do you connect your agent to a REAL system — Gmail, Google Sheets, Slack, files? This lesson is the practical build layer.",
    cta:'Start' },

  { type:'reveal',
    prompt:'A tool schema has 3 required fields.',
    sub:'Tap each card — these are the fields your model reads before it decides to call a tool.',
    cards:[
      {em:'📛',h:'name', b:'The exact Python function name. The model will output this string in its tool_use block. e.g. "read_inbox"'},
      {em:'📝',h:'description', b:'A plain-English sentence the model reads to decide WHEN to use this tool. Be specific: "reads the 10 most recent unread Gmail messages and returns subject + sender." Vague descriptions = wrong tool calls.'},
      {em:'📐',h:'parameters', b:'A JSON Schema object describing the arguments. e.g. { "max_results": {"type":"integer","description":"how many emails to fetch","default":10} }. If a tool takes no arguments, use {"type":"object","properties":{}}.'}
    ] },

  { type:'mcq',
    prompt:'Your agent has a tool called search_web. You write: description: "searches the internet". What goes wrong?',
    sub:'Think about when the model reads this description.',
    options:[
      {t:'Nothing — the model will figure it out from the name.'},
      {t:'The model won\'t know WHEN to use it (what kinds of questions trigger it) or WHAT it returns, so it may call it too much, too little, or at the wrong time.'},
      {t:'Python will reject the schema and throw an error.'}
    ],
    correct:1,
    why:'The description is the model\'s decision trigger. "Searches the internet" tells it nothing about when to use it vs other tools, what queries work, or what the result looks like. A good description: "Searches the web for current information when the answer isn\'t in the user\'s files. Returns a list of {title, url, snippet} dicts."',
    hints:[
      'The model reads the description to DECIDE whether to call this tool. What decision does "searches the internet" actually help with?',
      'Compare: "when should I call this?" — does the description answer that question?'
    ] },

  { type:'classify',
    prompt:'Sort each tool design choice: GOOD or NEEDS WORK.',
    sub:'Tap item → tap bin.',
    buckets:['✅ Good design','⚠️ Needs work'],
    items:[
      {t:'One tool that reads Gmail AND sends Gmail AND archives Gmail', b:1},
      {t:'Three separate tools: read_inbox(), send_email(), archive_email()', b:0},
      {t:'Tool description: "does email stuff"', b:1},
      {t:'Tool returns structured dict with consistent keys', b:0},
      {t:'Tool that sometimes returns a string, sometimes a dict', b:1},
      {t:'Parameters with clear types and descriptions', b:0}
    ],
    constraints:['All 6 sorted','All correct'],
    hints:[
      'One giant tool that does everything is hard for the model to reason about — and hard to test.',
      'Inconsistent return types mean your loop code can\'t reliably handle the result.'
    ] },

  { type:'mcq',
    prompt:'Your read_sheet() tool successfully reads a CSV, but column names have spaces like "First Name". Your agent returns garbled output. What\'s the real issue?',
    sub:'This is the "integration gap" — real data rarely matches clean schemas.',
    options:[
      {t:'The model can\'t handle spaces in JSON keys.'},
      {t:'Your tool\'s return value needs normalisation — clean the column names to snake_case before returning so the model gets a consistent schema it can reason about.'},
      {t:'Google Sheets doesn\'t support CSV export.'}
    ],
    correct:1,
    why:'The model reasons over what you RETURN, not the raw external data. Raw data from real APIs (Sheets, Gmail, Slack) is messy. Your tool is the adapter — it should normalise, clean, and shape the data before handing it to the model. Think: "what\'s the cleanest JSON I can return that makes it easy for the model to use?"',
    hints:[
      'Your tool is a translator between the messy real world and the model. Which side should be cleaned?',
      'If you always return {"rows": [{"first_name":…}]}, the model always knows what to expect.'
    ] },

  { type:'reveal',
    prompt:'The 4 most common real-world integrations.',
    sub:'Tap each to see the key pattern and one gotcha.',
    cards:[
      {em:'📧',h:'Email (Gmail/Outlook)', b:'Use the gmail API or imaplib. Key pattern: fetch → parse → return clean dicts. Gotcha: OAuth2 token refresh — wrap in a try/except that refreshes before re-calling.'},
      {em:'📊',h:'Spreadsheets (Sheets/Excel)', b:'gspread or openpyxl. Key pattern: read as list-of-dicts, write as list-of-lists. Gotcha: rate limits — batch reads/writes, don\'t call per-row.'},
      {em:'🔍',h:'Web search', b:'Serper API or Tavily (both have free tiers). Key pattern: query → [{title, url, snippet}]. Gotcha: the model may over-search — add a max_calls guard in config.'},
      {em:'📁',h:'Local files', b:'pathlib + json/csv. Key pattern: read → parse → return clean structure. Gotcha: always use UTF-8 encoding explicitly; default encoding varies by OS.'}
    ] },

  { type:'tf',
    prompt:'Tool design myths — true or false?',
    sub:'Tap True or False for each, then check.',
    statements:[
      {t:'One giant do_everything() tool is better than many small tools because fewer calls = lower cost.', answer:false,
       why:'Fewer small tool calls CAN be cheaper — but a giant multi-purpose tool is harder for the model to reason about, harder to test, and breaks if one sub-function fails. Small, focused tools are more reliable and debuggable.'},
      {t:'If a tool fails, you should let the exception propagate up and crash the loop.', answer:false,
       why:'No — catch the exception in your tool, return {"error": "what went wrong"} as the result. Send it back as a tool_result. The model can then decide: retry, use a different tool, or tell the user gracefully.'},
      {t:'The description field is the most important part of the schema — the model reads it to decide WHEN to call the tool.', answer:true,
       why:'Correct. The name is just a label; the parameters tell the model WHAT to pass. The description is what drives the model\'s decision to use this tool vs another. Write it for the model, not for humans.'},
      {t:'Your tool should return data in the same messy format the external API gives you.', answer:false,
       why:'No — your tool is the adapter. Normalise, clean, and shape the data before returning it. The model works best with consistent, clean JSON, not raw API blobs.'}
    ] },

  { type:'reflect', capture:true,
    prompt:'Design YOUR tool.',
    sub:'Pick the first real tool you\'ll add to your agent this week.',
    fields:[
      {k:'my_tool_name', label:'Tool name (snake_case):', ph:'e.g. read_unread_emails'},
      {k:'my_tool_desc', label:'Description (write it FOR the model — when to use it, what it returns):', ph:'e.g. Reads the 10 most recent unread Gmail messages. Returns a list of {subject, sender, preview} dicts.'}
    ] },

  { type:'done' }
];

/* ENGINE */
const $=s=>document.querySelector(s);
const stage=$('#stage'),actions=$('#actions');
let idx=0,gems=0,perfect=true;
function lms(p){return(window.LMS&&window.LMS.api?window.LMS.api:'')+p;}
let stepStart=Date.now(), attemptNo=1;
function lmsEvent(correct,extra){ if(!window.LMS) return; var s=(typeof STEPS!=='undefined'&&STEPS[idx])?STEPS[idx]:{}; var body=Object.assign({step:idx,type:s.type||'',concept:s.concept||'',correct:!!correct,attempt_no:attemptNo,latency_ms:Date.now()-stepStart},extra||{}); fetch(lms('/progress'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){}); }
function markWrong(extra){ perfect=false; lmsEvent(false,extra); attemptNo++; }
function lmsIntervention(kind){ lmsEvent(false,{action:(kind==='tutor'?'tutor_ask':'hint'),intervention:kind}); }
function lmsProgress(){if(!window.LMS)return;fetch(lms('/progress'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({step:idx,correct:true})}).catch(()=>{});}
function lmsComplete(){if(!window.LMS)return Promise.resolve(null);return fetch(lms('/complete'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:gems,perfect:perfect})}).then(r=>r.json()).catch(()=>null);}
function lmsCapture(key,value){if(!window.LMS||!value)return;fetch('/api/profile/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value,source:'lesson'})}).catch(()=>{});}
let work={},answered=false;
function buildDots(){const d=$('#dots');d.innerHTML='';STEPS.forEach(()=>{const s=document.createElement('span');d.appendChild(s);});}
function progress(){$('#barfill').style.width=(idx/(STEPS.length-1))*100+'%';[...$('#dots').children].forEach((s,i)=>s.classList.toggle('on',i<=idx));$('#gems').textContent=gems;}
function go(n){idx=n;answered=false;work={};stepStart=Date.now();attemptNo=1;render();}
function nextStep(){if(idx<STEPS.length-1)go(idx+1);}
function award(n){gems+=n;$('#gems').textContent=gems;}
function setActions(h){actions.innerHTML=h;}
function primary(label,fn,disabled){const b=document.createElement('button');b.className='pill'+(disabled?' disabled':'');b.textContent=label;if(!disabled)b.onclick=fn;return b;}
function startOver(fn){const b=document.createElement('button');b.className='startover';b.innerHTML='&#8635; Start over';b.onclick=fn;return b;}
function feedback(ok,text,withWhy){let fb=$('#fb');if(!fb){fb=document.createElement('div');fb.id='fb';fb.className='fb';stage.appendChild(fb);}fb.className='fb show '+(ok?'ok':'no');fb.innerHTML=text;if(ok&&withWhy){const wrap=document.createElement('div');wrap.className='why';const w=primary('Why?',()=>showWhy(withWhy));w.classList.add('ghost');w.style.padding='8px 18px';w.style.fontSize='14px';const sk=document.createElement('button');sk.className='pill ghost';sk.style.padding='8px 18px';sk.style.fontSize='14px';sk.textContent='Skip explanation';sk.onclick=()=>{award(10);nextStep();};wrap.appendChild(w);wrap.appendChild(sk);fb.appendChild(wrap);}}
function showWhy(text){feedback(true,'<b>Here\'s why:</b><br>'+text);setActions('');actions.appendChild(primary('Got it',()=>{award(10);nextStep();}));}
function render(){const step=STEPS[idx];progress();stage.innerHTML='';setActions('');({intro:rIntro,mcq:rMcq,reveal:rReveal,classify:rClassify,order:rOrder,reflect:rReflect,tf:rTf,trace:rTrace,multi:rMulti,done:rDone})[step.type](step);}
function head(step){if(step.art)stage.insertAdjacentHTML('beforeend',`<div class="intro-art">${step.art}</div>`);stage.insertAdjacentHTML('beforeend',`<p class="prompt">${step.prompt}</p>`);if(step.sub)stage.insertAdjacentHTML('beforeend',`<p class="sub">${step.sub}</p>`);}
function rIntro(step){head(step);actions.appendChild(primary(step.cta||'Continue',nextStep));}
function rMcq(step){head(step);const wrap=document.createElement('div');wrap.className='opts';step.options.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="tick"></span><span>${o.t}</span>`;b.onclick=()=>{if(answered)return;work.sel=i;[...wrap.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');renderMcqActions(step,wrap);};wrap.appendChild(b);});stage.appendChild(wrap);renderMcqActions(step,wrap);}
function renderMcqActions(step,wrap){setActions('');actions.appendChild(primary('Check',()=>checkMcq(step,wrap),work.sel===undefined));}
function checkMcq(step,wrap){answered=true;const ok=work.sel===step.correct;[...wrap.children].forEach((c,i)=>{if(i===step.correct)c.classList.add('correct');else if(i===work.sel)c.classList.add('wrong');else c.classList.add('dim');});if(ok){award(10);lmsProgress();feedback(true,'<b>Correct.</b>',step.why);setActions('');}else{markWrong();feedback(false,'Not quite — see the highlighted answer.');nudge(step,true);setActions('');actions.appendChild(primary('Continue',()=>{feedback(true,'<b>Why:</b> '+step.why);setActions('');actions.appendChild(primary('Got it',nextStep));}));}}
function rReveal(step){head(step);const grid=document.createElement('div');grid.className='cards4';let opened=0;step.cards.forEach(c=>{const card=document.createElement('div');card.className='pcard';card.innerHTML=`<h4><span class="em">${c.em}</span>${c.h}</h4><div class="body">${c.b}</div>`;card.onclick=()=>{if(!card.classList.contains('opened')){card.classList.add('opened');opened++;if(opened===step.cards.length)enableContinue();}};grid.appendChild(card);});stage.appendChild(grid);const cont=primary('Continue',nextStep,true);actions.appendChild(cont);function enableContinue(){cont.classList.remove('disabled');cont.onclick=nextStep;}}
function rClassify(step){head(step);work.place={};const cons=document.createElement('div');cons.className='constraints';cons.innerHTML=step.constraints.map(c=>`<div class="crow"><span class="ic">○</span>${c}</div>`).join('');stage.appendChild(cons);const bwrap=document.createElement('div');bwrap.className='buckets';step.buckets.forEach((name,bi)=>{const bk=document.createElement('div');bk.className='bucket';bk.dataset.bi=bi;bk.innerHTML=`<div class="blabel">${name}</div><div class="holder"></div>`;bk.onclick=()=>{if(work.selItem!=null)placeItem(work.selItem,bi);};bwrap.appendChild(bk);});stage.appendChild(bwrap);const tray=document.createElement('div');tray.className='tray';tray.id='tray';step.items.forEach((it,ii)=>{const c=document.createElement('button');c.className='chip';c.dataset.ii=ii;c.textContent=it.t;c.onclick=()=>selectItem(ii,c);tray.appendChild(c);});stage.appendChild(tray);renderClassifyActions(step);function selectItem(ii,c){if(answered)return;work.selItem=(work.selItem===ii?null:ii);document.querySelectorAll('#tray .chip, .holder .chip').forEach(x=>x.classList.remove('sel'));if(work.selItem!=null)c.classList.add('sel');}function placeItem(ii,bi){if(answered)return;work.place[ii]=bi;work.selItem=null;document.querySelectorAll('.holder').forEach(h=>h.innerHTML='');document.querySelectorAll('#tray .chip').forEach(ch=>ch.style.display='');step.items.forEach((it,k)=>{if(work.place[k]!=null){document.querySelector(`#tray .chip[data-ii="${k}"]`).style.display='none';const holder=document.querySelector(`.bucket[data-bi="${work.place[k]}"] .holder`);const c=document.createElement('button');c.className='chip placed';c.textContent=it.t;c.onclick=()=>{if(answered)return;delete work.place[k];render();};holder.appendChild(c);}});renderClassifyActions(step);}}
function renderClassifyActions(step){const all=Object.keys(work.place||{}).length===step.items.length;setActions('');actions.appendChild(startOver(()=>go(idx)));actions.appendChild(primary('Check',()=>checkClassify(step),!all));}
function checkClassify(step){answered=true;let allCorrect=true;step.items.forEach((it,ii)=>{const correct=work.place[ii]===it.b;if(!correct)allCorrect=false;const chip=[...document.querySelectorAll('.holder .chip')].find(c=>c.textContent===it.t);if(chip)chip.classList.add(correct?'ok':'bad');});const cons=stage.querySelector('.constraints');cons.children[0].classList.add('met');cons.children[0].querySelector('.ic').textContent='✓';if(allCorrect){cons.children[1].classList.add('met');cons.children[1].querySelector('.ic').textContent='✓';cons.classList.add('done');}if(allCorrect){award(15);lmsProgress();feedback(true,'<b>All sorted correctly.</b>');setActions('');actions.appendChild(primary('Continue',nextStep));}else{markWrong();feedback(false,'Some are off — tap to move them, then check again.');nudge(step,true);answered=false;setActions('');actions.appendChild(startOver(()=>go(idx)));actions.appendChild(primary('Check',()=>checkClassify(step)));}}
function rOrder(step){head(step);work.seq=[];const cons=document.createElement('div');cons.className='constraints';cons.innerHTML=`<div class="crow"><span class="ic">○</span>${step.constraints[0]}</div>`;stage.appendChild(cons);const seq=document.createElement('div');seq.className='seq';seq.id='seq';seq.innerHTML='<span class="slot">Tap the steps below in order…</span>';stage.appendChild(seq);const tray=document.createElement('div');tray.className='tray';tray.id='otray';step.chips.forEach((t,ci)=>{const c=document.createElement('button');c.className='chip';c.dataset.ci=ci;c.textContent=t;c.onclick=()=>{if(answered||work.seq.includes(ci))return;work.seq.push(ci);c.style.display='none';drawSeq(step);};tray.appendChild(c);});stage.appendChild(tray);renderOrderActions(step);}
function drawSeq(step){const seq=$('#seq');seq.innerHTML='';work.seq.forEach((ci,pos)=>{if(pos)seq.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');const c=document.createElement('button');c.className='chip placed';c.textContent=step.chips[ci];c.onclick=()=>{if(answered)return;work.seq.splice(pos,1);document.querySelector(`#otray .chip[data-ci="${ci}"]`).style.display='';drawSeq(step);};seq.appendChild(c);});if(work.seq.length)seq.insertAdjacentHTML('beforeend','<span class="arrow">→ 🔁</span>');else seq.innerHTML='<span class="slot">Tap the steps below in order…</span>';renderOrderActions(step);}
function renderOrderActions(step){setActions('');actions.appendChild(startOver(()=>go(idx)));actions.appendChild(primary('Check',()=>checkOrder(step),work.seq.length!==step.chips.length));}
function checkOrder(step){const ok=JSON.stringify(work.seq)===JSON.stringify(step.correct);const cons=stage.querySelector('.constraints');if(ok){answered=true;cons.children[0].classList.add('met');cons.children[0].querySelector('.ic').textContent='✓';cons.classList.add('done');award(15);lmsProgress();feedback(true,'<b>Correct order.</b>');setActions('');actions.appendChild(primary('Continue',nextStep));}else{markWrong();feedback(false,'Not that order — tap to remove a step and retry.');nudge(step,true);}}
function rReflect(step){head(step);step.fields.forEach(f=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${f.label}</label><input id="f_${f.k}" placeholder="${f.ph}" />`;stage.appendChild(d);});const inputs=step.fields.map(f=>$('#f_'+f.k));const btn=document.createElement('button');btn.className='pill disabled';btn.textContent='Save & continue';btn.onclick=()=>{if(btn.classList.contains('disabled'))return;if(step.capture)inputs.forEach((i,ix)=>lmsCapture(step.fields[ix].k,i.value.trim()));feedback(true,'<b>Saved.</b> Bring this tool to Friday — wire it up this week.');setActions('');actions.appendChild(primary('Continue',()=>{award(20);nextStep();}));};actions.appendChild(btn);inputs.forEach(i=>i.addEventListener('input',()=>{btn.classList.toggle('disabled',!inputs.every(x=>x.value.trim().length>2));}));}
function rMulti(step){head(step);work.multi=new Set();const wrap=document.createElement('div');wrap.className='tray';step.chips.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{if(answered)return;if(work.multi.has(i)){work.multi.delete(i);b.classList.remove('sel');}else{work.multi.add(i);b.classList.add('sel');}renderMultiActions(step);};wrap.appendChild(b);});stage.appendChild(wrap);work._mwrap=wrap;renderMultiActions(step);}
function renderMultiActions(step){setActions('');actions.appendChild(startOver(()=>go(idx)));actions.appendChild(primary('Check',()=>checkMulti(step),work.multi.size===0));}
function checkMulti(step){const chosen=[...work.multi].sort((a,b)=>a-b),correct=[...step.correct].sort((a,b)=>a-b);const ok=chosen.length===correct.length&&chosen.every((v,k)=>v===correct[k]);if(ok){answered=true;[...work._mwrap.children].forEach((b,i)=>{if(step.correct.includes(i))b.classList.add('ok');});award(15);lmsProgress();feedback(true,'<b>Correct.</b>',step.why);setActions('');}else{markWrong();feedback(false,'Not quite — adjust and check again.');nudge(step,true);setActions('');actions.appendChild(startOver(()=>go(idx)));actions.appendChild(primary('Check',()=>checkMulti(step)));}}
function rTf(step){head(step);work.tf={};const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:12px;';step.statements.forEach((s,i)=>{const row=document.createElement('div');row.style.cssText='border:1.5px solid var(--lav-bd);border-radius:11px;padding:12px 14px;';const txt=document.createElement('div');txt.style.cssText='font-size:15px;margin-bottom:10px;';txt.textContent=s.t;row.appendChild(txt);const btns=document.createElement('div');btns.style.cssText='display:flex;gap:8px;';['True','False'].forEach((lab,bi)=>{const b=document.createElement('button');b.className='opt';b.style.cssText='flex:1;justify-content:center;padding:9px;';b.textContent=lab;b.onclick=()=>{if(answered)return;work.tf[i]=(bi===0);[...btns.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');renderTfActions(step);};btns.appendChild(b);});row.appendChild(btns);wrap.appendChild(row);});stage.appendChild(wrap);work._tfwrap=wrap;renderTfActions(step);}
function renderTfActions(step){const all=Object.keys(work.tf).length===step.statements.length;setActions('');actions.appendChild(primary('Check',()=>checkTf(step),!all));}
function checkTf(step){answered=true;let allCorrect=true;const wrap=work._tfwrap;step.statements.forEach((s,i)=>{const row=wrap.children[i],btns=row.children[1];const correct=work.tf[i]===s.answer;if(!correct)allCorrect=false;btns.children[work.tf[i]?0:1].classList.add(correct?'correct':'wrong');if(!correct)btns.children[s.answer?0:1].classList.add('correct');const w=document.createElement('div');w.style.cssText='font-size:13px;color:var(--muted);margin-top:9px;';w.textContent=s.why;row.appendChild(w);});if(allCorrect){award(15);lmsProgress();feedback(true,'<b>All correct — myths busted.</b>');}else{markWrong();feedback(false,'A couple were off — answers shown below each.');nudge(step,true);}setActions('');actions.appendChild(primary('Continue',nextStep));}
function rTrace(step){head(step);work.turn=0;const goal=document.createElement('div');goal.style.cssText='background:var(--lav-bg);border:1px solid var(--lav-bd);border-radius:12px;padding:11px 14px;margin:0 0 14px;color:var(--lav-deep);font-size:14.5px;';goal.innerHTML='🎯 <b style="font-weight:500;">Goal:</b> '+step.goal;stage.appendChild(goal);const log=document.createElement('div');log.id='tracelog';log.style.cssText='display:flex;flex-direction:column;gap:6px;margin:0 0 14px;';stage.appendChild(log);const box=document.createElement('div');box.id='turnbox';stage.appendChild(box);renderTurn(step);}
function renderTurn(step){const t=step.turns[work.turn],box=$('#turnbox');box.innerHTML='';const sit=document.createElement('p');sit.className='sub';sit.style.margin='0 0 12px';sit.textContent='Turn '+(work.turn+1)+'/'+step.turns.length+' — '+t.situation;box.appendChild(sit);const q=document.createElement('p');q.className='prompt';q.style.fontSize='17px';q.textContent=t.q;box.appendChild(q);const opts=document.createElement('div');opts.className='opts';t.options.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="tick"></span><span>'+o+'</span>';b.onclick=()=>pickTurn(step,i,b,opts);opts.appendChild(b);});box.appendChild(opts);setActions('');}
function pickTurn(step,i,b,opts){const t=step.turns[work.turn];if(i===t.correct){[...opts.children].forEach(c=>c.classList.add('dim'));b.classList.remove('dim');b.classList.add('correct');const row=document.createElement('div');row.style.cssText='font-size:13.5px;color:var(--green-dk);background:#effaf1;border-radius:8px;padding:7px 11px;';row.textContent=t.log;$('#tracelog').appendChild(row);award(8);lmsProgress();work.turn++;if(work.turn>=step.turns.length){feedback(true,'<b>Clean run.</b>');setActions('');actions.appendChild(primary('Continue',nextStep));}else setTimeout(()=>renderTurn(step),380);}else{markWrong();b.classList.add('wrong');feedback(false,'Not the right move — think about what the agent needs next.');nudge(step,true);}}
function rDone(){progress();stage.innerHTML=`<div class="done-wrap"><div class="done-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="prompt">You can design and build real tools.</p><p class="sub">Name → description (for the model) → parameters (typed + described) → clean return value. That's the formula for every tool you'll ever build.</p><div class="summary"><div class="crow met"><span class="ic">✓</span>Schema: name + description + parameters</div><div class="crow met"><span class="ic">✓</span>Description drives the model's decision to call it</div><div class="crow met"><span class="ic">✓</span>Return clean, normalised data — not raw API blobs</div><div class="crow met"><span class="ic">✓</span>Errors are return values too — never let them crash the loop</div></div><p class="sub" style="margin-top:22px;">Earned <b>${gems} gems</b> · Bring your first real tool wired up to Friday.</p></div>`;setActions('');actions.appendChild(startOver(()=>{gems=0;perfect=true;go(0);}));const a=document.createElement('a');a.href=(window.LMS?'/dashboard':'#');a.className='pill';a.textContent='Back to my journey →';actions.appendChild(a);lmsComplete().then(d=>{if(window.celebrate)celebrate('lesson',{text:(d&&d.fresh===false)?'Nice — replayed!':'Lesson complete! 🎉'});});}

/* TUTOR */
const tutor=$('#tutor'),msgs=$('#msgs'),quick=$('#quick');let convo=[];
$('#kojiLaunch').onclick=()=>openTutor();$('#tclose').onclick=()=>tutor.classList.remove('open');
function openTutor(){tutor.classList.add('open');if(!msgs.children.length){const g="Hi — ask me anything about tool design or integrations.";bot(g);convo.push({role:'assistant',content:g});}renderQuick();$('#tin').focus();}
function bot(t){const m=document.createElement('div');m.className='msg bot';m.textContent=t;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;}
function me(t){const m=document.createElement('div');m.className='msg me';m.textContent=t;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;}
function botTyping(){const m=document.createElement('div');m.className='msg bot';m.textContent='…';m.style.opacity='.6';msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m;}
function problemContext(){const s=STEPS[idx];if(!s)return '';let p=`Step: ${s.type}. Prompt: "${s.prompt}".`;if(s.type==='mcq')p+='\nOptions:\n'+s.options.map((o,i)=>`  [${i}] ${o.t}${i===s.correct?'  <-- CORRECT':''}`).join('\n');return p;}
function fallbackHint(text){const h=(STEPS[idx]&&STEPS[idx].hints)||[];if(/wrong/i.test(text))return h[0]||"What made you pick that?";if(/stuck/i.test(text))return h[h.length-1]||"Name what's confusing and we'll zoom in.";return h[0]||"Which part is unclear?";}
async function askGuide(text,opts){opts=opts||{}; lmsIntervention(opts.auto?'hint':'tutor');if(!opts.auto)me(text);convo.push({role:'user',content:text});const typing=botTyping();let reply=null;try{if(window.LMS){const res=await fetch('/api/tutor/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:convo,problem:problemContext()})});const d=await res.json();reply=d.reply;}}catch(e){}typing.remove();const out=reply||fallbackHint(text);bot(out);convo.push({role:'assistant',content:out});}
function nudge(step,auto){if(auto)tutor.classList.add('open');renderQuick();askGuide("I just answered this wrong. Give me a Socratic hint — don't tell me the answer.",{auto:true});}
function renderQuick(){quick.innerHTML='';['Why was my answer wrong?','Give me a hint','Explain it in my world','I\'m stuck'].forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>askGuide(q==='I\'m stuck'?"I'm totally stuck — smallest next step?":q);quick.appendChild(b);});}
$('#tsend').onclick=sendTin;$('#tin').addEventListener('keydown',e=>{if(e.key==='Enter')sendTin();});
function sendTin(){const v=$('#tin').value.trim();if(!v)return;$('#tin').value='';askGuide(v);}
buildDots();render();
</script>
