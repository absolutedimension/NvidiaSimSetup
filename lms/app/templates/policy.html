<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title|safe }} · TrigunAI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png" />
<link rel="stylesheet" href="/static/app.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--gold:#C2591F;--gold2:#A8481A;--ink:#2A2018;--muted:#7A6A57;--faint:#A08A72;--line:rgba(168,72,26,.16)}
  body{background:linear-gradient(180deg,#FDF6EC 0%,#FBEAD6 55%,#F7E0C8 100%);background-attachment:fixed;
       color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 22px 80px;}
  .card{background:rgba(255,255,255,.62);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
        border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:30px 30px 26px;
        box-shadow:0 24px 55px -24px rgba(120,60,20,.28),inset 0 1px 0 rgba(255,255,255,.7)}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .top img{height:28px;}
  .top a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;}
  .top a:hover{color:var(--gold);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;letter-spacing:-.01em;margin:0 0 16px;color:var(--gold2);}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;margin:26px 0 8px;color:var(--gold2);}
  p,li{font-size:15px;line-height:1.75;color:var(--ink);}
  b{font-weight:700}
  ul{padding-left:20px;}
  a{color:var(--gold2);text-decoration:none;font-weight:600;}
  a:hover{text-decoration:underline;}
  .upd{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:13px;}
  .legalnav{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .legalnav a{color:var(--gold2);margin-right:16px;}
  .legalnav a:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <img src="/static/brand/trigunai-mark.png" onerror="this.src='/static/brand/mark.png'" alt="TrigunAI" />
      <a href="/">← Back to Acharya</a>
    </div>
    <h1>{{ page.title|safe }}</h1>
    {{ page.html|safe }}
    <div class="legalnav">
      <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refund &amp; Cancellation</a><a href="/disclaimer">Disclaimer</a><a href="/contact">Contact</a>
    </div>
  </div>
</div>
</body>
</html>
