<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title|safe }} · TrigunAI</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png" />
<link rel="stylesheet" href="/static/app.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body{background:#0E0E14;color:#EDE7D6;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:36px 22px 80px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .top img{height:30px;}
  .top a{margin-left:auto;color:#9b8f72;text-decoration:none;font-size:14px;}
  .top a:hover{color:#E8C66B;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;letter-spacing:-.02em;margin:0 0 18px;color:#E8C66B;}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;margin:26px 0 8px;color:#E8C66B;}
  p,li{font-size:15px;line-height:1.75;color:#EDE7D6;}
  ul{padding-left:20px;}
  a{color:#E8C66B;text-decoration:none;}
  a:hover{text-decoration:underline;}
  table,blockquote{background:#15151f;border:1px solid rgba(212,162,58,.16);}
  blockquote{padding:14px 18px;border-radius:6px;color:#EDE7D6;}
  th,td{border:1px solid rgba(212,162,58,.16);color:#EDE7D6;}
  .upd{margin-top:30px;padding-top:16px;border-top:1px solid rgba(212,162,58,.16);color:#7e745c;font-size:13px;}
  .legalnav{margin-top:34px;font-size:13px;color:#9b8f72;}
  .legalnav a{color:#b9a878;margin-right:14px;}
  .legalnav a:hover{color:#E8C66B;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="/static/brand/lockup_horizontal.png" onerror="this.src='/static/brand/mark.png'" alt="TrigunAI" />
    <a href="/pricing">← Back</a>
  </div>
  <h1>{{ page.title|safe }}</h1>
  {{ page.html|safe }}
  <div class="legalnav">
    <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refund &amp; Cancellation</a><a href="/contact">Contact</a>
  </div>
</div>
</body>
</html>
