<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>{{ title }} — chat</title>
<link rel="icon" href="/static/brand/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
<style>
 :root{--bg:#FDF6EC;--ink:#2A2018;--gold:#C2591F;--gold2:#A8481A;--muted:#7A6A57;--faint:#A08A72;--line:#EFE0CE;--card:#fff;--green:#2FA968;--cream:#FAF5EC;
   --serif:"Bricolage Grotesque",Georgia,serif;--sans:"Figtree",-apple-system,"Segoe UI",sans-serif}
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 body{background:linear-gradient(180deg,#FDF6EC,#FBEAD6 70%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
 .wrap{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column}
 header{display:flex;align-items:center;gap:11px;padding:11px 15px;background:linear-gradient(120deg,#E8934A,#C2591F);color:#fff;flex:0 0 auto}
 header .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:19px}
 header .tt{flex:1;min-width:0}
 header .t{font-family:var(--serif);font-weight:800;font-size:16px}
 header .s{font-size:11.5px;color:rgba(255,255,255,.9)}
 header a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(0,0,0,.14);padding:6px 11px;border-radius:9px}
 .feed{flex:1;overflow-y:auto;padding:18px 15px 8px;display:flex;flex-direction:column;gap:11px}
 .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
 .row.me{flex-direction:row-reverse}
 .av2{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;background:#FFF3E6;border:1px solid var(--line)}
 .bub{max-width:80%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
 .bot .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(120,60,20,.05)}
 .me .bub{background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;border-bottom-right-radius:5px}
 .bub b{font-weight:800}
 .chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 2px 37px}
 .chip{border:1.5px solid var(--gold);background:#fff;color:var(--gold2);border-radius:99px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
 .chip:hover{background:#FFF3E6}
 .chip:active{transform:scale(.96)}
 .acts{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 2px 37px}
 .act{border:none;border-radius:12px;padding:12px 17px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;font-family:inherit}
 .act.primary{background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;box-shadow:0 8px 20px rgba(168,72,26,.24)}
 .act.ghost{background:#fff;border:1.5px solid var(--gold);color:var(--gold2)}
 .act.wa{background:#25D366;color:#fff}
 /* thinking bubble */
 .think .bub{display:flex;align-items:center;gap:9px}
 .dots{display:inline-flex;gap:4px}
 .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:bnc 1.2s infinite}
 .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
 @keyframes bnc{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
 .think .lbl{font-size:13.5px;color:var(--muted)}
 .composer{flex:0 0 auto;display:flex;gap:9px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line)}
 .composer input{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:12px 16px;font-size:15px;font-family:var(--sans);color:var(--ink)}
 .composer input:focus{outline:none;border-color:var(--gold2)}
 .composer button{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;font-size:19px;cursor:pointer}
 .composer button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="av">अ</div>
    <div class="tt"><div class="t">{{ title }}</div><div class="s">{{ sub }}</div></div>
    <a href="{{ home }}">✕</a>
  </header>
  <div class="feed" id="feed"></div>
  <form class="composer" id="composer" autocomplete="off">
    <input id="inp" placeholder="Type what you need…" />
    <button type="submit" id="send">➤</button>
  </form>
</div>

<script>
var ROLE = {{ role|tojson }};
var STATE = {node:"intro"};
var busy = false;
var feed = document.getElementById('feed');

function scroll(){ feed.scrollTop = feed.scrollHeight; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function addBubble(who, html){
  var row=document.createElement('div'); row.className='row '+(who==='me'?'me':'bot');
  row.innerHTML = '<div class="av2">'+(who==='me'?'🧑':'अ')+'</div><div class="bub">'+html+'</div>';
  feed.appendChild(row); scroll(); return row;
}
function addChips(chips){
  if(!chips||!chips.length) return;
  var w=document.createElement('div'); w.className='chips';
  chips.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c.label;
    b.onclick=function(){ clearInteractive(); addBubble('me', esc(c.label)); send(c.value); };
    w.appendChild(b);
  });
  feed.appendChild(w); scroll();
}
function addActions(acts){
  if(!acts||!acts.length) return;
  var w=document.createElement('div'); w.className='acts';
  acts.forEach(function(a){
    var el=document.createElement('a'); el.className='act '+(a.kind||'primary'); el.textContent=a.label;
    el.href=a.href; if(a.blank) el.target='_blank';
    w.appendChild(el);
  });
  feed.appendChild(w); scroll();
}
// remove the last set of chips once one is tapped (keep the conversation clean)
function clearInteractive(){ feed.querySelectorAll('.chips').forEach(function(n){n.remove();}); }

var thinkNode=null, thinkTimer=null;
var THINK=["Picking the best questions…","Writing fresh questions…","Checking each answer…","Almost ready…"];
function showThinking(){
  var row=document.createElement('div'); row.className='row bot think';
  row.innerHTML='<div class="av2">अ</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span class="lbl">Thinking…</span></div>';
  feed.appendChild(row); scroll(); thinkNode=row;
  var i=0; thinkTimer=setInterval(function(){ i=(i+1)%THINK.length; var l=row.querySelector('.lbl'); if(l) l.textContent=THINK[i]; },2600);
}
function hideThinking(){ if(thinkTimer)clearInterval(thinkTimer); if(thinkNode)thinkNode.remove(); thinkNode=null; }

function render(r){
  if(r.reply) addBubble('bot', r.reply);
  if(r.state) STATE = r.state;
  if(r.nav){ setTimeout(function(){ location.href=r.nav; }, 900); return; }
  if(r.job){ pollJob(r.job); return; }
  addChips(r.chips);
  if(r.actions) addActions(r.actions);
  document.getElementById('inp').focus();
}

function send(input){
  if(busy) return; busy=true; document.getElementById('send').disabled=true;
  fetch('/api/chat/'+ROLE,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
    body:JSON.stringify({state:STATE, input:input})})
    .then(function(r){return r.json();})
    .then(function(r){ busy=false; document.getElementById('send').disabled=false;
      if(!r||!r.ok){ addBubble('bot','Sorry — something went wrong. Try again.'); return; } render(r); })
    .catch(function(){ busy=false; document.getElementById('send').disabled=false; addBubble('bot','Network error — try again.'); });
}

function pollJob(token){
  showThinking();
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    fetch('/api/chat/job/'+token,{credentials:'same-origin'})
     .then(function(r){return r.json();})
     .then(function(j){
        if(!j||!j.ok){ return; }
        if(j.status==='done'){
          clearInterval(iv); hideThinking(); busy=false;
          var res=j.result||{};
          addBubble('bot','✅ Done! <b>'+esc(res.title||'Your test')+'</b> — '+(res.n||'')+' questions, ready to share.');
          addActions([
            {label:'📲 Open & share', href:res.redirect, kind:'primary'},
            {label:'🖨️ Print paper', href:res.redirect+'/print', kind:'ghost', blank:true},
            {label:'✍️ Make another', href:'#', kind:'ghost'}
          ]);
          // "Make another" restarts the chat
          var last=feed.querySelector('.acts:last-child');
          if(last){ var mk=last.querySelectorAll('a')[2]; if(mk) mk.onclick=function(e){e.preventDefault();addBubble('me','Make another');send('intent:make_test');}; }
        } else if(j.status==='error'){
          clearInterval(iv); hideThinking(); busy=false;
          addBubble('bot','😕 '+esc((j.result&&j.result.error)||'Could not make that test.')+' Want to try again?');
          addChips([{label:'✍️ Try again',value:'intent:make_test'}]);
        } else if(tries>90){ clearInterval(iv); hideThinking(); busy=false; addBubble('bot','This is taking longer than usual — check "My tests" in a moment.'); }
     }).catch(function(){});
  }, 2000);
}

document.getElementById('composer').addEventListener('submit', function(e){
  e.preventDefault();
  var v=document.getElementById('inp').value.trim(); if(!v||busy) return;
  document.getElementById('inp').value='';
  clearInteractive(); addBubble('me', esc(v)); send(v);
});

// kick off
send('');
</script>
</body>
</html>
