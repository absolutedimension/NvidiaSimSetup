<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design your course — Acharya University</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C2591F; --gold2:#A8481A; --ink:#2A2018; --muted:#7A6A57; --line:#EFE0CE; --cream:#FAF5EC; --card:#fff; }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Figtree,system-ui,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, #FBEFE0, transparent), var(--cream);color:var(--ink);min-height:100vh}
  a{color:inherit;text-decoration:none}
  .top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line)}
  .top .logo{font-family:Bricolage Grotesque,serif;font-weight:800;font-size:19px;color:var(--gold2)}
  .wrap{max-width:640px;margin:0 auto;padding:26px 20px 60px}
  h1{font-family:Bricolage Grotesque,serif;font-weight:800;font-size:28px;margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 26px rgba(120,70,20,.06)}
  input{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:14px 16px;font-size:16px;font-family:inherit}
  .btn{background:linear-gradient(180deg,#D9682B,var(--gold));color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
  .row{display:flex;gap:10px;align-items:center}
  .dim{color:var(--muted);font-size:14px}
  .msg{padding:12px 15px;border-radius:14px;margin:8px 0;max-width:90%;line-height:1.5;font-size:15px}
  .msg.a{background:#FBF1E4;border:1px solid var(--line)} .msg.u{background:#EAF6EF;border:1px solid #CDE9D9;margin-left:auto}
  .back{color:var(--muted);font-size:14px;display:inline-block;margin-bottom:14px}
  .spin{color:var(--gold2)}
  .pill{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:5px 6px 0 0;cursor:pointer;background:#fff}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/university">आ Acharya University</a></div>
<div class="wrap">
  <a class="back" href="/university">← my courses</a>
  <h1>What do you want to learn?</h1>
  <p class="dim">Name any subject or goal. The Advisor will ask a few quick questions, then design your personal course.</p>

  <div class="card" id="goalCard" style="margin-top:16px">
    <div class="row"><input id="goal" placeholder="e.g. business finance · design theory · Spanish · options trading" autofocus>
      <button class="btn" onclick="startGoal()">Start</button></div>
    <div style="margin-top:10px">
      {% for g in ['Business finance','Design theory','How LLMs work','Negotiation','Personal finance'] %}<span class="pill" onclick="pick('{{ g }}')">{{ g }}</span>{% endfor %}
    </div>
  </div>

  <div class="card" id="chatCard" style="margin-top:16px;display:none">
    <div class="dim">Goal: <b id="goalLabel" style="color:var(--ink)"></b></div>
    <div id="chat" style="margin-top:8px"></div>
    <div id="ansRow" class="row" style="margin-top:12px;display:none">
      <input id="ans" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')sendAns()">
      <button class="btn" onclick="sendAns()">Send</button>
    </div>
    <div id="buildRow" style="margin-top:14px;display:none">
      <button class="btn" onclick="build()" style="width:100%">✦ Build my course</button>
    </div>
  </div>
</div>
<script>
let goal='', history=[];
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json();}
function pick(g){document.getElementById('goal').value=g;startGoal();}
const pre=new URLSearchParams(location.search).get('goal'); if(pre){window.addEventListener('DOMContentLoaded',()=>{document.getElementById('goal').value=pre;startGoal();});}
function startGoal(){
  goal=document.getElementById('goal').value.trim(); if(!goal) return;
  document.getElementById('goalCard').style.display='none';
  document.getElementById('chatCard').style.display='block';
  document.getElementById('goalLabel').textContent=goal;
  history=[]; drawChat(); nextQ();
}
function drawChat(){const c=document.getElementById('chat');c.innerHTML=history.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');}
async function nextQ(){
  const c=document.getElementById('chat'); c.innerHTML+=`<div class="msg a spin">…</div>`;
  const r=await api('/api/university/interview',{goal,history});
  history.push({role:'assistant',content:r.question}); drawChat();
  if(r.done){document.getElementById('buildRow').style.display='block';document.getElementById('ansRow').style.display='none';}
  else{document.getElementById('ansRow').style.display='flex';document.getElementById('ans').focus();}
}
function sendAns(){const el=document.getElementById('ans');const v=el.value.trim();if(!v)return;history.push({role:'user',content:v});el.value='';document.getElementById('ansRow').style.display='none';drawChat();nextQ();}
async function build(){
  document.getElementById('buildRow').innerHTML='<span class="spin">Designing your outline… you\'ll see units appear as they\'re written.</span>';
  const r=await api('/api/university/create',{goal,history});
  if(r.course_id) location.href='/university/course/'+r.course_id;
  else document.getElementById('buildRow').innerHTML='<span class="spin" style="color:#C23B22">Could not start — check the server LLM keys.</span>';
}
</script>
</body>
</html>
