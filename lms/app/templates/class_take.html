<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>{{ ct.title }} — take the test</title>
<link rel="icon" href="/static/brand/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
<style>
 :root{--bg:#FDF6EC;--ink:#2A2018;--gold:#C2591F;--gold2:#A8481A;--muted:#7A6A57;--faint:#A08A72;--line:#EFE0CE;--card:#fff;
   --serif:"Bricolage Grotesque",Georgia,serif;--sans:"Figtree",-apple-system,"Segoe UI",sans-serif}
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(180deg,#FDF6EC,#FBEAD6 60%,#F7E0C8);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
 .card{width:100%;max-width:440px;background:var(--card);border:1.5px solid var(--gold2);border-radius:22px;padding:28px 24px;box-shadow:0 24px 60px rgba(120,60,20,.15);text-align:center}
 .em{font-size:40px;margin-bottom:8px}
 h1{font-family:var(--serif);font-weight:800;font-size:23px;line-height:1.2;margin-bottom:6px}
 .meta{color:var(--muted);font-size:13.5px;margin-bottom:22px}
 .meta b{color:var(--ink)}
 label{display:block;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 6px}
 input{width:100%;background:#FBF3EA;border:1.5px solid var(--line);border-radius:13px;font-family:var(--sans);font-size:17px;padding:14px 16px;color:var(--ink);margin-bottom:16px;text-align:center}
 input:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(194,89,31,.13)}
 .go{width:100%;background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 26px rgba(168,72,26,.28)}
 .fine{font-size:11.5px;color:var(--faint);margin-top:12px}
</style>
</head>
<body>
<form class="card" method="post" action="/t/{{ ct.code }}">
  <div class="em">📝</div>
  <h1>{{ ct.title }}</h1>
  <div class="meta"><b>{{ ct.subject_label }}</b> · {{ ct.n }} questions · adaptive test</div>
  <label>Your name</label>
  <input type="text" name="name" placeholder="Type your full name" autocomplete="name" required autofocus maxlength="80" />
  <button class="go" type="submit">Start the test →</button>
  <div class="fine">English & हिन्दी · your teacher will see your result</div>
</form>
</body>
</html>
