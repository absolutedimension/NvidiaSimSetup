<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Build a mock paper — Acharya for Teachers</title>
<link rel="icon" href="/static/brand/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
 :root{--bg:#FDF6EC;--ink:#2A2018;--gold:#C2591F;--gold2:#A8481A;--muted:#7A6A57;--faint:#A08A72;--line:#EFE0CE;--card:#fff;--green:#2FA968;--cream:#FAF5EC;
   --serif:"Bricolage Grotesque",Georgia,serif;--sans:"Figtree",-apple-system,"Segoe UI",sans-serif}
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(180deg,#FDF6EC,#FBEAD6 70%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
 .wrap{max-width:620px;margin:0 auto;padding:16px 16px 130px}
 header{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
 header a.back{color:var(--gold2);font-weight:700;text-decoration:none;font-size:14px}
 header .t{flex:1;font-family:var(--serif);font-weight:800;font-size:18px;text-align:center;margin-right:40px}
 .sec{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:800;margin:20px 2px 10px}
 .sec:first-of-type{margin-top:4px}
 .subs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
 .sub{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:13px 14px;cursor:pointer;font-weight:700;font-size:14.5px;transition:.12s}
 .sub:hover{border-color:var(--gold)}
 .sub.on{border-color:var(--gold2);background:#FFF3E6;color:var(--gold2)}
 .sub .e{font-size:19px}
 .subgroup{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--gold2);margin:6px 2px 0}
 .subgroup:first-child{margin-top:0}
 .chwrap{margin-top:4px}
 .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:13.5px;cursor:pointer;user-select:none;margin:0 7px 8px 0}
 .chip.on{border-color:var(--gold2);background:#FFF3E6;color:var(--gold2);font-weight:700}
 .chip .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
 .chip.on .bx{background:var(--gold2);border-color:var(--gold2)}
 .full{border-style:dashed;font-weight:800}
 .muted{color:var(--muted);font-size:13px}
 .pills{display:flex;flex-wrap:wrap;gap:8px}
 .pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
 .pill.on{border-color:var(--gold2);background:#FFF3E6;color:var(--gold2)}
 input.title{width:100%;background:#FBF3EA;border:1.5px solid var(--line);border-radius:12px;font-family:var(--sans);font-size:15px;padding:12px 14px;color:var(--ink)}
 input.title:focus{outline:none;border-color:var(--gold2)}
 .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(251,234,214,0),#FBEAD6 45%)}
 .bar .in{width:100%;max-width:620px}
 .go{width:100%;background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 26px rgba(168,72,26,.28)}
 .go:disabled{opacity:.5;box-shadow:none;cursor:default}
 .note{text-align:center;font-size:11.5px;color:var(--faint);margin-top:7px}
 /* generating overlay */
 .ov{position:fixed;inset:0;background:rgba(253,246,236,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:9}
 .ov.on{display:flex}
 .spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold2);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:18px}
 @keyframes sp{to{transform:rotate(360deg)}}
 .ov h2{font-family:var(--serif);font-weight:800;font-size:21px;margin-bottom:8px}
 .ov p{color:var(--muted);font-size:14.5px;max-width:340px;line-height:1.5}
 .ov .err{color:#c23b22;font-weight:700}
</style>
<style>
 .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
 .secrow{display:flex;gap:8px;align-items:center}
 .secrow select{flex:1;min-width:0}
 .secrow input[type=number]{width:78px}
 select,input,button{font-family:var(--sans);font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
 .rm{background:none;border:none;color:var(--gold2);font-weight:800;font-size:20px;cursor:pointer;padding:0 4px}
 .add{width:100%;border:1px dashed var(--gold);color:var(--gold2);background:#fff;font-weight:700;cursor:pointer;padding:11px}
 .tot{display:flex;justify-content:space-between;font-weight:800;margin:14px 2px 8px}
 .go{width:100%;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#fff;border:none;font-weight:800;font-size:16px;padding:15px;cursor:pointer}
 .go[disabled]{opacity:.55;cursor:default}
 .note{font-size:12.5px;color:var(--muted);margin:8px 2px}
 .preset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .preset button{font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--gold2);cursor:pointer;padding:8px 11px}
 #msg{margin-top:12px;font-weight:700}
</style></head><body>
<div class="wrap">
<header><a class="back" href="/teacher">&larr; Back</a></header>
<h1 style="font-family:var(--serif);font-size:26px;margin:0 0 4px">Build a mock paper</h1>
<p class="note">Mix several subjects into one paper &mdash; set how many questions from each.
Students take it online from one link, or you print it.</p>

<div class="preset">
  <button type="button" onclick="preset('bssc')">BSSC Inter (150)</button>
  <button type="button" onclick="preset('ssc')">SSC CGL (100)</button>
  <button type="button" onclick="preset('clear')">Clear</button>
</div>

<input id="title" placeholder="Paper title (e.g. BSSC Inter Level — Practice Set 1)" style="width:100%;margin-bottom:12px">
<div id="secs"></div>
<button class="add" type="button" onclick="addSec()">+ Add a section</button>
<div class="tot"><span>Total questions</span><span id="tot">0</span></div>
<button class="go" id="go" onclick="build()">Build the paper</button>
<div id="msg"></div>
</div>
<script>
const SUBS = {{ subjects|tojson }};
const PRESETS = {
  bssc: [["ssc-reasoning",50],["cbse10-science",25],["ssc-quant",25],["ssc-gk",25],["bpsc-gs",25]],
  ssc:  [["ssc-reasoning",25],["ssc-quant",25],["ssc-english",25],["ssc-gk",25]],
};
function opts(sel){ return SUBS.map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${s.label}</option>`).join(""); }
function addSec(sub, n){
  const d=document.createElement("div"); d.className="sec";
  d.innerHTML=`<div class="secrow"><select>${opts(sub)}</select>
    <input type="number" min="1" max="100" value="${n||10}" oninput="tot()">
    <button class="rm" onclick="this.closest('.sec').remove();tot()">&times;</button></div>`;
  document.getElementById("secs").appendChild(d); tot();
}
function preset(k){
  document.getElementById("secs").innerHTML="";
  if(k!=="clear") PRESETS[k].forEach(([s,n])=>addSec(s,n));
  if(k==="bssc") document.getElementById("title").value="BSSC Inter Level — Practice Set";
  if(k==="ssc")  document.getElementById("title").value="SSC CGL — Practice Set";
  tot();
}
function rows(){ return [...document.querySelectorAll("#secs .sec")].map(d=>({
  subject:d.querySelector("select").value, n:parseInt(d.querySelector("input").value||"0",10)})); }
function tot(){ const t=rows().reduce((a,r)=>a+(r.n||0),0); document.getElementById("tot").textContent=t;
  document.getElementById("go").disabled = t<1 || t>200; }
async function build(){
  const go=document.getElementById("go"), msg=document.getElementById("msg");
  go.disabled=true; go.textContent="Building the paper…"; msg.textContent="";
  try{
    const r=await fetch("/api/teacher/mock",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title:document.getElementById("title").value, sections:rows()})});
    const j=await r.json();
    if(!j.ok){ msg.style.color="#C23B22"; msg.textContent=j.error||"Something went wrong."; go.disabled=false; go.textContent="Build the paper"; return; }
    if(j.short>0){ msg.style.color="#E0972F"; msg.textContent=`Built ${j.got} of ${j.asked} — opening…`; }
    location.href=j.redirect;
  }catch(e){ msg.style.color="#C23B22"; msg.textContent="Network error."; go.disabled=false; go.textContent="Build the paper"; }
}
preset("bssc");
</script></body></html>
