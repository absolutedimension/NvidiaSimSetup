<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Acharya Kids — Voice Quiz</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif}
html,body{height:100%}
.stage{position:relative;min-height:100dvh;background:linear-gradient(#7ec8ff,#bfe6ff 60%,#8ed46e 60%,#7cc95e);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:14px}
.topbar{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between}
.title{color:#fff;font-weight:800;font-size:19px;text-shadow:0 3px 0 #ff9e2e}
.vtog{display:flex;align-items:center;gap:8px;background:#fff;border:none;border-radius:30px;padding:8px 14px;font-weight:800;font-size:15px;color:#26406b;box-shadow:0 5px 0 #0001;cursor:pointer}
.vtog .sw{width:44px;height:26px;border-radius:20px;background:#4ac87a;position:relative;transition:.2s}
.vtog .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.vtog.off .sw{background:#c9d2dd}.vtog.off .sw:after{left:21px}
.gems{display:flex;gap:8px;margin-top:10px}
.gem{width:30px;height:30px;border-radius:50%;border:3px solid #ffffff88;transition:transform .3s}
.gem.on{background:radial-gradient(circle at 40% 35%,#d6f4ff,#49b6ff);border-color:#fff;transform:scale(1.25)}
.hero{margin-top:8px;display:flex;flex-direction:column;align-items:center}
.bubble{background:#fff;border-radius:26px;padding:16px 22px;max-width:340px;text-align:center;font-size:25px;font-weight:800;color:#26406b;box-shadow:0 8px 0 #0001;position:relative;min-height:76px;display:flex;align-items:center;justify-content:center}
.bubble:after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.jj{height:180px;margin-top:6px;filter:drop-shadow(0 14px 12px #0003);animation:bob 1.8s ease-in-out infinite}
.jj.cheer{animation:cheer .5s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.12)}}
.state{margin-top:4px;height:38px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;text-shadow:0 2px 3px #0002}
.dot{width:15px;height:15px;border-radius:50%;background:#ff5a52}
.dot.listen{background:#4ac87a;animation:ring 1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #4ac87a88}70%{box-shadow:0 0 0 15px #4ac87a00}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px;margin-top:10px}
.opt{background:#fff;border:none;border-radius:20px;padding:20px 8px;font-size:30px;font-weight:800;color:#26406b;box-shadow:0 6px 0 #0002;cursor:pointer;transition:.15s}
.opt:active{transform:translateY(4px)}
.opt.right{background:#e4f7ea;box-shadow:0 6px 0 #2fa96866;color:#2c9a5f;outline:4px solid #4ac87a;transform:scale(1.05)}
.opt.wrong{opacity:.45}
.gate{position:absolute;inset:0;background:linear-gradient(#7ec8ff,#8ed46e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:16px;padding:20px}
.gate img{height:210px;filter:drop-shadow(0 16px 12px #0003);animation:bob 1.8s ease-in-out infinite}
.gbtn{background:linear-gradient(#ffd24a,#ffb028);color:#7a3d00;font-size:28px;font-weight:800;border:none;border-radius:40px;padding:18px 46px;box-shadow:0 8px 0 #d98a12,0 14px 24px #0003;cursor:pointer;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.ghint{color:#fff;font-weight:800;font-size:19px;text-shadow:0 2px 3px #0002;text-align:center}
</style></head><body><div class="stage">

function parseNum(s){s=s.toLowerCase().replace(/-/g,' ');const d=s.match(/\d+/);if(d)return parseInt(d[0]);let t=0,f=false;for(const[w,n]of Object.entries(TENS))if(s.includes(w)){t+=n;f=true;s=s.replace(w,' ');}for(const[w,n]of Object.entries(ONES))if(new RegExp('\\b'+w+'\\b').test(s)){t+=n;f=true;break;}return f?t:null;}
