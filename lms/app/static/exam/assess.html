<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Acharya — Assessment</title>
<style>
 :root{--canvas:#FFFDF9;--panel:#fff;--ink:#2A2018;--muted:#8A7A66;--line:#EFE0CE;--gold:#C2591F;--gold2:#A8481A;
   --good:#1f8b52;--goodbg:#E9F6EE;--bad:#C23B22;--badbg:#FBEBE7;--cream:#FAF5EC}
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 body{background:var(--canvas);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
 .wrap{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;background:var(--canvas)}
 header{display:flex;align-items:center;gap:11px;padding:12px 16px;background:linear-gradient(120deg,#E8934A,#C2591F);color:#fff;position:sticky;top:0;z-index:2}
 header .ava{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
 header .tt{flex:1;min-width:0} header .t{font-weight:700;font-size:15px} header .s{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .langtog{display:flex;background:rgba(255,255,255,.15);border-radius:99px;padding:2px;flex:0 0 auto;border:1px solid rgba(255,255,255,.25)}
 .langtog button{border:none;background:transparent;color:rgba(255,255,255,.8);font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:99px;cursor:pointer;font-family:inherit}
 .langtog button.on{background:#fff;color:var(--gold2)}
 .prog{padding:10px 18px 4px}
 .prog .bar{height:7px;background:#EEE1CF;border-radius:99px;overflow:hidden}
 .prog .fill{height:100%;width:0;background:linear-gradient(90deg,#E8934A,#C2591F);border-radius:99px;transition:width .5s cubic-bezier(.4,1,.4,1)}
 .prog .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
 #log{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:13px}
 .row{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
 @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 .say{max-width:92%;font-size:14.5px;line-height:1.55}
 .say .who{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.03em;margin-bottom:3px}
 .qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 3px 12px rgba(120,60,20,.06)}
 .qtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold2);background:var(--cream);border-radius:6px;padding:3px 8px;margin-bottom:9px}
 .qtag.easy{color:#0d7a53;background:#E9F6EE}
 .qtext{font-size:15.5px;font-weight:600;line-height:1.5;margin-bottom:13px}
 .qfig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px;text-align:center;overflow-x:auto}
 .qfig svg{max-width:100%;height:auto;display:inline-block}
 .opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:9px;font-size:14.5px;cursor:pointer;transition:.13s;color:var(--ink)}
 .opt:hover{border-color:var(--gold);background:#FFFBF6} .opt:active{transform:scale(.985)}
 .opt .badge{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--cream);color:var(--gold2);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
 .opt.correct{border-color:var(--good);background:var(--goodbg)} .opt.correct .badge{background:var(--good);color:#fff}
 .opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .badge{background:var(--bad);color:#fff}
 .opt.dim{opacity:.5} .opt .mark{margin-left:auto;font-weight:800}
 .tf{display:flex;gap:11px;margin-top:6px}
 .tf button{flex:1;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.13s;color:var(--ink);font-family:inherit}
 .tf button:hover{border-color:var(--gold);background:#FFFBF6}
 .tf button.correct{border-color:var(--good);background:var(--goodbg);color:var(--good)}
 .tf button.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
 .match{display:flex;gap:12px;margin-top:6px}
 .match .col{flex:1;display:flex;flex-direction:column;gap:9px}
 .mitem{padding:11px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13px;cursor:pointer;transition:.13s;text-align:center;font-weight:600}
 .mitem:hover{border-color:var(--gold)} .mitem.sel{border-color:var(--gold);background:#FFF3E6}
 .mitem.ok{border-color:var(--good);background:var(--goodbg);color:#116b41;cursor:default}
 .mitem.no{border-color:var(--bad);background:var(--badbg);color:#9c3220;cursor:default}
 .inrow{display:flex;gap:9px;margin-top:6px}
 .inrow input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
 .inrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,89,31,.13)}
 textarea.long{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font-size:14.5px;outline:none;resize:vertical;font-family:inherit;margin-top:4px}
 textarea.long:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,89,31,.13)}
 .btn{background:linear-gradient(135deg,#C2591F,#A8481A);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.13s;flex:0 0 auto;font-family:inherit}
 .btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(168,72,26,.32)} .btn:active{transform:scale(.97)}
 .btn.full{width:100%;margin-top:11px} .btn.ghost{background:#fff;color:var(--gold2);border:1.5px solid var(--line)}
 .fb{margin-top:11px;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.5}
 .fb.ok{background:var(--goodbg);color:#116b41;border:1px solid #BFE6CF}
 .fb.no{background:var(--badbg);color:#9c3220;border:1px solid #F0C9BF}
 /* --- keep long answers / options / equations inside the card (no horizontal overflow) --- */
 .qcard,.qtext,.fb,.say{overflow-wrap:anywhere;word-break:break-word}
 .opt{align-items:flex-start}                        /* multi-line option text aligns with the badge */
 .opt>span:last-child{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
 .tf button{overflow-wrap:anywhere;word-break:break-word;min-width:0}
 .qcard mjx-container,.fb mjx-container{max-width:100%}
 .qcard mjx-container[display="true"],.fb mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden}
 .hint{margin-top:10px;padding:11px 13px;border-radius:12px;background:#FFF7E9;border:1px dashed #E7BE7C;font-size:13.5px;line-height:1.5}
 .hint b{color:var(--gold2)}
 .score{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-align:center;box-shadow:0 6px 20px rgba(120,60,20,.08)}
 .score .ring{width:104px;height:104px;margin:4px auto 10px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#EEE1CF 0);position:relative}
 .score .ring::before{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
 .score .ring b{position:relative;font-size:26px;color:var(--gold2)} .score .ring span{position:relative;font-size:11px;color:var(--muted)}
 .score h3{font-size:17px;margin-bottom:3px} .score .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
 .brk{text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:6px}
 .brk .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;background:var(--cream);border-radius:10px;padding:9px 12px}
 .chip{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;flex:0 0 auto}
 .chip.good{background:var(--goodbg);color:#116b41} .chip.weak{background:var(--badbg);color:#9c3220}
 .chip.shaky{background:#FFF3E0;color:#9a5a12}
 .footnote{text-align:center;font-size:11px;color:var(--muted);padding:8px 8px 2px} .footnote b{color:var(--gold2)}
 /* #4 confidence calibration */
 .conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
 .conf .cq{font-weight:700;font-size:13.5px;color:var(--muted);margin-right:2px}
 .cbtn{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--gold2);font-family:inherit;transition:.13s}
 .cbtn:hover{border-color:var(--gold);background:#FFFBF6} .cbtn.sel{border-color:var(--gold);background:#FFF3E6} .cbtn.dim{opacity:.4}
 /* #6 reviewable transcript */
 .review{margin-top:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .review summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:700;font-size:14px;color:var(--gold2)}
 .review summary::-webkit-details-marker{display:none}
 .review[open] summary{border-bottom:1px solid var(--line)}
 .rv-body{padding:4px 14px 10px}
 .rv-q{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--cream)}
 .rv-q:last-child{border-bottom:none}
 .rv-b{width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
 .rv-b.ok{background:var(--good)} .rv-b.no{background:var(--bad)} .rv-b.na{background:var(--gold)}
 .rv-c{flex:1;min-width:0} .rv-t{font-size:13.5px;font-weight:600;line-height:1.4}
 .rv-a{font-size:13px;color:#116b41;margin-top:3px} .rv-a b{color:var(--muted);font-weight:700}
 .rv-e{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
</style>

/* ============================ ENGINE ============================ */
const params=new URLSearchParams(location.search);
let LANG=params.get('lang')==='hi'?'hi':'en';
let S, TOTAL, GRADED, score=0;   // set by boot() once the pack (curated or generated) is ready
const log=document.getElementById('log'),fill=document.getElementById('fill'),plabel=document.getElementById('plabel'),pscore=document.getElementById('pscore');
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
// Render a question's SVG diagram (server-sanitized; strip event handlers + scripts as defense-in-depth).
function figHTML(q){ if(!q||!q.figure) return '';
  let svg=String(q.figure).replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'').replace(/javascript:/gi,'');
  return `<div class="qfig">${svg}</div>`; }
function fbAdd(card,html){ const n=el(html); card.appendChild(n); typeset(n); return n; }
// MathJax loads async — at first paint window.MathJax is only the CONFIG object (no typesetPromise
// yet), so poll until the library is really ready or the content stays as raw LaTeX forever.
function typeset(node){
  let tries = 0;
  const go = () => {
    if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([node]).catch(()=>{}); }
    else if (tries++ < 100) { setTimeout(go, 150); }
  };
  go();
}
const add=n=>{const r=document.createElement('div');r.className='row';r.appendChild(n);log.appendChild(r);log.scrollTop=log.scrollHeight;typeset(r);return r;};
const say=h=>{const d=document.createElement('div');d.className='say';d.innerHTML='<div class="who">ACHARYA</div>'+h;add(d);};
const clear=()=>{log.innerHTML='';};
const wait=m=>new Promise(r=>setTimeout(r,m));
function setHeader(i){fill.style.width=(i/TOTAL*100)+'%';plabel.textContent=T[LANG].qof(i+1);pscore.textContent=T[LANG].score+' '+score;}
function nextBtn(res,ok,label){const b=el(`<button class="btn full">${label||T[LANG].next}</button>`);b.onclick=()=>{b.disabled=true;res(ok);};add(b);log.scrollTop=log.scrollHeight;}
function advance(res,ok,label){
  if(!curGraded){nextBtn(res,ok,label);return;}   // long answers aren't graded → no calibration prompt
  // #4 ask calibration BEFORE moving on; "sure + wrong" = the confidently-wrong signal (the RED BOX).
  const box=el(`<div class="conf"><span class="cq">${T[LANG].sureQ}</span><button class="cbtn" data-s="sure">${T[LANG].cSure}</button><button class="cbtn" data-s="think">${T[LANG].cMid}</button><button class="cbtn" data-s="guess">${T[LANG].cGuess}</button></div>`);
  box.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{
    _conf=b.dataset.s; confLog.push({ok,sure:_conf==='sure'});
    box.querySelectorAll('.cbtn').forEach(x=>{x.onclick=null;if(x!==b)x.classList.add('dim');});b.classList.add('sel');
    nextBtn(res,ok,label);});
  add(box);log.scrollTop=log.scrollHeight;}
const L=q=>q[LANG];  // language view of a question

function mcq(q,last){return new Promise(res=>{const v=L(q);
  const card=el(`<div class="qcard"><span class="qtag ${q.easy?'easy':''}">${v.tag}</span>${figHTML(q)}<div class="qtext">${v.q}</div></div>`);
  const B=['A','B','C','D'];
  const order=shuffle(v.opts.map((o,i)=>i));   // #5 randomize display order; original index decides correctness
  order.forEach((origI,pos)=>{const o=v.opts[origI];const b=el(`<button class="opt"><span class="badge">${B[pos]}</span><span>${o}</span></button>`);
    b.dataset.c=(origI===q.correct)?'1':'';
    b.onclick=()=>{_pick=o;[...card.querySelectorAll('.opt')].forEach(x=>{x.onclick=null;x.classList.add('dim');});
      const c=card.querySelector('.opt[data-c="1"]');c.classList.remove('dim');c.classList.add('correct');
      const ok=origI===q.correct;
      if(!ok){b.classList.remove('dim');b.classList.add('wrong');b.appendChild(el('<span class="mark">✕</span>'));}
      else b.appendChild(el('<span class="mark" style="color:var(--good)">✓</span>'));
      fbAdd(card,(`<div class="fb ${ok?'ok':'no'}">${ok?T[LANG].corr:T[LANG].wrong}${v.explain}</div>`));advance(res,ok,last?T[LANG].results:null);};
    card.appendChild(b);});
  add(card);});}

function truefalse(q,last){return new Promise(res=>{const v=L(q);
  const card=el(`<div class="qcard"><span class="qtag">${v.tag}</span><div class="qtext">${v.q}</div><div class="tf"></div></div>`);
  const w=card.querySelector('.tf');
  [[T[LANG].tf[0],true],[T[LANG].tf[1],false]].forEach(([t,val])=>{const b=el(`<button>${t}</button>`);
    b.onclick=()=>{_pick=t;w.querySelectorAll('button').forEach(x=>x.onclick=null);const ok=val===q.answer;
      w.querySelectorAll('button')[q.answer?0:1].classList.add('correct');if(!ok)b.classList.add('wrong');
      fbAdd(card,(`<div class="fb ${ok?'ok':'no'}">${ok?T[LANG].corr:T[LANG].wrong}${v.explain}</div>`));advance(res,ok,last?T[LANG].results:null);};
    w.appendChild(b);});
  add(card);});}

function match(q,last){return new Promise(res=>{const v=L(q);
  const card=el(`<div class="qcard"><span class="qtag">${v.tag}</span><div class="qtext">${v.q}</div><div class="match"><div class="col" id="L"></div><div class="col" id="R"></div></div></div>`);
  const CL=card.querySelector('#L'),CR=card.querySelector('#R');
  v.left.forEach((t,i)=>CL.appendChild(el(`<div class="mitem" data-i="${i}">${t}</div>`)));
  // #5 shuffle right column (data-i stays the ORIGINAL index, so pair-checking is unchanged)
  shuffle(v.right.map((t,i)=>i)).forEach(i=>CR.appendChild(el(`<div class="mitem" data-i="${i}">${v.right[i]}</div>`)));
  let sel=null,made=0,wrong=0,n=v.left.length;
  CL.querySelectorAll('.mitem').forEach(m=>m.onclick=()=>{if(m.classList.contains('ok')||m.classList.contains('no'))return;
    CL.querySelectorAll('.mitem').forEach(x=>x.classList.remove('sel'));m.classList.add('sel');sel=+m.dataset.i;});
  CR.querySelectorAll('.mitem').forEach(m=>m.onclick=()=>{if(sel===null||m.classList.contains('ok')||m.classList.contains('no'))return;
    const ri=+m.dataset.i,lEl=CL.querySelector(`[data-i="${sel}"]`),good=q.pairs[sel]===ri;
    lEl.classList.remove('sel');[lEl,m].forEach(x=>x.classList.add(good?'ok':'no'));if(!good)wrong++;sel=null;made++;
    if(made===n){const ok=wrong===0;
      fbAdd(card,(`<div class="fb ${ok?'ok':'no'}">${ok?T[LANG].matchOk:T[LANG].matchNo}</div>`));advance(res,ok,last?T[LANG].results:null);}});
  add(card);});}

function numeric(q,last){return new Promise(res=>{const v=L(q);
  const card=el(`<div class="qcard"><span class="qtag">${v.tag}</span>${figHTML(q)}<div class="qtext">${v.q}</div><div class="inrow"><input type="number" inputmode="decimal" placeholder="${q.unit?q.unit:'?'}"/><button class="btn">${T[LANG].check}</button></div></div>`);
  const inp=card.querySelector('input'),btn=card.querySelector('button');
  btn.onclick=()=>{if(inp.value==='')return;_pick=inp.value+(q.unit?' '+q.unit:'');btn.onclick=null;inp.disabled=true;const ok=Math.abs(parseFloat(inp.value)-q.answer)<1e-6;
    inp.style.borderColor=ok?'var(--good)':'var(--bad)';inp.style.background=ok?'var(--goodbg)':'var(--badbg)';
    fbAdd(card,(`<div class="fb ${ok?'ok':'no'}">${ok?T[LANG].corr:T[LANG].wrongAns(q.answer,q.unit)}${v.explain}</div>`));advance(res,ok,last?T[LANG].results:null);};
  add(card);});}

// Free text can't be truthfully auto-graded in a static demo, so we NEVER fake a "correct".
// We only detect attempt vs non-attempt, and reveal the ideal answer to compare — always honest.
function long(q,last){return new Promise(res=>{const v=L(q);
  const card=el(`<div class="qcard"><span class="qtag">${v.tag}</span><div class="qtext">${v.q}</div><textarea class="long" placeholder="${T[LANG].typePh}"></textarea><button class="btn full">${T[LANG].submit}</button></div>`);
  const btn=card.querySelector('button'),ta=card.querySelector('textarea');
  btn.onclick=async()=>{const t=ta.value.trim();if(t.length<1){ta.focus();return;}_pick=t;btn.onclick=null;ta.disabled=true;btn.textContent=T[LANG].checking;
    await wait(1100);btn.style.display='none';
    const dunno=/^(i\s*)?(nhi|nahi|nahin|na|no|nope|dunno|idk|don'?t\s*know|no\s*idea|pata\s*(nahi|nhi)|nahi\s*pata|nhi\s*pata|kuch\s*(nahi|nhi)|blank|skip|\?+|\.+|-+)\s*$/i.test(t.toLowerCase());
    const notAttempt=dunno||t.replace(/\s+/g,'').length<8;
    const lead=notAttempt?T[LANG].longNo:T[LANG].longYes;
    card.appendChild(el(`<div class="hint">${lead}<br><br><b>${v.model}</b></div>`));
    log.scrollTop=log.scrollHeight;advance(res,true,last?T[LANG].results:null);};
  add(card);});}

const RENDER={mcq,truefalse,match,numeric,long};
const render=(q,last)=>RENDER[q.type](q,last);
// #2 per-type "slow" thresholds (ms). Correct-but-slow ⇒ hesitation ⇒ status 'shaky'.
const SLOW={mcq:13000,truefalse:9000,numeric:20000,match:22000};
// #5 Fisher-Yates shuffle — so options/pairs aren't in a canned, position-leaking order.
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// #4 confidence-calibration (default-on): 3-way (sure/think/guess) per graded answer → "sure + wrong"
// = the RED BOX signal (a confident misconception hides until it's tested).
const confLog=[]; let curGraded=true;
// what the student actually PICKED on the current question — for the teacher's per-answer review.
let _pick=null;
// the confidence the student tapped for the current question (sure|think|guess) — merged into the transcript.
let _conf=null;

function intro(){return new Promise(res=>{clear();fill.style.width='0%';plabel.textContent=T[LANG].ready;pscore.textContent=T[LANG].score+' 0';
  add(el(`<div class="qcard"><div class="say"><div class="who">ACHARYA</div>${S.intro[LANG]}</div></div>`));
  const b=el(`<button class="btn full">${T[LANG].start}</button>`);b.onclick=()=>res();add(b);});}

async function run(){
  await intro();
  const results=[];   // {topic:{en,hi}, status:'solid'|'shaky'|'weak', depth:'basics'|'application'|null} — built from ACTUAL answers
  const transcript=[];   // #6 per-question record for the end-of-test "review your answers"
  for(let i=0;i<TOTAL;i++){
    const q=S.questions[i],last=(i===TOTAL-1),topic=S.topicMap[i];
    clear();setHeader(i);
    curGraded=q.type!=='long';   // #4 long answers aren't graded → no calibration prompt
    const t0=performance.now();
    _pick=null; _conf=null;
    const ok=await render(q,last && !q.adaptive);
    const pick=_pick, conf=_conf;   // the student's answer + confidence on the MAIN question (before any adaptive follow-up)
    const dt=performance.now()-t0;
    if(q.type==='long'){ /* free text: honestly not auto-graded, so excluded from the diagnosis */ }
    else if(ok){ score++;
      const slow=dt>(SLOW[q.type]||14000);
      results.push({topic,status:slow?'shaky':'solid',depth:slow?'hesitation':null}); }
    else if(q.adaptive){
      clear();setHeader(i);
      say(T[LANG].adaptLead);
      if(q.adaptive.hint) add(el(`<div class="hint">${T[LANG].remember}${q.adaptive.hint[LANG]}</div>`));
      const a={type:q.adaptive.type||'mcq',easy:true,correct:q.adaptive.correct,answer:q.adaptive.answer,unit:q.adaptive.unit,pairs:q.adaptive.pairs,en:q.adaptive.en,hi:q.adaptive.hi};
      const aok=await render(a,last);   // did they pass the BASIC version? decides the DEPTH of the gap
      results.push({topic,status:aok?'shaky':'weak',depth:aok?'application':'basics'});
    } else {
      results.push({topic,status:'weak',depth:null});
    }
    transcript.push({q:L(q).q, a:answerText(q,L(q)), chosen:(pick==null?'':String(pick)), conf:(conf||''), explain:L(q).explain||'', ok:q.type==='long'?null:ok, type:q.type});
  }
  clear();fill.style.width='100%';plabel.textContent=T[LANG].complete;pscore.textContent=T[LANG].score+' '+score+'/'+GRADED;
  scorecard(results,transcript);
}
// #6 the correct answer as display text, per question type — for the review list
function answerText(q,v){
  if(q.type==='mcq') return v.opts[q.correct];
  if(q.type==='truefalse') return q.answer?T[LANG].tf[0]:T[LANG].tf[1];
  if(q.type==='numeric') return q.answer+(q.unit?' '+q.unit:'');
  if(q.type==='match') return v.left.map((l,i)=>`${l} → ${v.right[q.pairs[i]]}`).join(' · ');
  if(q.type==='long') return v.model;
  return '';
}
function scorecard(results,transcript){
  const pct=GRADED?Math.round(score/GRADED*100):0;
  const lab={solid:T[LANG].solid,shaky:T[LANG].shaky,weak:T[LANG].weakL};
  const chipCls={solid:'good',shaky:'shaky',weak:'weak'};
  // AGGREGATE per topic — a 5-question test on one concept must show ONE row, not five identical ones.
  const byTopic=new Map();
  results.forEach(r=>{ const k=(r.topic&&(r.topic.en||r.topic[LANG]))||'—';
    const cur=byTopic.get(k)||{topic:r.topic,n:0,solid:0,shaky:0,weak:0,depth:null};
    cur.n++; cur[r.status]=(cur[r.status]||0)+1;
    if(r.status==='weak'&&!cur.depth) cur.depth=r.depth;
    byTopic.set(k,cur); });
  const agg=[...byTopic.values()].map(a=>({
    topic:a.topic, depth:a.depth, n:a.n, right:a.solid,
    status: a.weak>=Math.max(a.solid,a.shaky) ? 'weak' : (a.shaky>=a.solid ? 'shaky' : 'solid')}));
  const rows=agg.map(r=>`<div class="r"><span>${r.topic[LANG]}${r.n>1?` <small style="color:var(--muted)">${r.right}/${r.n}</small>`:''}</span><span class="chip ${chipCls[r.status]}">${lab[r.status]}</span></div>`).join('');
  const weakRes=agg.filter(r=>r.status==='weak');
  const shakyRes=agg.filter(r=>r.status==='shaky');
  // priority next-step: real weakness first, then an application-level gap. Pure hesitation never becomes a "drill".
  const pri=weakRes.find(r=>r.depth==='basics')||weakRes[0]||shakyRes.find(r=>r.depth==='application');
  const weakNames=weakRes.map(r=>r.topic[LANG]).join(', ');
  const shakyNames=shakyRes.map(r=>r.topic[LANG]).join(', ');
  add(el(`<div class="score"><div class="ring" style="--p:${pct}"><b>${pct}%</b><span>${score}/${GRADED}</span></div>
    <h3>${T[LANG].complete}</h3><div class="sub">${S.title} · ${S.topic[LANG]}</div><div class="brk">${rows}</div></div>`));
  let msg=T[LANG].scored(score,GRADED);
  if(weakRes.length) msg+=' '+T[LANG].weakList(weakNames);
  if(shakyRes.length) msg+='<br><br>'+T[LANG].shakyNote(shakyNames);
  if(pri) msg+='<br><br>'+T[LANG].suggWeak(pri);
  else if(!weakRes.length&&!shakyRes.length) msg+='<br><br>'+T[LANG].allSolid;
  say(msg);
  // #4 confidently-wrong = the highest-value teaching signal (sure, but wrong) — the RED BOX, in-test
  {const cw=confLog.filter(c=>!c.ok&&c.sure).length; if(cw) say(T[LANG].confWrong(cw));}
  // #1 WhatsApp share — turns a score into a spreadable report + reproduces this exact test via the link
  const improve=[...weakRes,...shakyRes].map(r=>r.topic[LANG]).join(', ');
  const sp=new URLSearchParams();sp.set('subject',params.get('subject')||'neet-biology');sp.set('lang',LANG);
  const shareUrl=location.origin+location.pathname+'?'+sp.toString();
  const wa='https://wa.me/?text='+encodeURIComponent(T[LANG].shareText(pct,improve,shareUrl));
  add(el(`<a class="btn full" href="${wa}" target="_blank" rel="noopener" style="background:linear-gradient(135deg,#25D366,#128C7E);text-decoration:none;text-align:center;display:block">${T[LANG].shareLabel}</a>`));
  // #6 reviewable transcript — a score becomes a study artifact worth keeping
  const revItems=transcript.map(t=>{const badge=t.ok===null?'<span class="rv-b na">✎</span>':t.ok?'<span class="rv-b ok">✓</span>':'<span class="rv-b no">✕</span>';
    return `<div class="rv-q">${badge}<div class="rv-c"><div class="rv-t">${t.q}</div><div class="rv-a"><b>${T[LANG].ansLbl}</b> ${t.a}</div>${t.explain?`<div class="rv-e">${t.explain}</div>`:''}</div></div>`;}).join('');
  add(el(`<details class="review"><summary>${T[LANG].reviewLbl}</summary><div class="rv-body">${revItems}</div></details>`));
  // Student mode: persist the diagnosis to the account (session cookie authenticates) + student CTA.
  // Teacher-demo mode: the teacher-view link, as before.
  if(window.__CLASSTEST){
    // Teacher class-test mode: record the sitting (name is server-side in the session) so the
    // teacher's dashboard sees this student's real score + weak topics. No account needed.
    try{fetch(window.__CLASSTEST.sittingUrl,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({code:window.__CLASSTEST.code,score:score,graded:GRADED,
        results:results.map(r=>({topic:r.topic.en,status:r.status,depth:r.depth||null})),
        // per-question record so the teacher can see exactly what this student answered
        detail:(transcript||[]).map(t=>({q:t.q,a:t.a,chosen:t.chosen||'',conf:t.conf||'',explain:t.explain||'',ok:t.ok,type:t.type}))})}).catch(()=>{});}catch(e){}
    add(el(`<div class="footnote" style="text-align:center">✅ ${LANG==='hi'?'जमा हो गया — आपके टीचर को आपका परिणाम दिख जाएगा।':'Submitted — your teacher can now see your result.'}</div>`));
  } else if(window.__STUDENT){
    try{fetch('/api/assess/complete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({subject:(window.__SUBJECT||''),title:(window.__TITLE||window.__GEN_TITLE||''),score:score,graded:GRADED,
        results:results.map(r=>({topic:r.topic.en,status:r.status,depth:r.depth||null})),
        // full paper so the student can REOPEN this test later from their report (+ teacher review)
        detail:(transcript||[]).map(t=>({q:t.q,a:t.a,chosen:t.chosen||'',conf:t.conf||'',explain:t.explain||'',ok:t.ok,type:t.type}))})}).catch(()=>{});}catch(e){}
    add(el(`<a class="btn ghost full" href="/exam-prep/dashboard">${T[LANG].another}</a>`));
    add(el(`<div class="footnote">${T[LANG].studFoot}</div>`));
  } else {
    add(el(`<a class="btn ghost full" href="/dashboard" target="_blank" rel="noopener">${T[LANG].teacherView}</a>`));
    add(el(`<div class="footnote">${T[LANG].foot}</div>`));
  }
  add(el(`<button class="btn ghost full" onclick="location.reload()">${T[LANG].restart}</button>`));
}
// ── boot: a pack (curated SUBJECTS entry, injected window.__PACK, or a generated one) drives everything
const GEN={
  en:{msg:t=>`✍️ Preparing your <b>${t}</b> test — Acharya is writing fresh questions for you. This takes a few seconds the first time…`,
      err:"Sorry — couldn't prepare that test right now. Please try again, or pick a listed exam."},
  hi:{msg:t=>`✍️ आपका <b>${t}</b> टेस्ट तैयार हो रहा है — आचार्य आपके लिए नए सवाल लिख रहे हैं। पहली बार कुछ सेकंड लगते हैं…`,
      err:"माफ़ करें — अभी वह टेस्ट तैयार नहीं हो सका। फिर से कोशिश करें, या दी गई किसी exam को चुनें।"}};
function boot(pack){
  S=pack; TOTAL=S.questions.length; GRADED=S.questions.filter(q=>q.type!=='long').length; score=0;
  document.getElementById('hsub').textContent=S.title+(S.topic?' · '+S.topic[LANG]:'');
  document.querySelectorAll('.langtog button').forEach(b=>{b.classList.toggle('on',b.dataset.l===LANG);
    b.onclick=()=>{ if(b.dataset.l===LANG) return; params.set('lang',b.dataset.l); location.search=params.toString(); };});
  run();
}
async function prepareThenRun(){
  const title=window.__GEN_TITLE||'exam';
  plabel.textContent='…'; pscore.textContent='';
  add(el(`<div class="qcard"><div class="say"><div class="who">ACHARYA</div>${GEN[LANG].msg(title)}</div></div>`));
  try{
    const r=await fetch(window.__GEN_URL,{credentials:'same-origin'});
    const j=await r.json();
    if(!j||!j.ok||!j.pack||!j.pack.questions||!j.pack.questions.length) throw new Error((j&&j.error)||'gen');
    clear(); boot(j.pack);
  }catch(e){ clear(); add(el(`<div class="qcard"><div class="say"><div class="who">ACHARYA</div>${GEN[LANG].err}</div></div>`)); }
}
if(window.__PACK){ boot(window.__PACK); }
else if(window.__GEN_URL){ prepareThenRun(); }
else { boot(SUBJECTS[window.__SUBJECT||params.get('subject')]||SUBJECTS['neet-biology']); }
</script>
</body></html>
