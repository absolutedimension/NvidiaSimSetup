<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Acharya · TrigunAI Gurukul</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --line:#e8eaee; --text:#1a1d23; --muted:#7a818c;
    --bot:#f2f4f7; --me:#111418; --me-text:#ffffff; --accent:#2563eb; --code:#f4f5f7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ display:flex; flex-direction:column; height:100dvh; max-width:780px; margin:0 auto;
    background:var(--panel); box-shadow:0 0 60px rgba(20,30,60,.06); }
  header{ display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--panel);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header .ava{ width:42px; height:42px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; }
  header .ava img{ width:30px; height:30px; object-fit:contain; }
  header .t{ font-weight:650; font-size:15.5px; letter-spacing:-.01em; }
  header .s{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  #log{ flex:1; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:14px;
    background:linear-gradient(#fbfcfd,#f7f8fa); }
  .row{ display:flex; }
  .row.me{ justify-content:flex-end; }
  .msg{ max-width:80%; padding:11px 15px; border-radius:18px; line-height:1.5; font-size:15px;
    word-wrap:break-word; overflow-wrap:anywhere; }
  .bot{ background:var(--bot); color:var(--text); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .me .msg{ background:var(--me); color:var(--me-text); border-bottom-right-radius:5px; }
  .msg strong{ font-weight:650; } .msg em{ font-style:italic; }
  .msg a{ color:var(--accent); } .me .msg a{ color:#9ec1ff; }
  .msg code{ background:var(--code); padding:1.5px 6px; border-radius:6px; font-size:13.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .msg pre{ background:#0f1115; color:#e6edf3; padding:13px 15px; border-radius:12px; overflow-x:auto;
    font-size:13px; margin:8px 0; }
  .msg pre code{ background:none; padding:0; color:inherit; }
  .typing{ display:flex; gap:5px; padding:15px; background:var(--bot); border:1px solid var(--line);
    border-radius:18px; border-bottom-left-radius:5px; width:fit-content; }
  .typing span{ width:7px; height:7px; background:#b7bcc5; border-radius:50%; animation:b 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.18s} .typing span:nth-child(3){animation-delay:.36s}
  @keyframes b{ 0%,60%,100%{opacity:.35;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }
  form{ display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--line); }
  #inp{ flex:1; resize:none; border:1px solid var(--line); background:#fff; color:var(--text);
    border-radius:24px; padding:12px 18px; font-size:15px; max-height:130px; outline:none;
    transition:border-color .15s; }
  #inp:focus{ border-color:#c7cdd6; }
  #send{ background:var(--me); color:#fff; border:none; border-radius:50%; width:46px; height:46px;
    font-size:17px; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  #send:disabled{ opacity:.45; }
  @media (max-width:600px){ #log{padding:16px 12px;} .msg{max-width:86%; font-size:15.5px;} header{padding:12px 16px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ava"><img src="/chat/logo.png" alt="" onerror="this.parentNode.textContent='🪔'"/></div>
    <div><div class="t">Acharya</div><div class="s">your AI guru · TrigunAI Gurukul 🪔</div></div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="inp" rows="1" placeholder="Message Acharya…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="Send">➤</button>
  </form>
</div>
<script>
const log=document.getElementById('log'), inp=document.getElementById('inp'),
      f=document.getElementById('f'), sendBtn=document.getElementById('send');
const token=new URLSearchParams(location.search).get('t')||'';

function md(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.replace(/\n+$/,'')}</code></pre>`);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
     .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
     .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return t.split(/(<pre>[\s\S]*?<\/pre>)/).map(s=>s.startsWith('<pre>')?s:s.replace(/\n/g,'<br>')).join('');
}
function add(text,who){ const r=document.createElement('div'); r.className='row '+who;
  const d=document.createElement('div'); d.className='msg '+who;
  if(who==='bot') d.innerHTML=md(text); else d.textContent=text;
  r.appendChild(d); log.appendChild(r); log.scrollTop=log.scrollHeight; return r; }
function typing(){ const r=document.createElement('div'); r.className='row bot';
  r.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  log.appendChild(r); log.scrollTop=log.scrollHeight; return r; }
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,130)+'px'; });
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); f.requestSubmit(); }});
async function send(text){
  add(text,'me'); inp.value=''; inp.style.height='auto'; sendBtn.disabled=true;
  const t=typing();
  try{ const r=await fetch('/chat/api',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,message:text})});
    const j=await r.json(); t.remove(); add(j.reply||'🪔 hmm — try that again.','bot');
  }catch(e){ t.remove(); add('Connection hiccup — please resend.','bot'); }
  sendBtn.disabled=false; inp.focus();
}
f.addEventListener('submit',e=>{ e.preventDefault(); const v=inp.value.trim(); if(v) send(v); });
add("🪔 Welcome back. I'm **Acharya**, your guide. Pick up where we left off — or just say hi.",'bot');
inp.focus();
</script>
</body>
</html>
