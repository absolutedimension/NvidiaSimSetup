<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gurukul · Admin</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --line:#eceef1; --text:#161a20; --muted:#7b828d;
    --ok:#0f9d58; --warn:#d98b00; --blue:#2563eb; --shadow:0 1px 3px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.04); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  header{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  header img{ width:40px; height:40px; }
  header h1{ font-size:21px; font-weight:680; letter-spacing:-.02em; margin:0; }
  header .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  header .refresh{ margin-left:auto; font-size:12.5px; color:var(--muted); }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
  .stat .n{ font-size:30px; font-weight:720; letter-spacing:-.02em; }
  .stat .l{ font-size:13px; color:var(--muted); margin-top:2px; }
  .stat.active .n{ color:var(--ok); } .stat.inactive .n{ color:var(--warn); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
  .s{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .s .top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .s .nm{ font-weight:650; font-size:16px; }
  .s .id{ font-size:12.5px; color:var(--muted); }
  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; margin-left:auto; }
  .badge.wa{ background:#e7f7ee; color:#0f9d58; } .badge.web{ background:#e8efff; color:#2563eb; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .dot.on{ background:var(--ok); } .dot.off{ background:#cfd4db; }
  .row{ display:flex; gap:18px; margin:10px 0; }
  .kv .k{ font-size:11.5px; color:var(--muted); } .kv .v{ font-weight:620; }
  .bar{ height:6px; background:#eef0f3; border-radius:6px; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#2563eb,#0f9d58); }
  .meta{ font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.55; }
  .tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:11px; background:#f1f3f6; color:#525a66; padding:2px 9px; border-radius:20px; }
  .empty{ text-align:center; color:var(--muted); padding:60px; }
  @media(max-width:680px){ .stats{grid-template-columns:1fr 1fr 1fr; gap:10px;} .stat{padding:14px;} .stat .n{font-size:24px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/chat/logo.png" alt="" onerror="this.style.display='none'"/>
    <div><h1>TrigunAI Gurukul · Admin</h1><div class="sub">live student progress</div></div>
    <div class="refresh" id="ref">updating…</div>
  </header>
  <div class="stats">
    <div class="stat"><div class="n" id="t">–</div><div class="l">Total students</div></div>
    <div class="stat active"><div class="n" id="a">–</div><div class="l">Active (24h)</div></div>
    <div class="stat inactive"><div class="n" id="i">–</div><div class="l">Inactive</div></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const TOTAL_CONCEPTS = 18;
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function rel(iso){ if(!iso) return 'never'; const m=(Date.now()-Date.parse(iso))/60000;
  if(m<1)return 'just now'; if(m<60)return Math.round(m)+'m ago'; if(m<1440)return Math.round(m/60)+'h ago'; return Math.round(m/1440)+'d ago'; }
function isActive(iso){ return iso && (Date.now()-Date.parse(iso))<86400000; }
async function load(){
  try{
    const r=await fetch('/admin/api?k='+encodeURIComponent(KEY));
    if(r.status===401){ document.getElementById('grid').innerHTML='<div class="empty">🔒 Add ?k=YOUR_KEY to the URL.</div>'; return; }
    const d=await r.json();
    document.getElementById('t').textContent=d.total;
    document.getElementById('a').textContent=d.active;
    document.getElementById('i').textContent=d.inactive;
    document.getElementById('ref').textContent='updated '+new Date().toLocaleTimeString();
    const g=document.getElementById('grid');
    if(!d.students.length){ g.innerHTML='<div class="empty">No students yet — they appear here once they say hi.</div>'; return; }
    g.innerHTML=d.students.map(s=>{
      const pct=Math.round((s.solid/TOTAL_CONCEPTS)*100);
      const tags=(s.interests||[]).slice(0,4).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
      return `<div class="s">
        <div class="top">
          <span class="dot ${isActive(s.updated)?'on':'off'}"></span>
          <div><div class="nm">${esc(s.name)||'(unnamed)'}</div><div class="id">${esc(s.id)}</div></div>
          <span class="badge ${s.channel==='web'?'web':'wa'}">${s.channel}</span>
        </div>
        <div class="row">
          <div class="kv"><div class="k">Module</div><div class="v">M${s.module}</div></div>
          <div class="kv"><div class="k">Concepts solid</div><div class="v">${s.solid}/${s.touched||0}</div></div>
          <div class="kv"><div class="k">Streak</div><div class="v">${s.streak}🔥</div></div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta">
          📚 ${esc(s.course||'agentic')}<br>
          ${s.goal?`🎯 ${esc(s.goal)}<br>`:''}
          ${s.background?`💼 ${esc(s.background)} · `:''}${s.level?esc(s.level):''}
          ${s.last_win?`<br>✨ ${esc(s.last_win)}`:''}
          <br>🕑 last active ${rel(s.updated)}
        </div>
        ${tags?`<div class="tags">${tags}</div>`:''}
      </div>`;
    }).join('');
  }catch(e){ document.getElementById('ref').textContent='offline — retrying'; }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
