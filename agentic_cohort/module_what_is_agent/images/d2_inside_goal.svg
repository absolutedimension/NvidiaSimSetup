<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif"><rect width="1200" height="560" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b63e6"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d99a2b"/></marker><marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a99"/></marker></defs><text x="600" y="50" font-size="30" fill="#23232b" font-weight="600" text-anchor="middle">Look inside a goal — you never find one action</text><text x="600" y="82" font-size="16" fill="#8a8a99" font-weight="400" text-anchor="middle">You find a structure: many activities running in a direction, each sensing where it is and feeding a correction back to your system.</text><rect x="470" y="120" width="260" height="56" rx="14" fill="#eef0fb" stroke="#c9d0f5" stroke-width="2"/><text x="600" y="155" font-size="22" fill="#4a52d6" font-weight="600" text-anchor="middle">THE GOAL</text><rect x="960" y="250" width="200" height="90" rx="14" fill="#fbf1da" stroke="#e8c98c" stroke-width="2"/><text x="1060" y="285" font-size="16" fill="#d99a2b" font-weight="600" text-anchor="middle">YOUR SYSTEM</text><text x="1060" y="310" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">state / skill /</text><text x="1060" y="328" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">resources</text><rect x="140" y="270" width="150" height="70" rx="14" fill="#fff" stroke="#5b63e6" stroke-width="2"/><text x="215.0" y="304" font-size="16" fill="#23232b" font-weight="600" text-anchor="middle">Activity 1</text><text x="215.0" y="325" font-size="12" fill="#8a8a99" font-weight="400" text-anchor="middle">do → result</text><line x1="290" y1="305.0" x2="320" y2="305.0" stroke="#5b63e6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="320" y="270" width="150" height="70" rx="14" fill="#fff" stroke="#5b63e6" stroke-width="2"/><text x="395.0" y="304" font-size="16" fill="#23232b" font-weight="600" text-anchor="middle">Activity 2</text><text x="395.0" y="325" font-size="12" fill="#8a8a99" font-weight="400" text-anchor="middle">do → result</text><line x1="470" y1="305.0" x2="500" y2="305.0" stroke="#5b63e6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="270" width="150" height="70" rx="14" fill="#fff" stroke="#5b63e6" stroke-width="2"/><text x="575.0" y="304" font-size="16" fill="#23232b" font-weight="600" text-anchor="middle">Activity 3</text><text x="575.0" y="325" font-size="12" fill="#8a8a99" font-weight="400" text-anchor="middle">do → result</text><line x1="650" y1="305.0" x2="680" y2="305.0" stroke="#5b63e6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="680" y="270" width="150" height="70" rx="14" fill="#fff" stroke="#5b63e6" stroke-width="2"/><text x="755.0" y="304" font-size="16" fill="#23232b" font-weight="600" text-anchor="middle">Activity 4</text><text x="755.0" y="325" font-size="12" fill="#8a8a99" font-weight="400" text-anchor="middle">do → result</text><line x1="540" y1="176" x2="215" y2="270" stroke="#5b63e6" stroke-width="2.5" marker-end="url(#ah)"/><path d="M215.0,340 C 215.0,420 960,420 1010,340" fill="none" stroke="#8a8a99" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahm)"/><path d="M395.0,340 C 395.0,420 960,420 1010,340" fill="none" stroke="#8a8a99" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahm)"/><path d="M575.0,340 C 575.0,420 960,420 1010,340" fill="none" stroke="#8a8a99" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahm)"/><path d="M755.0,340 C 755.0,420 960,420 1010,340" fill="none" stroke="#8a8a99" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahm)"/><path d="M960,295 C 760,180 360,150 290,270" fill="none" stroke="#d99a2b" stroke-width="2.5" marker-end="url(#ahg)"/><text x="560" y="470" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="start">feedback</text><text x="600" y="500" font-size="18" fill="#4a52d6" font-weight="600" text-anchor="middle">The unit of a goal is not “an action.”  It is an activity + its feedback loop.</text></svg>