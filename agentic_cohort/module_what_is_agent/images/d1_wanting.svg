<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif"><rect width="1200" height="520" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b63e6"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d99a2b"/></marker><marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a99"/></marker></defs><text x="600" y="54" font-size="30" fill="#23232b" font-weight="600" text-anchor="middle">A goal is a projection of yourself into the future</text><text x="600" y="86" font-size="17" fill="#8a8a99" font-weight="400" text-anchor="middle">Dream · Goal · Outcome · Desire — different words, one shape: a state that does not exist yet, that you pull toward.</text><line x1="120" y1="300" x2="1080" y2="300" stroke="#5b63e6" stroke-width="4" marker-end="url(#ah)"/><circle cx="140" cy="300" r="34" fill="#eef0fb" stroke="#5b63e6" stroke-width="3"/><text x="140" y="306" font-size="17" fill="#4a52d6" font-weight="600" text-anchor="middle">YOU</text><text x="140" y="370" font-size="15" fill="#8a8a99" font-weight="400" text-anchor="middle">present state</text><circle cx="1040" cy="300" r="40" fill="#fbf1da" stroke="#d99a2b" stroke-width="3"/><text x="1040" y="307" font-size="30" fill="#d99a2b" font-weight="700" text-anchor="middle">★</text><text x="1040" y="378" font-size="15" fill="#d99a2b" font-weight="600" text-anchor="middle">desired state</text><rect x="285" y="150" width="190" height="76" rx="12" fill="#eaf9ef" stroke="#bfe9cd" stroke-width="2"/><text x="380" y="178" font-size="19" fill="#22c55e" font-weight="600" text-anchor="middle">DESIRE</text><text x="380" y="202" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">the fuel — why you move</text><line x1="380" y1="226" x2="380" y2="288" stroke="#22c55e" stroke-width="2"/><circle cx="380" cy="300" r="7" fill="#22c55e"/><rect x="525" y="150" width="190" height="76" rx="12" fill="#eef0fb" stroke="#c9d0f5" stroke-width="2"/><text x="620" y="178" font-size="19" fill="#4a52d6" font-weight="600" text-anchor="middle">GOAL</text><text x="620" y="202" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">named + dated + committed</text><line x1="620" y1="226" x2="620" y2="288" stroke="#4a52d6" stroke-width="2"/><circle cx="620" cy="300" r="7" fill="#4a52d6"/><rect x="765" y="150" width="190" height="76" rx="12" fill="#eef0fb" stroke="#c9d0f5" stroke-width="2"/><text x="860" y="178" font-size="19" fill="#4a52d6" font-weight="600" text-anchor="middle">OUTCOME</text><text x="860" y="202" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">the measurable end-state</text><line x1="860" y1="226" x2="860" y2="288" stroke="#4a52d6" stroke-width="2"/><circle cx="860" cy="300" r="7" fill="#4a52d6"/><text x="1040" y="180" font-size="19" fill="#d99a2b" font-weight="600" text-anchor="middle">DREAM</text><text x="1040" y="204" font-size="13" fill="#8a8a99" font-weight="400" text-anchor="middle">far · fuzzy · pulls</text><line x1="1040" y1="226" x2="1040" y2="256" stroke="#d99a2b" stroke-width="2" stroke-dasharray="4 4"/><text x="600" y="470" font-size="18" fill="#4a52d6" font-weight="600" text-anchor="middle">Define:  a goal is a future state you are committed to bringing into reality.</text></svg>