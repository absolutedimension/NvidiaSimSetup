<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif"><rect width="1200" height="560" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b63e6"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d99a2b"/></marker><marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8a99"/></marker></defs><text x="600" y="50" font-size="30" fill="#23232b" font-weight="600" text-anchor="middle">Human or AI — the agent is the same loop</text><text x="600" y="82" font-size="16" fill="#8a8a99" font-weight="400" text-anchor="middle">Made of will and muscle, or of an LLM and tools — the shape is identical.</text><circle cx="600" cy="180" r="58" fill="#eef0fb" stroke="#5b63e6" stroke-width="2.5"/><text x="600" y="185" font-size="16" fill="#4a52d6" font-weight="700" text-anchor="middle">PERCEIVE</text><circle cx="720" cy="300" r="58" fill="#eef0fb" stroke="#5b63e6" stroke-width="2.5"/><text x="720" y="305" font-size="16" fill="#4a52d6" font-weight="700" text-anchor="middle">DECIDE</text><circle cx="600" cy="420" r="58" fill="#eef0fb" stroke="#5b63e6" stroke-width="2.5"/><text x="600" y="425" font-size="16" fill="#4a52d6" font-weight="700" text-anchor="middle">ACT</text><circle cx="480" cy="300" r="58" fill="#eef0fb" stroke="#5b63e6" stroke-width="2.5"/><text x="480" y="305" font-size="16" fill="#4a52d6" font-weight="700" text-anchor="middle">OBSERVE</text><path d="M645,210 A 120 120 0 0 1 690,255" fill="none" stroke="#5b63e6" stroke-width="3" marker-end="url(#ah)"/><path d="M690,345 A 120 120 0 0 1 645,390" fill="none" stroke="#5b63e6" stroke-width="3" marker-end="url(#ah)"/><path d="M555,390 A 120 120 0 0 1 510,345" fill="none" stroke="#5b63e6" stroke-width="3" marker-end="url(#ah)"/><path d="M510,255 A 120 120 0 0 1 555,210" fill="none" stroke="#5b63e6" stroke-width="3" marker-end="url(#ah)"/><text x="150" y="90" font-size="16" fill="#22c55e" font-weight="700" text-anchor="start">HUMAN</text><text x="1050" y="90" font-size="16" fill="#d99a2b" font-weight="700" text-anchor="end">AI AGENT</text><text x="150" y="110" font-size="14" fill="#23232b" font-weight="500" text-anchor="start">PERCEIVE: see where you are</text><text x="1050" y="110" font-size="14" fill="#23232b" font-weight="500" text-anchor="end">PERCEIVE: read input · context · tool results</text><text x="150" y="195" font-size="14" fill="#23232b" font-weight="500" text-anchor="start">DECIDE: think what to do</text><text x="1050" y="195" font-size="14" fill="#23232b" font-weight="500" text-anchor="end">DECIDE: the LLM reasons</text><text x="150" y="280" font-size="14" fill="#23232b" font-weight="500" text-anchor="start">ACT: do it</text><text x="1050" y="280" font-size="14" fill="#23232b" font-weight="500" text-anchor="end">ACT: call a tool / API</text><text x="150" y="365" font-size="14" fill="#23232b" font-weight="500" text-anchor="start">OBSERVE: read the feedback</text><text x="1050" y="365" font-size="14" fill="#23232b" font-weight="500" text-anchor="end">OBSERVE: read the result, loop again</text><text x="600" y="500" font-size="19" fill="#4a52d6" font-weight="700" text-anchor="middle">A chatbot answers once.  An agent runs the loop until the job is done.</text></svg>